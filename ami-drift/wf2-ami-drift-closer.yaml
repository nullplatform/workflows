# AMI Drift Closer — closes ami-drift action items that no longer apply.
#
# Recomputes the CURRENT drift set with the same detection logic as the
# scanner (lake → active EC2 deployments + scope dimensions; EC2 PROVIDERS
# + runtime configurations → per-scope expected AMI via nrn+dimensions
# matching), then closes every open ami-drift item whose drift_key is not
# in that set (scope redeployed with the configured AMI, scope no longer
# active, or the provider config changed to match). A comment with the
# close reason is added before closing (the close transition itself
# carries no reason field).
#
# v2.2 FIX (2026-07-28) — post-incident, on a customer org.
# Symptom: 8 already-closed ami-drift items collected 54 duplicate
# "Closing automatically" comments between 2026-07-18 and 2026-07-22, and
# the nightly run failed outright on 07-22.
#
# Root cause chain (each link is independently fixed below):
#   1. The NP action_item LISTING leaked `closed` rows out of a
#      `status=open` query. Proven from the stored engine state of run
#      fa05435f-…: find returned 95 items = 87 open + 8 closed. The list
#      query itself was correct. This is a server-side filter leak we do
#      not control, so the workflow must be robust to it.
#   2. The closer had no client-side status guard, so those closed rows
#      were treated as closeable. (Already fixed in v2.1: `decide`
#      double-guards `status !== 'open'` → keep. v2.1 was authored but
#      NEVER ACTIVATED on that org — the `live` alias still pointed at rev 1,
#      which is why the guard did not save us. Activation is the other
#      half of this fix; see the deploy note at the bottom.)
#   3. Comment came BEFORE close, so the comment landed even though the
#      close then failed → the visible spam. v2.2 inverts this: close
#      first, then comment ONLY the ids that actually transitioned
#      (attribution by response `actionItem.id`, not by index).
#   4. `close` on an already-closed item returns 400 "Invalid action item
#      status transition", which failed the step terminally and — with no
#      per-item attribution on a forEach failure — discarded the whole
#      page. v2.2 sets `ignoreInvalidTransition: true` so that specific
#      400 becomes a no-op (`skipped: true`) instead. Requires the engine
#      change shipped alongside this revision; on an older engine the flag
#      is simply ignored (unknown config keys are dropped), and the
#      reordering in (3) still prevents the spam on its own.
#
# v2.1 FIX (2026-07-21): v2.0 only ever closed items on the FIRST page —
# `np-action-item-find` was called once with `limit: 200` and no cursor, so
# an org with >200 open ami-drift items silently left the rest open
# forever. The streaming-pagination pattern (CLAUDE.md § Workflow
# Authoring) was broken on Temporal until this week's engine fix; now that
# it works, this revision replaces the single-page find with a proper
# paged sweep — every page of open items gets evaluated, not just the
# first 200. Mirrors workflows/runtime-lifecycle/wf-r5-closer.yaml's
# wiring (the post-fix canonical reference for this pattern), adapted
# because this closer does its own close/comment side effects inline
# (no per-item sub-workflow — the decision logic here is simple enough
# not to need one).
#
# Two phases, kept clearly separate on the canvas:
#   Phase A (unchanged logic, still runs exactly ONCE per run): recompute
#     the current drift set from the lake + EC2 providers, same as before,
#     and stash it into `variables.drift_set`. Still gated by
#     build_provider_index's empty-baseline guard — "only close after a
#     full successful recompute" holds because Phase B (which can close
#     items) is structurally downstream of Phase A's last step and can
#     only start once Phase A finished without throwing.
#   Phase B (new): stream every page of open ami-drift items
#     (np-entity-paginated-fetch, mode: stream) and, per item, decide
#     close vs keep against `variables.drift_set` — then run the
#     close/comment side effects only for the ones marked `close`.
#
# Why there's an extra `select_to_close` node between `decide` and the
# close/comment steps (unlike wf-r5, which routes 100% of items into its
# per-item sub-workflow): a `decider` (type: decider) can only look at
# `$item` (== items[0]) when it receives a BATCH of items — it does NOT
# fan out per item and branch each one to a different port (see
# packages/core/src/plugins/built-in/conditional/plugin.ts). So a decider
# cannot filter "only the close ones" out of a multi-item page. Instead
# `decide` computes a verdict per item (per-item fan-out, see below) and
# `select_to_close` (a plain aggregate step) filters that list down to the
# ids that actually need closing, which `comment_closing`/`close_items`
# then iterate via `forEach` — same forEach mechanism v2.0 already used,
# just re-scoped to one page instead of the whole (broken) single find.
#
# Engine fact — single-item pages: the generic per-item fan-out
# (workflow-runner.ts `shouldFanOut`) only activates when the upstream
# page has MORE THAN ONE item (`upstreamItems.length <= 1` short-circuits
# to a single plain call even with `metadata.fanOutPerItem: true`). Reading
# `steps.decide.items` (NOT `steps.decide.outputs.items` — `items` is a
# TOP-LEVEL sibling of `outputs` on a step's result, only nested under
# `outputs` for plugins that put it there themselves, like the `forEach`
# coordinator's own `{outputs: {items, count}}` shape) is safe either way:
# `buildScope()` (workflow-runner.ts) defaults `steps.<id>.items` to
# `[outputs]` whenever the step didn't report a real `items[]`, which is
# exactly the fan-out-skipped, single-item-page case. So a 1-item last
# page is never silently dropped — no manual fallback needed here.
#
# Engine fact — status filter: `np-entity-paginated-fetch` hits the
# generic `/governance/action_item` listing endpoint, which — per
# wf-r5-closer.yaml's own header note — does not reliably honor a
# `status` filter server-side. `filters.status: open` is declared below
# for intent/documentation, but `decide` ALSO double-guards on
# `item.status === 'open'` so a non-open item that slips through the
# filter is always `keep`d (matches v2.0's "only open items are closed,
# deferred ones left alone" invariant, now enforced defensively instead
# of assumed).
#
# Failure isolation: `close_items` (the step that actually performs the
# close — the highest-value thing to protect) is the ONE lane, mirroring
# wf-r5's single-lane pattern (verify_item → verify_item_failed →
# acc_results_failed), but wired differently: `close_items` is a `forEach`
# step, and `error_handling.fallback_step` does NOT work on `forEach` (see
# the engine-fact comment right above the `close_items` step below — the
# runner's forEach branch only ever consults `continueOnError`, never
# `fallbackStep`). So `close_items` uses `continueOnError: true` and a
# `close_ok` decider (reading `steps.close_items.status`) routes to either
# `acc_results` (success) or `close_failed` (failure) — same two
# destinations a `fallback_step` lane would have, just reached through a
# decider instead of a declared `condition: "false"` edge. A failure there
# discards per-item attribution for the WHOLE page (documented, same
# accepted trade-off as wf-r5 — the engine has no per-item attribution on
# a failed batch) but does NOT stop the sweep: the failure lane re-enters
# the pagination loop so later pages still get processed. `decide` and
# `comment_closing` are NOT separately protected in this revision — a
# failure in either of those two fails the whole run today (same as
# v2.0's "no isolation on any step" behavior for everything except this
# fix's target). Flagged as a follow-up, not required by this fix.
#
# Payload diet: `fetch_items.config.limit: 25` (NOT the usual 100) —
# ami-drift action item rows carry a heavier `metadata` object
# (scope_name, application, deployed_ami, expected_ami, deployment_id,
# detected_at, drift_key) than wf-r5's lambda-runtime rows; 25 keeps a
# page's payload well clear of Temporal's 2MB activity-input cap (the
# same class of finding documented in wf-r5-closer.yaml's header).
#
# /provider fetch pagination (judgment call): `fetch_providers` below is
# UNCHANGED from v2.0/the scanner — still a single call with `limit: 200`
# and a `build_rc_paths` warning log if that limit is hit. EC2 providers
# are operator-managed CONFIG entries (one per nrn+dimensions combination
# an operator has explicitly set up), not per-deployment/per-scope data —
# realistically bounded well under 200 for any org today, unlike the
# thousands-of-scopes scale that made the item-list pagination bug a real
# problem. Left unpaginated deliberately (same as the scanner, wf1, which
# has this exact same shape and is out of scope for this fix); the
# existing >=200 warning log is the acceptable degradation signal if that
# assumption ever breaks.
#
# Data flows step→step through declared `inputs:`/forEach expressions — no
# set-variable hops for Phase A. Besides the serializer shared-ref hazard,
# the np-* plugins merge `{...config, ...ctx.inputs}`, so an upstream
# output field named like a config key (set-variable emits `path`!)
# silently hijacks the plugin config.
#
# Per-org configuration: same config entries as the scanner.
id: ami_drift_closer
name: "AMI Drift Closer"
description: >
  Daily job (04:00, also manual) that closes ami-drift action items whose
  drift is no longer detected. Only closes after a full successful recompute
  of the drift set. Streams every page of open ami-drift items (not just the
  first 200).
path: "/action-items/ami-drift"
semantic_version: 2.2.0

variables:
  # Phase A's output: drift_key set for scopes still genuinely drifted
  # right now. Stashed once, read by every page's `decide` in Phase B.
  drift_set:
    initialValue: []
  # Phase B accumulator: one row per evaluated item (or one failure-lane
  # row per failed page). Read by `summary` at the very end.
  results:
    initialValue: []

steps:
  - id: start_manual
    type: trigger
    plugin_type: manual
    name: "Run Closer Now"
    config:
      description: "Re-validates open ami-drift action items and closes the ones that no longer apply."

  - id: start_cron
    type: trigger
    plugin_type: cron
    name: "Nightly Close"
    config:
      schedule: "0 4 * * *"
      timezone: "America/Argentina/Buenos_Aires"

  # ── Phase A: recompute current drift set (same logic as the scanner) ──
  - id: lake_deployments
    type: module
    plugin_type: np-lake-query
    # Reached from either trigger directly (find_open_items no longer sits
    # in front of it — see header note).
    join_strategy: any
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "Active EC2 Deployments (lake)"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      # scope_dimensions joined from core_entities_scope_dimension — same
      # enriched query as the scanner (provider matching needs them).
      sql: |
        SELECT d.id AS deployment_id, d.scope_id AS scope_id, s.name AS scope_name, s.nrn AS scope_nrn,
               a.app_name AS application,
               JSONExtractString(m.data, 'ec2', 'ami_id') AS deployed_ami,
               toString(d.created_at) AS deployed_at,
               dims.dimensions AS scope_dimensions
        FROM core_entities_deployment AS d FINAL
        JOIN core_entities_scope AS s FINAL ON d.scope_id = s.id AND s._deleted = 0
        JOIN core_entities_application AS a FINAL ON s.application_id = a.app_id AND a._deleted = 0
        LEFT JOIN core_entities_metadata AS m FINAL
          ON m.entity = 'deployment' AND m.metadata_type = 'infrastructure_configuration'
          AND m.id = toString(d.id) AND m._deleted = 0
        LEFT JOIN (
          SELECT scope_id, mapFromArrays(groupArray(dimension_slug), groupArray(value_slug)) AS dimensions
          FROM core_entities_scope_dimension FINAL
          WHERE _deleted = 0
          GROUP BY scope_id
        ) AS dims ON dims.scope_id = d.scope_id
        WHERE d._deleted = 0
          AND d.status_in_scope = 'active'
          AND s.type = 'web_pool'
          AND s.provider = 'AWS:WEB_POOL:EC2INSTANCES'
          AND s.status = 'active'
        LIMIT 5000

  # ── Baseline: configured AMIs from EC2 PROVIDERS (mirrors the scanner) ─
  - id: fetch_providers
    type: module
    plugin_type: np-api-call
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "List EC2 Providers"
    inputs:
      upstream_count: "${{ steps.lake_deployments.outputs.count }}"
    output_projection:
      - status
      - body.results[].id
      - body.results[].nrn
      - body.results[].dimensions
      - body.results[].data_source
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      # NOT paginated — see header note "/provider fetch pagination
      # (judgment call)". build_rc_paths below still logs a warning if
      # this 200 limit is ever hit.
      path: "/provider?nrn=organization=${{ vars.NP_ORGANIZATION_ID }}&specification_id=f784061e-5b6d-4a0d-a19b-754e7f4ef72c&show_descendants=true&limit=200"

  - id: build_rc_paths
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "Build Provider Detail Paths"
    inputs:
      providers: "${{ steps.fetch_providers.outputs.body.results }}"
    config:
      code: |
        // v1.5: fetch each provider BY ID — the detail endpoint returns the
        // provider's RESOLVED attributes (attributes.ami.id) regardless of
        // whether the org stores values inline or behind a data_source →
        // runtime_configuration pointer, and it resolves fine even when the
        // pointer references a deleted application (orphan rc entries 401).
        var provs = inputs.providers || [];
        if (provs.length >= 200) {
          log.warn('Provider list hit the page limit — results may be incomplete', { count: provs.length });
        }
        var paths = [];
        for (var i = 0; i < provs.length; i++) {
          var id = (provs[i] || {}).id;
          if (id === undefined || id === null || id === '') continue;
          paths.push('/provider/' + encodeURIComponent(String(id)));
        }
        log.info('EC2 providers', { providers: provs.length, detail_fetches: paths.length });
        return { paths: paths, providers_total: provs.length };

  - id: fetch_runtime_configs
    type: module
    plugin_type: np-api-call
    name: "Fetch Runtime Configurations"
    forEach:
      expression: "${{ steps.build_rc_paths.outputs.paths }}"
      itemVariable: path
    # Source-side trim: build_provider_index only reads these paths.
    output_projection:
      - status
      - body.id
      - body.nrn
      - body.dimensions
      - body.attributes.ami.id
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      # Providers can point at runtime configs of DELETED applications
      # (orphan entries — seen live: the NP API answers 401 for them). A
      # single dead pointer must not kill the whole scan: with
      # failOnHttpError off, the 4xx response has no body.id, so
      # build_provider_index skips it and the affected scopes count as
      # skipped_unconfigured. The empty-baseline guard still aborts if
      # NOTHING resolves.
      failOnHttpError: false
      # Placeholder so validateConfig() (config-only, pre-execute) passes;
      # forEach injects inputs.path per iteration (merged over config).
      path: "/__foreach_placeholder__"

  - id: build_provider_index
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "Build Provider Baseline"
    inputs:
      providers: "${{ steps.fetch_providers.outputs.body.results }}"
      configs:   "${{ steps.fetch_runtime_configs.outputs.items }}"
    config:
      code: |
        // v1.5: each detail row IS the provider with resolved attributes —
        // no runtime_configuration join needed. Details that failed to fetch
        // (failOnHttpError: false → 4xx body without attributes) or lack an
        // AMI are skipped; their scopes count as skipped_unconfigured.
        var rcs = inputs.configs || [];
        var providers = [];
        for (var i = 0; i < rcs.length; i++) {
          var body = (rcs[i] || {}).body || rcs[i] || {};
          var ami = (((body.attributes || {}).ami) || {}).id;
          if (!ami) continue;
          providers.push({ nrn: body.nrn || '', dimensions: body.dimensions || {}, ami: ami });
        }
        if (providers.length === 0) {
          // Guard: an empty baseline would mark every item stale and close
          // them all. Fail the run instead — Phase B (which can close
          // items) is structurally unreachable until this step succeeds.
          throw new Error('No active EC2 provider AMIs configured for the organization — aborting close evaluation');
        }
        log.info('EC2 provider baseline', { providers: providers.length });
        return { providers: providers };

  - id: detect_valid
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "Current Drift Keys"
    inputs:
      rows:      "${{ steps.lake_deployments.outputs.rows }}"
      providers: "${{ steps.build_provider_index.outputs.providers }}"
    config:
      code: |
        var rows = inputs.rows || [];
        var providers = inputs.providers || [];
        // Same provider matching as the scanner: nrn ancestry + dimensions,
        // most-specific wins (deeper nrn, then more matching dimensions).
        function expectedFor(r) {
          var scopeNrn = r.scope_nrn || '';
          var dims = r.scope_dimensions || {};
          var best = null;
          var bestScore = -1;
          for (var i = 0; i < providers.length; i++) {
            var p = providers[i];
            if (!(scopeNrn === p.nrn || scopeNrn.indexOf(p.nrn + ':') === 0)) continue;
            var pd = p.dimensions || {};
            var dimKeys = Object.keys(pd);
            var ok = true;
            for (var j = 0; j < dimKeys.length; j++) {
              if (String(dims[dimKeys[j]]) !== String(pd[dimKeys[j]])) { ok = false; break; }
            }
            if (!ok) continue;
            var score = p.nrn.split(':').length * 100 + dimKeys.length;
            if (score > bestScore) { bestScore = score; best = p; }
          }
          return best ? best.ami : null;
        }
        var keys = [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          var ami = r.deployed_ami || '';
          if (!ami) continue;
          var expected = expectedFor(r);
          if (!expected) continue;
          if (ami === expected) continue;
          var key = 'ami-drift:' + String(r.scope_id);
          if (keys.indexOf(key) === -1) keys.push(key);
        }
        return { valid_keys: keys };

  # Stash Phase A's result into a workflow variable — Phase B's `decide`
  # (one call per item, possibly per page) reads `variables.drift_set`
  # instead of re-running the whole lake+provider recompute per item.
  - id: stash_drift_set
    type: module
    plugin_type: set-variable
    name: "Stash Drift Set"
    config:
      path: drift_set
      value: "${{ steps.detect_valid.outputs.valid_keys }}"

  # ── Phase B: stream every page of open ami-drift items ────────────────
  # One page per invocation; `decide` fans out per item in that page.
  - id: fetch_items
    type: module
    plugin_type: np-entity-paginated-fetch
    name: "List Open ami-drift Items"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      entity: governance/action_item
      filters:
        nrn: "organization=${{ vars.NP_ORGANIZATION_ID }}"
        "labels.workflow_type": "ami-drift"
        status: open
      # Payload diet — see header note. Do NOT raise this to 100.
      limit: 25
      mode: stream

  # Per-item decision: item's metadata.drift_key vs variables.drift_set →
  # close | keep. `metadata.fanOutPerItem: true` forces per-item dispatch
  # (code-exec defaults to executeMode 'all'). ONLY `$item`/`$itemIndex`
  # are read here — never `$items` (fan-out collapses it to one element
  # per invocation; see CLAUDE.md § Workflow Authoring).
  - id: decide
    type: module
    plugin_type: code-exec
    metadata: { fanOutPerItem: true }
    name: "Decide: Close or Keep"
    inputs:
      item:       "${{ $item }}"
      drift_set:  "${{ variables.drift_set }}"
    config:
      code: |
        var item = inputs.item || {};
        var driftSet = inputs.drift_set || [];
        var status = String(item.status || '').toLowerCase();
        // Double-guard: np-entity-paginated-fetch hits the generic
        // /governance/action_item endpoint, which does not reliably honor
        // `status` server-side (same engine fact as
        // wf-r5-closer.yaml). A non-open item that slips through the
        // `filters.status: open` above is always kept, never touched —
        // matches the original "only open items are closed" invariant.
        if (status !== 'open') {
          return { item_id: item.id, verdict: 'keep', reason: 'not_open', status: status };
        }
        var key = item.metadata && item.metadata.drift_key;
        var verdict;
        if (!key) {
          // Same as v2.0: an open item with no drift_key metadata is left
          // untouched (kept), never closed.
          verdict = 'keep';
        } else if (driftSet.indexOf(key) !== -1) {
          // Still in the current drift set — the drift is still real.
          verdict = 'keep';
        } else {
          // No longer drifted (redeployed, scope gone, or provider
          // reconfigured to match).
          verdict = 'close';
        }
        return { item_id: item.id, verdict: verdict, drift_key: key || null };

  # Filters `decide`'s per-item verdicts down to the ids that need
  # closing — a `decider` can't do this (it only ever looks at
  # items[0] against a batch; see header note).
  - id: select_to_close
    type: module
    plugin_type: code-exec
    metadata: { fanOutPerItem: false }
    name: "Select Items To Close (this page)"
    inputs:
      # `steps.decide.items` — NOT `.outputs.items` (see header note on
      # single-item pages). buildScope() always normalizes this to an
      # array, whether `decide` fanned out (real aggregate) or ran as one
      # plain call on a 1-item page (`[outputs]` fallback).
      decisions: "${{ steps.decide.items }}"
    config:
      code: |
        var decisions = inputs.decisions || [];
        var toClose = [];
        var kept = 0;
        for (var i = 0; i < decisions.length; i++) {
          var d = decisions[i] || {};
          if (d.verdict === 'close' && d.item_id) { toClose.push(d.item_id); }
          else { kept++; }
        }
        log.info('AMI drift close evaluation (page)', {
          checked: decisions.length,
          still_valid: kept,
          to_close: toClose.length
        });
        return {
          to_close: toClose,
          checked: decisions.length,
          still_valid: kept,
          to_close_count: toClose.length,
          // Full per-item decision list for this page — acc_results below
          // reads this (not `steps.decide.items` directly) so there's one
          // place that owns "the full list for this page".
          all: decisions
        };

  # Engine fact — `error_handling.fallback_step` does NOT work on a
  # `forEach` step: the runner's forEach branch (workflow-runner.ts,
  # `step.forEach !== undefined`) only ever consults
  # `errorHandling.continueOnError` — it throws (or, with
  # `continueOnError: true`, routes successors with a 'failed' edge status)
  # WITHOUT ever checking `errorHandling.fallbackStep`. Only the generic
  # per-item module dispatch path (`shouldFanOut`, e.g. `decide` above, or
  # a `sub-workflow` per-item call like wf-r5's `verify_item`) honors
  # `fallback_step`. So failure isolation here uses `continueOnError: true`
  # + an explicit decider (`close_ok`) reading `steps.close_items.status`
  # instead — deciders run in-sandbox, so this port is always safe to wire
  # (CLAUDE.md § Deciders/ports).
  - id: close_items
    type: module
    plugin_type: np-action-item-update
    name: "Close Items"
    forEach:
      expression: "${{ steps.select_to_close.outputs.to_close }}"
      itemVariable: actionItemId
    # Failure isolation (the fix this revision is about): a persistent
    # failure closing this page's items (5xx after retries, a malformed
    # id) must NOT kill the whole sweep — without continueOnError it
    # throws and every remaining page never gets fetched. `close_ok`
    # (below) routes a failure to `close_failed`, which re-enters the
    # pagination loop so the sweep continues.
    error_handling:
      continueOnError: true
    # Per-iteration trim: select_closed only needs to know WHICH id actually
    # transitioned and whether it was a no-op. Without this the whole
    # ActionItem (description + audit_logs + comments) rides back per item.
    output_projection:
      - actionItem.id
      - skipped
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      # Placeholder so validateConfig() passes; forEach injects
      # inputs.actionItemId per iteration (merged over config).
      actionItemId: "__foreach_placeholder__"
      action: close
      actor: "agent:ami-drift-closer"
      # Idempotent close (v2.2). If the item is ALREADY closed the NP API
      # answers 400 "Invalid action item status transition"; without this
      # flag that fails the step terminally and — because a forEach failure
      # has no per-item attribution — takes the whole page (and, before
      # continueOnError, the whole sweep) down with it. That is exactly what
      # happened live between 2026-07-18 and 2026-07-22. With the
      # flag the already-closed item is a no-op (`skipped: true`) and the
      # rest of the page closes normally. Any OTHER error still fails.
      ignoreInvalidTransition: true

  # Did the close actually succeed for this page? (See the engine-fact
  # note above `close_items` — this is how failure is detected instead of
  # `fallback_step`.)
  - id: close_ok
    type: decider
    plugin_type: conditional
    name: "Close Succeeded?"
    config:
      expression: "steps.close_items.status == 'completed'"

  # v2.2 — comment AFTER a confirmed close, and only for the ids that
  # actually transitioned.
  #
  # v2.1 and earlier commented BEFORE closing, so every failed close still
  # left a "Closing automatically" comment behind on an item that stayed
  # open (or, in the incident, on one that was already closed — 54
  # spurious comments across 8 items). Ordering alone is not enough
  # though: with `ignoreInvalidTransition` a close can legitimately no-op,
  # and a no-op must not be announced either.
  #
  # Attribution is by RESPONSE first: a successful transition echoes the
  # item it acted on (`actionItem.id`), while a skipped one returns
  # `actionItem: null` + `skipped: true`.
  #
  # The positional fallback matters. `close_items` carries an
  # `output_projection`, and a plugin/API that does not echo the item back
  # (or an older engine that drops the projected path) would otherwise
  # yield an EMPTY closed_ids — i.e. items closed silently with no comment,
  # a silent regression that is much worse than the bug being fixed. So when
  # the response has no usable id AND the result array lines up 1:1 with
  # the ids we asked to close, fall back to position. The length check is
  # what makes this safe: a partial/misaligned array never mis-attributes,
  # it just yields no id for that slot.
  - id: select_closed
    type: module
    plugin_type: code-exec
    metadata: { fanOutPerItem: false }
    name: "Select Actually-Closed Items (this page)"
    inputs:
      # forEach steps expose their per-iteration outputs as `outputs.items`
      # (same shape build_provider_index consumes from
      # fetch_runtime_configs above).
      close_results: "${{ steps.close_items.outputs.items }}"
      attempted:     "${{ steps.select_to_close.outputs.to_close }}"
      decisions:     "${{ steps.select_to_close.outputs.all }}"
    config:
      code: |
        var res = inputs.close_results || [];
        var attempted = inputs.attempted || [];
        // Only trust position when the two arrays describe the same set.
        var aligned = res.length === attempted.length;
        var closedIds = [];
        var skippedIds = [];
        for (var i = 0; i < res.length; i++) {
          var r = res[i] || {};
          var ai = r.actionItem || {};
          var id = ai.id || (aligned ? attempted[i] : null);
          if (r.skipped === true) {
            // Already in a status where `close` is not legal — virtually
            // always "already closed". Nothing happened, so say nothing.
            if (id) skippedIds.push(id);
            continue;
          }
          if (id) closedIds.push(id);
        }
        // Re-label this page's decisions so the run summary can tell a real
        // close apart from a no-op. select_to_close owns the raw verdicts;
        // this step owns the OUTCOME, and is the single place downstream
        // accumulators read from.
        var decisions = inputs.decisions || [];
        var out = [];
        for (var j = 0; j < decisions.length; j++) {
          var d = decisions[j] || {};
          if (d.verdict === 'close' && d.item_id && skippedIds.indexOf(d.item_id) !== -1) {
            out.push({ item_id: d.item_id, verdict: 'close_skipped', drift_key: d.drift_key || null });
          } else {
            out.push(d);
          }
        }
        log.info('AMI drift close outcome (page)', {
          closed: closedIds.length,
          skipped_noop: skippedIds.length
        });
        return {
          closed_ids: closedIds,
          closed_count: closedIds.length,
          skipped_count: skippedIds.length,
          all: out
        };

  # ── Comment (only on ids that genuinely transitioned) ─────────────────
  # forEach injects each id as inputs.actionItemId; the np plugins merge
  # ctx.inputs over config, so the id lands per iteration. Empty
  # closed_ids → forEach no-ops (zero calls), so a page that closed
  # nothing posts nothing.
  - id: comment_closing
    type: module
    plugin_type: np-action-item-add-comment
    name: "Comment Close Reason"
    forEach:
      expression: "${{ steps.select_closed.outputs.closed_ids }}"
      itemVariable: actionItemId
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      # Placeholder so validateConfig() passes; forEach injects
      # inputs.actionItemId per iteration (merged over config).
      actionItemId: "__foreach_placeholder__"
      author: "agent:ami-drift-closer"
      content: "Closed automatically: AMI drift no longer detected (scope redeployed with a configured AMI, scope no longer active, or the AMI is now configured)."

  # Accumulator: appends this page's full per-item outcome list into a
  # workflow variable. Runs once per page (set-variable defaults to
  # executeMode='all').
  # `fanOutPerItem: false` for the same reason as acc_close_failed below.
  # (This replaces a `flipPorts: true` inherited from v2.1 — that key does
  # not exist anywhere in the engine or the DSL; it was dead metadata.)
  - id: acc_results
    type: module
    plugin_type: set-variable
    name: "Accumulate Item Decisions"
    metadata: { fanOutPerItem: false }
    config:
      path: results
      value: "${{ concat(variables.results, steps.select_closed.outputs.all) }}"

  # ── failure lane (close_ok:false target) ──────────────────────────────
  # close_items failed for this page's to_close ids — discard per-item
  # attribution for the page (same accepted trade-off as
  # wf-r5-closer.yaml's verify_item_failed — the engine has no per-item
  # attribution on a failed batch). comment_closing may already have
  # posted comments for these ids even though the close call failed
  # (v2.0 had the same ordering risk — not introduced by this fix).
  - id: close_failed
    type: module
    plugin_type: code-exec
    name: "Stash Result: close_failed (child failure)"
    metadata: { fanOutPerItem: false }
    inputs:
      error_message: "${{ steps.close_items.error.message }}"
      error_code: "${{ steps.close_items.error.code }}"
      attempted_ids: "${{ steps.select_to_close.outputs.to_close }}"
      page_checked: "${{ steps.select_to_close.outputs.checked }}"
    config:
      code: |
        var ids = inputs.attempted_ids || [];
        return {
          verdict: 'close_failed',
          item_id: null,
          checked: Number(inputs.page_checked) || ids.length,
          error_code: inputs.error_code || 'UNKNOWN',
          error_message: String(inputs.error_message || 'close_items failed'),
          affected_item_ids: ids
        };

  # Aggregate step: NEVER dispatch per upstream item. Without the explicit
  # `fanOutPerItem: false` the graph validator treats this as a per-item
  # dispatch and rejects the `$items` below with FANOUT_ITEMS_UNAVAILABLE.
  # In production that error stayed hidden: `pinnedDescriptors` supply
  # set-variable's `executeMode: 'all'` at validation time, and the failure
  # lane only runs when `close_items` fails — so a pin-less validation (or a
  # single close failure) would have surfaced it as a runtime graph error.
  # Exactly the "passes create-time, fails at runtime" trap. Caught by the
  # live Temporal reproduction, not by any hermetic test.
  - id: acc_close_failed
    type: module
    plugin_type: set-variable
    name: "Accumulate Item Decisions (close failure lane)"
    metadata: { fanOutPerItem: false }
    config:
      path: results
      # Read the failure-lane record explicitly rather than via `$items`,
      # so this no longer depends on batch-vs-per-item dispatch at all.
      value: "${{ concat(variables.results, steps.close_failed.items) }}"

  - id: summary
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item.
    metadata: { fanOutPerItem: false }
    # Reached only from fetch_items:done — the :done envelope is empty by
    # design, so this reads variables.results, never $items.
    inputs:
      results: "${{ variables.results }}"
    config:
      code: |
        var results = inputs.results || [];
        var checked = 0, stillValid = 0, closed = 0, closeFailed = 0, closeSkipped = 0;
        for (var i = 0; i < results.length; i++) {
          // Live engine wraps each fan-out/forEach item plainly here (no
          // {outputs,...} envelope — decide/close_failed both return flat
          // objects), unlike wf-r5's sub-workflow items.
          var r = results[i] || {};
          var v = String(r.verdict || 'other');
          if (v === 'close') { checked++; closed++; }
          else if (v === 'keep') { checked++; stillValid++; }
          // v2.2: the close was a no-op (item already in a status where
          // `close` is not legal — normally already closed). Counted as
          // checked, but NOT as closed, and no comment was posted.
          else if (v === 'close_skipped') { checked++; closeSkipped++; }
          else if (v === 'close_failed') { checked += Number(r.checked) || 0; closeFailed += (r.affected_item_ids || []).length; }
        }
        return {
          checked: checked,
          still_valid: stillValid,
          closed: closed,
          close_skipped: closeSkipped,
          close_failed: closeFailed
        };

  - id: log_done
    type: module
    plugin_type: log
    name: "Closer Complete"
    config:
      level: info
      message: "AMI drift closer complete. Checked ${{ steps.summary.outputs.checked }} open items — still valid: ${{ steps.summary.outputs.still_valid }}, closed: ${{ steps.summary.outputs.closed }}, already closed (no-op): ${{ steps.summary.outputs.close_skipped }}, close failed: ${{ steps.summary.outputs.close_failed }}."

connections:
  - { id: c1,  from: start_manual,        to: lake_deployments }
  - { id: c2,  from: start_cron,          to: lake_deployments }
  - { id: c3,  from: lake_deployments,        to: fetch_providers }
  - { id: c4,  from: fetch_providers,         to: build_rc_paths }
  - { id: c5,  from: build_rc_paths,          to: fetch_runtime_configs }
  - { id: c6,  from: fetch_runtime_configs,   to: build_provider_index }
  - { id: c7,  from: build_provider_index,    to: detect_valid }
  - { id: c8,  from: detect_valid,            to: stash_drift_set }
  - { id: c9,  from: stash_drift_set,         to: fetch_items }
  # fetch_items streams: `loop` port → decide (per-page items fan out).
  - { id: c10, from: fetch_items,   to: decide,          source_port: loop }
  - { id: c11, from: decide,        to: select_to_close }
  # v2.2: close FIRST, then comment only what actually closed (c14t lane).
  - { id: c12, from: select_to_close, to: close_items }
  - { id: c14, from: close_items,   to: close_ok }
  - { id: c14t, from: close_ok,     to: select_closed,   source_port: "true" }
  - { id: c13, from: select_closed, to: comment_closing }
  - { id: c13b, from: comment_closing, to: acc_results }
  - { id: c14f, from: close_ok,     to: close_failed,    source_port: "false" }
  - { id: c14g, from: close_failed, to: acc_close_failed }
  # Both the success lane and the failure lane re-enter
  # fetch_items:callback (reentry port) so a page-level failure doesn't
  # stop later pages from being fetched. The engine soft-resets
  # fetch_items' join state on each reentry-edge settle so it can re-fire.
  - { id: c15, from: acc_results,          to: fetch_items, target_port: callback }
  - { id: c15b, from: acc_close_failed,    to: fetch_items, target_port: callback }
  # When fetch_items detects the last page, it activates `done`.
  - { id: c16, from: fetch_items,   to: summary,         source_port: done }
  - { id: c17, from: summary,       to: log_done }

outputs:
  checked:        "${{ steps.summary.outputs.checked }}"
  still_valid:    "${{ steps.summary.outputs.still_valid }}"
  closed:         "${{ steps.summary.outputs.closed }}"
  close_skipped:  "${{ steps.summary.outputs.close_skipped }}"
  close_failed:   "${{ steps.summary.outputs.close_failed }}"
