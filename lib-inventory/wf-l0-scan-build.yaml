# Library inventory — scan ONE build.
#
# The scanner. Everything that knows how to turn a repository into a dependency
# inventory lives here and NOWHERE else: the backfill (wf-l1) and the
# per-release path both invoke this workflow rather than carrying their own
# copy of the pipeline.
#
#   plan_tree_fetches ─────── pure
#     └─ fetch_trees ───────── http-request  ◄── GitHub
#          └─ plan_manifest_fetches ── pure
#               └─ fetch_manifests ──── http-request  ◄── GitHub
#                    └─ resolve_assets ── pure  (the ladder)
#                         ├─ parse_go ────── pure  (one step per ecosystem)
#                         ├─ parse_node ──── pure
#                         ├─ parse_maven ─── pure
#                         ├─ parse_python ── pure
#                         └─ parse_dotnet ── pure
#                              └─ build_payloads ── pure
#                                   └─ write_entities ── np-api-call (catalog upsert)
#                                        └─ result
#
# Every GitHub call is an `http-request` — the plugin the platform already
# audits as remote-safe and can route through an egress pool, so that traffic
# leaves from the pool's IPs rather than the engine's. Every other step is pure
# computation with NO network at all.
#
# ONE BUILD PER EXECUTION — this is not an aesthetic choice. Repository trees
# and manifest bodies travel through execution state, and the sandbox input
# boundary is 1 MB (`input exceeds sandbox boundary limit of 1048576 bytes`,
# hit live on 2026-07-26 at twelve builds). Batching them into one execution
# capped the backfill at ~6 builds a run; scoping the pipeline to one build
# makes that limit per sub-execution, where ~103 KB of state has two orders of
# magnitude of headroom. The cost is one Temporal execution per build, which is
# what buys the parallelism back.
#
# EVERY asset handed to this workflow gets a `dependency-inventory` catalog
# entity, including ones that could not be scanned (`status` carries the
# reason). An asset with NO entity was never visited — that distinction is the
# whole design, and it makes coverage a lake query instead of an act of faith.
# The entity spec is created by setup/01-entity-spec.sh; writes are
# PATCH /catalog/instances/dependency-inventory/{asset_id}?upsert=true, so
# create and refresh are the same request.
#
# Per-org configuration (config entries on folder /lib-inventory):
#   NP_API_KEY               (secret) org credential for the catalog writes
#   GITHUB_TOKEN             (secret) PAT with read access to the repositories
#   LIB_INTERNAL_PATTERNS    JSON array of regex sources marking a dep internal
#
# The `code:` bodies of the pure steps are GENERATED from scanner/. Never edit
# them in place — run:
#   node workflows/lib-inventory/scripts/build-workflow.mjs

id: lib_inventory_scan_build
name: "Library Inventory — Scan Build"
description: >
  Resolves each asset of one build to a subtree of its application's repository
  at that build's commit, extracts the dependency manifests found there, and
  upserts one `dependency-inventory` catalog entity per asset — including for
  assets that could not be scanned, so coverage is always measurable.
path: "/lib-inventory"
semantic_version: 1.0.0

inputs:
  app_id:
    type: string
    required: true
    description: "NP application id the build belongs to."
  app_name:
    type: string
    required: false
    description: "Application name. Diagnostics only — never used for resolution."
  repository_url:
    type: string
    required: false
    description: >
      The application's repository. Empty or non-GitHub is not an error: every
      asset is recorded with status `repo_missing`.
  build_id:
    type: string
    required: true
    description: "NP build id. Stored on the entity so a scan is traceable."
  release_id:
    type: string
    required: false
    description: >
      The release that triggered this scan, when there is one (wf-l2 passes it;
      the backfill does not). Stored on the entity as provenance — a build can
      be released more than once, so the lake's release→build join remains the
      complete answer.
  commit:
    type: string
    required: true
    description: >
      The commit the build was made from. Read verbatim, with NO fallback to a
      branch — reading `main` when the commit is gone would silently describe
      different code than the one that shipped.
  assets_json:
    type: string
    required: true
    description: >
      The build's assets. Named after the lake column both callers select it
      from (`toJSONString(groupUniqArray((id, name, type, nrn)))`), so a lake
      row can be forwarded whole with no unpacking. A real
      `[{id, name, type, nrn}]` array is accepted just as well; `nrn` is
      optional and lands on the entity when present.
  dry_run:
    type: boolean
    required: false
    description: "Scan and report, but write no entities."

steps:
  - id: start_manual
    type: trigger
    plugin_type: manual
    name: "Scan This Build"
    config:
      description: >
        Scans one build (normally invoked by the backfill or the release
        listener). Running it by hand is the fastest way to debug a single
        repository's resolution.
      inputs:
        app_id: { type: string, required: true }
        app_name: { type: string, required: false }
        repository_url: { type: string, required: false }
        build_id: { type: string, required: true }
        release_id: { type: string, required: false }
        commit: { type: string, required: true }
        assets_json: { type: string, required: true }
        dry_run: { type: boolean, required: false }

  - id: plan_tree_fetches
    type: module
    plugin_type: code-exec
    name: "Plan Repository Tree Fetches"
    inputs:
      # The pipeline is array-shaped end to end (it was written for batches),
      # so one build is simply a one-row batch. Keeping that shape is what lets
      # the SAME generated step bodies serve the backfill and the per-release
      # path — the fan-out lives in the caller, never in the scanner.
      rows:
        - app_id: "${{ workflow.inputs.app_id }}"
          app_name: "${{ workflow.inputs.app_name }}"
          repository_url: "${{ workflow.inputs.repository_url }}"
          build_id: "${{ workflow.inputs.build_id }}"
          commit: "${{ workflow.inputs.commit }}"
          assets_json: "${{ workflow.inputs.assets_json }}"
    error_handling:
      # A sandbox the platform could not hand out right now (capacity, a
      # transport blip) is transient and now reports itself as retryable — this
      # is what turns a lost sub-execution into a two-second pause. Nothing
      # else in these steps is retryable: they are pure computation, so a
      # genuine failure fails identically on every attempt.
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    config:
      code: |
        // >>> GENERATED plan_tree_fetches — do not edit by hand (build-workflow.mjs)
        const SCANNER_VERSION = 'lib-inventory/1.0.0';

        /** Manifest filename -> ecosystem. */
        const MANIFEST_LANGS = {
          'go.mod': 'go',
          'package.json': 'node',
          'pom.xml': 'java-maven',
          'build.gradle': 'java-gradle',
          'build.gradle.kts': 'java-gradle',
          'requirements.txt': 'python',
          'pyproject.toml': 'python',
          Pipfile: 'python',
          Gemfile: 'ruby',
          'Cargo.toml': 'rust',
          'composer.json': 'php',
          'pubspec.yaml': 'dart',
        };

        /**
         * Asset-name suffixes that describe the deployment shape rather than the code,
         * stripped before the L3 normalized comparison.
         */
        const NAME_SUFFIXES = [
          '-aws-lambda',
          '-aws-uks',
          '-lambda',
          '-service',
          '-local',
          '-docker-image',
          '-image',
          '-asset',
          '-app',
          '-api',
        ];

        /** Ecosystems we can currently parse. Everything else is reported, not parsed. */
        const SUPPORTED_ECOSYSTEMS = new Set(['go', 'node', 'java-maven', 'python', 'dotnet']);

        function manifestLang(basename) {
          if (MANIFEST_LANGS[basename]) return MANIFEST_LANGS[basename];
          if (basename.endsWith('.csproj')) return 'dotnet';
          return null;
        }

        /**
         * The last-resort spelling: lowercase with every separator removed.
         * `conto-api`, `Conto.Api` and `ContoApi` all land on `contoapi` — PascalCase
         * concatenation is how .NET names module directories, and no dash/dot rule
         * reaches it. No suffix stripping here: removing separators first would keep
         * the suffix list from ever matching, so the two normal forms coexist.
         */
        function squashName(name) {
          return String(name).toLowerCase().replace(/[-._ ]/g, '');
        }

        function normalizeName(name) {
          // Dots fold into dashes: .NET monorepos name modules `Conto.Api` while the
          // NP application is `conto-api` (110 unresolved assets in one live repo).
          let s = String(name).toLowerCase().replaceAll('.', '-');
          for (let changed = true; changed; ) {
            changed = false;
            for (const suf of NAME_SUFFIXES) {
              if (s.endsWith(suf)) {
                s = s.slice(0, -suf.length);
                changed = true;
              }
            }
          }
          return s.replace(/[^a-z0-9]/g, '');
        }

        /** `https://github.com/acme/x(.git)` -> `{owner, repo}`; null when not GitHub. */
        function parseRepoUrl(url) {
          const m = /github\.com[:/]+([^/]+)\/([^/]+?)(?:\.git)?\/?$/.exec(String(url || ''));
          return m ? { owner: m[1], repo: m[2] } : null;
        }

        /**
         * Compile the configured internal-library patterns once.
         * Accepts an array or the JSON string a config entry delivers (entries are
         * always strings, so `LIB_INTERNAL_PATTERNS` arrives as `'["^github\\.com/Acme/"]'`).
         */
        function compileInternalPatterns(patterns) {
          let list = patterns;
          if (typeof list === 'string') {
            const raw = list.trim();
            if (!raw) return [];
            try {
              list = JSON.parse(raw);
            } catch {
              // Tolerate a bare comma-separated list so a mis-typed entry still works.
              list = raw
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean);
            }
          }
          if (!Array.isArray(list)) return [];
          return list.map((p) => new RegExp(p));
        }

        /** One GraphQL query aliasing every manifest blob at a commit — 1 request, cost 1. */
        function buildBlobQuery(owner, repo, ref, paths) {
          const aliases = paths
            .map(
              (p, i) =>
                `    f${i}: object(expression: ${JSON.stringify(`${ref}:${p}`)}) { ... on Blob { text } }`,
            )
            .join('\n');
          return (
            `query { repository(owner: ${JSON.stringify(owner)}, name: ${JSON.stringify(repo)}) {\n` +
            `${aliases}\n  } }`
          );
        }

        /** Map a GraphQL blob response back onto the manifest paths that produced it. */
        function readBlobResponse(manifests, result) {
          const node = result?.body?.data?.repository;
          const texts = {};
          if (!node) return texts;
          manifests.forEach((p, i) => {
            const t = node[`f${i}`]?.text;
            if (typeof t === 'string') texts[p] = t;
          });
          return texts;
        }

        /** Max manifests fetched per repository. Bounds a pathological monorepo. */
        const MAX_MANIFESTS_PER_REPO = 120;

        /**
         * STEP 1 — turn lake rows into GitHub tree requests.
         *
         * Emits `requests` (index-aligned with `plans`, consumed by the `http-request`
         * forEach) and `unscannable` for builds that can never be fetched. Note the
         * request carries ONLY a url: the credential lives in the http-request step's
         * own config as `${{ secrets.GITHUB_TOKEN }}`, so it never passes through a
         * `code-exec` output and never reaches the execution state.
         */
        function planTreeFetches(builds) {
          const requests = [];
          const plans = [];
          const unscannable = [];
          for (const build of builds) {
            const repo = parseRepoUrl(build.repository_url);
            if (!repo) {
              unscannable.push({
                build,
                status: 'repo_missing',
                status_detail: build.repository_url
                  ? `repository_url is not a GitHub URL: ${build.repository_url}`
                  : 'application has no repository_url configured',
              });
              continue;
            }
            // Pinned to the build's commit, with no fallback to a branch: reading
            // `main` when the commit is gone would silently describe DIFFERENT code
            // than the one that shipped. A missing commit is `repo_unreachable`.
            requests.push({
              url:
                `https://api.github.com/repos/${repo.owner}/${repo.repo}` +
                `/git/trees/${encodeURIComponent(build.commit)}?recursive=1`,
            });
            plans.push({ ...build, owner: repo.owner, repo: repo.repo });
          }
          return { requests, plans, unscannable };
        }

        /**
         * STEP 2 — from the fetched trees, list every manifest and build one batched
         * GraphQL request per repository.
         *
         * `treeResults[i]` is the http-request result for `plans[i]`. A forEach
         * iteration that exhausted its retries is absorbed as an EMPTY slot in the same
         * position — that empty slot is the signal for `repo_unreachable`, which is why
         * the arrays must stay index-aligned.
         */
        function planManifestFetches(plans, treeResults) {
          const requests = [];
          const kept = [];
          const failed = [];

          plans.forEach((plan, i) => {
            const res = treeResults?.[i];
            const paths = res?.body?.tree;
            if (!res || !Array.isArray(paths)) {
              failed.push({
                build: plan,
                status: 'repo_unreachable',
                status_detail:
                  `could not read the tree of ${plan.owner}/${plan.repo}@${plan.commit}` +
                  (res?.statusCode ? ` (HTTP ${res.statusCode})` : ' (request failed)'),
              });
              return;
            }
            if (res.body.truncated === true) {
              failed.push({
                build: plan,
                status: 'repo_unreachable',
                status_detail: `the tree of ${plan.owner}/${plan.repo} is truncated (>100k entries)`,
              });
              return;
            }

            // `output_projection` trims each entry to its `path`, so accept both the
            // projected string form and the raw GitHub object.
            const files = paths
              .map((p) => (typeof p === 'string' ? p : p?.path))
              .filter((p) => typeof p === 'string');
            const manifests = files
              .filter((p) => manifestLang(p.slice(p.lastIndexOf('/') + 1)) !== null)
              .slice(0, MAX_MANIFESTS_PER_REPO);

            kept.push({ ...plan, files, manifests });
            requests.push({
              url: 'https://api.github.com/graphql',
              method: 'POST',
              body: { query: buildBlobQuery(plan.owner, plan.repo, plan.commit, manifests) },
            });
          });

          return { requests, plans: kept, failed };
        }

        /**
         * STEP `plan_tree_fetches` — lake rows → GitHub tree requests. No network.
         *
         * The request carries only a `url`. The credential stays in the http-request
         * step's own config as `${{ secrets.GITHUB_TOKEN }}`, so it never passes
         * through a code-exec output and never lands in the execution state.
         */
        const builds = (inputs.rows || []).map((r) => ({
          app_id: r.app_id,
          app_name: r.app_name,
          repository_url: r.repository_url,
          build_id: r.build_id,
          commit: r.commit,
          assets: (typeof r.assets_json === 'string' ? JSON.parse(r.assets_json) : r.assets_json || []).map(
            (a) => (Array.isArray(a) ? { id: a[0], name: a[1], type: a[2], nrn: a[3] } : a),
          ),
        }));

        const { requests, plans, unscannable } = planTreeFetches(builds);
        log.info(`planned ${requests.length} tree fetches`, { unscannable: unscannable.length });
        return { requests, plans, unscannable };
        // <<< END plan_tree_fetches

  # ── GitHub call #1 ───────────────────────────────────────────────────────
  # The credential lives HERE, in the step config — not in the forEach item.
  # A `code-exec` that built the header would put the token in its output, and
  # step outputs are recorded into execution state.
  #
  # `output_projection` trims each tree entry to its bare `path` BEFORE the
  # result is size-capped and recorded. GitHub returns mode/type/sha/size per
  # entry; keeping all of it would roughly triple what the state carries.
  #
  # A >=400 fails the iteration, which `forEach` absorbs as an EMPTY slot in the
  # same position. That empty slot is exactly how the next step recognises
  # `repo_unreachable`, so the arrays must stay index-aligned.
  - id: fetch_trees
    type: module
    plugin_type: http-request
    name: "Fetch Repository Trees (GitHub)"
    config:
      method: GET
      url: "https://api.github.com/"
      headers:
        Authorization: "Bearer ${{ secrets.GITHUB_TOKEN }}"
        Accept: "application/vnd.github+json"
        User-Agent: "np-lib-inventory"
    output_projection:
      - statusCode
      - body.tree[].path
      - body.truncated
    error_handling:
      # GitHub's PRIMARY rate limit answers 403 with `x-ratelimit-remaining: 0`
      # and a reset timestamp — not 429. The engine now reads those headers and
      # waits as long as the SERVER said (up to an hour) instead of the
      # interval below, so a limit hit mid-run parks that one build for the
      # real window and then carries on. The 2s interval still covers the
      # ordinary 5xx blip.
      #
      # 4 attempts because a GitHub window is ten minutes: three waits cover
      # half an hour of exhaustion. Anything longer is not this run's problem —
      # the assets keep no record and the next round asks for them again.
      retry_policy:
        max_attempts: 4
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    forEach:
      expression: "${{ steps.plan_tree_fetches.outputs.requests }}"
      itemVariable: item
      spreadItem: true
      parallel: true
      maxConcurrency: 10

  - id: plan_manifest_fetches
    type: module
    plugin_type: code-exec
    name: "Plan Manifest Fetches"
