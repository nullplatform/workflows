        jitter: 0.3
    forEach:
      expression: "${{ steps.build_payloads.outputs.write_requests }}"
      itemVariable: item
      spreadItem: true
      parallel: true
      maxConcurrency: 20

  # ── What the caller aggregates ───────────────────────────────────────────
  # Reached either from `build_payloads` (dry run) or from `write_entities`.
  # The default `all` join would wait forever on the branch never traversed:
  # a `condition: false` edge is not reliably marked skipped.
  #
  # This step deliberately does NOT enforce a coverage threshold. One build
  # resolving badly is a data point; whether the RUN is acceptable is a
  # judgement only the caller, which sees every build, can make.
  - id: result
    type: module
    plugin_type: code-exec
    join_strategy: any
    inputs:
      scanned: "${{ steps.build_payloads.outputs.rows }}"
      writeResults: "${{ steps.write_entities.outputs.items }}"
      levels: "${{ steps.resolve_assets.outputs.levels }}"
      dryRun: "${{ workflow.inputs.dry_run }}"
      buildId: "${{ workflow.inputs.build_id }}"
    name: "Build Result"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    config:
      code: |
        const scanned = inputs.scanned || [];

        const byStatus = {};
        const byLanguage = {};
        for (const r of scanned) {
          byStatus[r.data.status] = (byStatus[r.data.status] || 0) + 1;
          for (const l of r.data.languages || []) byLanguage[l] = (byLanguage[l] || 0) + 1;
        }

        // Success is counted from the write step's ITEMS, one slot per asset,
        // each projected down to `{status}` by `output_projection`. This is
        // the only honest evidence: a parallel `forEach` absorbs a failed
        // iteration as an EMPTY slot and the aggregate exposes no failure
        // count (the engine used to emit `failed`; the current one emits only
        // `{items, count}`, which silently zeroed every run's assets_written —
        // hit live on the first itti rollout, 2026-08-31). Anything that is
        // not a 2xx slot — empty, junk, 4xx — counts as a failed write.
        // Un-projected this was 113 KB/302s on the batched shape (2026-07-26);
        // projected it is one tiny object per asset of ONE build.
        const slots = inputs.writeResults;
        const attempted = Array.isArray(slots) ? slots.length : 0;
        const written = inputs.dryRun
          ? 0
          : (Array.isArray(slots) ? slots : []).filter(
              (s) => s && typeof s === 'object' && Number(s.status) >= 200 && Number(s.status) < 300,
            ).length;
        // `null` (unknown) only when the step ran but handed back no array at
        // all — unknown must not read as success.
        const failed = inputs.dryRun ? 0 : Array.isArray(slots) ? attempted - written : null;

        const result = {
          build_id: inputs.buildId,
          dry_run: inputs.dryRun === true,
          assets_scanned: scanned.length,
          assets_written: written,
          // Separated so a caller can tell "nothing to write" from "we could
          // not tell whether the writes landed".
          assets_write_attempted: attempted,
          write_failures: failed,
          by_status: byStatus,
          by_language: byLanguage,
          match_levels: inputs.levels || {},
          dependencies_stored: scanned.reduce((s, r) => s + (r.data.total_count || 0), 0),
          transitive_external_dropped: scanned.reduce(
            (s, r) => s + (r.data.transitive_external_dropped || 0),
            0,
          ),
        };
        log.info('build scanned', result);
        return result;

connections:
  - { id: c1, from: start_manual, to: plan_tree_fetches }
  - { id: c2, from: plan_tree_fetches, to: fetch_trees }
  - { id: c3, from: fetch_trees, to: plan_manifest_fetches }
  - { id: c4, from: plan_manifest_fetches, to: fetch_manifests }
  - { id: c5, from: fetch_manifests, to: resolve_assets }
  - { id: c6, from: resolve_assets, to: parse_go }
  - { id: c6b, from: resolve_assets, to: parse_node }
  - { id: c6c, from: resolve_assets, to: parse_maven }
  - { id: c6d, from: resolve_assets, to: parse_python }
  - { id: c6e, from: resolve_assets, to: parse_dotnet }
  - { id: c7, from: parse_go, to: build_payloads }
  - { id: c7b, from: parse_node, to: build_payloads }
  - { id: c7c, from: parse_maven, to: build_payloads }
  - { id: c7d, from: parse_python, to: build_payloads }
  - { id: c7e, from: parse_dotnet, to: build_payloads }
  - { id: c8, from: build_payloads, to: write_entities, condition: "workflow.inputs.dry_run != true" }
  - { id: c9, from: build_payloads, to: result, condition: "workflow.inputs.dry_run == true" }
  - { id: c10, from: write_entities, to: result }

# The sub-workflow plugin returns THESE to the caller — a workflow with no
# `outputs:` block hands back `{}` no matter what its last step computed, and
# the caller's aggregation would quietly total zeros.
outputs:
  build_id: "${{ steps.result.outputs.build_id }}"
  assets_scanned: "${{ steps.result.outputs.assets_scanned }}"
  assets_written: "${{ steps.result.outputs.assets_written }}"
  assets_write_attempted: "${{ steps.result.outputs.assets_write_attempted }}"
  write_failures: "${{ steps.result.outputs.write_failures }}"
  by_status: "${{ steps.result.outputs.by_status }}"
  by_language: "${{ steps.result.outputs.by_language }}"
  match_levels: "${{ steps.result.outputs.match_levels }}"
  dependencies_stored: "${{ steps.result.outputs.dependencies_stored }}"
  transitive_external_dropped: "${{ steps.result.outputs.transitive_external_dropped }}"
