         * Parse a `pom.xml`.
         *
         * The dependency NAME is `groupId:artifactId` — Maven's own coordinate, and the
         * only form in which "is this internal" is answerable, since an artifactId
         * alone (`common`, `core`, `model`) collides across organizations.
         *
         * `<scope>test</scope>` maps to `dev: true` and `provided`/`runtime` are kept
         * verbatim in `scope`: a test-only dependency is a real declaration but not
         * something the deployed artifact ships, and conflating the two makes any
         * "who is exposed" question unanswerable.
         */
        function parsePomXml(text, _path = '', siblings = undefined) {
          const xml = stripXmlComments(text);
          const props = { ...parentProperties(xml, siblings), ...pomProperties(xml) };

          // Versions pinned in <dependencyManagement> fill in for dependencies that
          // omit one. The management blocks themselves are NOT dependencies.
          const management = managementSection(xml);
          const managed = {};
          for (const block of dependencyBlocks(management)) {
            const groupId = expand(tagValue(block, 'groupId'), props);
            const artifactId = expand(tagValue(block, 'artifactId'), props);
            const version = expand(tagValue(block, 'version'), props);
            if (groupId && artifactId && version) managed[`${groupId}:${artifactId}`] = version;
          }

          const declared = xml.replace(management, '');
          const deps = [];
          const seen = new Set();
          for (const block of dependencyBlocks(declared)) {
            const groupId = expand(tagValue(block, 'groupId'), props);
            const artifactId = expand(tagValue(block, 'artifactId'), props);
            if (!groupId || !artifactId) continue;
            const name = `${groupId}:${artifactId}`;
            if (seen.has(name)) continue;
            seen.add(name);

            const scope = (tagValue(block, 'scope') ?? 'compile').toLowerCase();
            const version = expand(tagValue(block, 'version'), props) ?? managed[name] ?? '';
            deps.push({
              name,
              version,
              direct: true,
              ecosystem: 'java-maven',
              // `<systemPath>` dependencies point at a file on the build machine —
              // in-repo code, not a consumed library, same as Go's `replace` to a path.
              local: /<systemPath\s*>/.test(block),
              dev: scope === 'test',
              optional: tagValue(block, 'optional') === 'true',
              scope,
            });
          }
          return deps;
        }

        /**
         * What a `pom.xml` declares about ITSELF: its coordinates, its parent, and the
         * Java it targets. `maven.compiler.release` / `java.version` is the JVM
         * equivalent of `engines.node` — the runtime-deprecation question, which no
         * dependency list answers.
         */
        function pomConfig(text, _path = '', siblings = undefined) {
          const xml = stripXmlComments(text);
          const props = { ...parentProperties(xml, siblings), ...pomProperties(xml) };
          const cfg = {};
          const head = xml.split(/<dependencies\s*>/)[0] ?? xml;
          const parent = /<parent\s*>[\s\S]*?<\/parent\s*>/.exec(head);
          const own = head.replace(/<parent\s*>[\s\S]*?<\/parent\s*>/g, '');

          const artifactId = tagValue(own, 'artifactId');
          if (artifactId) cfg.artifactId = artifactId;
          const groupId = tagValue(own, 'groupId') ?? (parent ? tagValue(parent[0], 'groupId') : null);
          if (groupId) cfg.groupId = groupId;
          const version = tagValue(own, 'version');
          if (version) cfg.version = expand(version, props);
          if (parent) {
            const pg = tagValue(parent[0], 'groupId');
            const pa = tagValue(parent[0], 'artifactId');
            const pv = tagValue(parent[0], 'version');
            if (pg && pa) cfg.parent = `${pg}:${pa}${pv ? `:${pv}` : ''}`;
          }
          for (const key of [
            'java.version',
            'maven.compiler.release',
            'maven.compiler.source',
            'maven.compiler.target',
            'kotlin.version',
            'spring-boot.version',
          ]) {
            if (props[key] !== undefined) cfg[key] = expand(props[key], props);
          }
          return cfg;
        }

        /**
         * STEP 4 — parse the manifests of ONE ecosystem.
         *
         * Kept per-ecosystem on purpose: adding Node or Maven becomes a new step on the
         * canvas feeding `build_payloads`, not another branch inside a growing blob.
         * Returns `{ [asset_id]: { dependencies, transitive_external_dropped, config } }`.
         *
         * `config` is what the manifests declare about THEMSELVES (`engines.node`, the
         * `go` directive, the package manager) — runtime statements that answer
         * "which assets still declare node 16", a question no dependency array can.
         * Keys are prefixed with the ecosystem so two manifests never collide.
         *
         * The parser is PASSED IN rather than looked up in a registry. Importing the
         * registry would drag every ecosystem's parser into every parse step's inlined
         * bundle — the Maven step carrying the Go and Python parsers it never calls —
         * which is exactly the "each step gets only what it uses" property the module
         * split exists to preserve. It went from 780 lines a step back to ~300.
         */
        function parseEcosystem(resolutions, ecosystem, opts) {
          const parse = opts.parse;
          if (!parse) throw new Error(`no parser passed for ecosystem "${ecosystem}"`);
          const readConfig = opts.readConfig;
          const keepAll = opts.keepTransitiveExternal === true;
          const isInternal = (name) => opts.internalPatterns.some((re) => re.test(name));

          const out = {};
          for (const r of resolutions) {
            for (const asset of r.assets) {
              const mine = asset.manifests.filter((m) => m.ecosystem === ecosystem);
              if (!mine.length) continue;

              const seen = new Set();
              const deps = [];
              const config = {};
              let dropped = 0;
              for (const m of mine) {
                const text = r.texts[m.path];
                if (text == null) continue;
                if (readConfig) {
                  // Last manifest wins on a collision. An asset with several manifests
                  // of one ecosystem is a monorepo subtree; the deepest one is listed
                  // last and is the more specific statement.
                  for (const [k, v] of Object.entries(readConfig(text, m.path, r.texts))) {
                    config[`${ecosystem}.${k}`] = v;
                  }
                }
                // The whole repository's fetched manifests, so a parser can resolve a
                // SIBLING file without a network call. Maven needs it: a module pom
                // inherits its `<properties>` from a parent pom that, in a monorepo of
                // lambdas, sits at the repository root and has already been fetched.
                for (const d of parse(text, m.path, r.texts)) {
                  const key = `${d.ecosystem} ${d.name} ${d.version}`;
                  if (seen.has(key)) continue;
                  seen.add(key);
                  const internal = isInternal(d.name);
                  if (!keepAll && !d.direct && !internal && !d.local) {
                    dropped += 1;
                    continue;
                  }
                  deps.push({ local: false, ...d, internal });
                }
              }
              out[asset.asset_id] = { dependencies: deps, transitive_external_dropped: dropped, config };
            }
          }
          return out;
        }

        /**
         * STEP `parse_maven` — extract dependencies from the `pom.xml` files.
         * No network.
         *
         * Direct declarations only, and no reactor resolution: a real Maven resolve
         * walks parent POMs and imported BOMs, which means either running Maven (we
         * never build) or chasing artifacts across the network from a sandbox. A
         * version that comes from a parent POM reaches the record verbatim as
         * `${some.version}` — obviously unresolved, rather than a guess.
         */
        const parsed = parseEcosystem(inputs.resolutions || [], 'java-maven', {
          parse: parsePomXml,
          readConfig: pomConfig,
          internalPatterns: compileInternalPatterns(inputs.internalPatterns),
          keepTransitiveExternal: inputs.keepTransitiveExternal === true,
        });
        log.info(`parsed java-maven for ${Object.keys(parsed).length} assets`);
        return { parsed };
        // <<< END parse_maven

  - id: parse_python
    type: module
    plugin_type: code-exec
    name: "Parse Python Dependencies"
    inputs:
      resolutions: "${{ steps.resolve_assets.outputs.resolutions }}"
      internalPatterns: "${{ vars.LIB_INTERNAL_PATTERNS }}"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    config:
      code: |
        // >>> GENERATED parse_python — do not edit by hand (build-workflow.mjs)
        const SCANNER_VERSION = 'lib-inventory/1.0.0';

        /** Manifest filename -> ecosystem. */
        const MANIFEST_LANGS = {
          'go.mod': 'go',
          'package.json': 'node',
          'pom.xml': 'java-maven',
          'build.gradle': 'java-gradle',
          'build.gradle.kts': 'java-gradle',
          'requirements.txt': 'python',
          'pyproject.toml': 'python',
          Pipfile: 'python',
          Gemfile: 'ruby',
          'Cargo.toml': 'rust',
          'composer.json': 'php',
          'pubspec.yaml': 'dart',
        };

        /**
         * Asset-name suffixes that describe the deployment shape rather than the code,
         * stripped before the L3 normalized comparison.
         */
        const NAME_SUFFIXES = [
          '-aws-lambda',
          '-aws-uks',
          '-lambda',
          '-service',
          '-local',
          '-docker-image',
          '-image',
          '-asset',
          '-app',
          '-api',
        ];

        /** Ecosystems we can currently parse. Everything else is reported, not parsed. */
        const SUPPORTED_ECOSYSTEMS = new Set(['go', 'node', 'java-maven', 'python', 'dotnet']);

        function manifestLang(basename) {
          if (MANIFEST_LANGS[basename]) return MANIFEST_LANGS[basename];
          if (basename.endsWith('.csproj')) return 'dotnet';
          return null;
        }

        /**
         * The last-resort spelling: lowercase with every separator removed.
         * `conto-api`, `Conto.Api` and `ContoApi` all land on `contoapi` — PascalCase
         * concatenation is how .NET names module directories, and no dash/dot rule
         * reaches it. No suffix stripping here: removing separators first would keep
         * the suffix list from ever matching, so the two normal forms coexist.
         */
        function squashName(name) {
          return String(name).toLowerCase().replace(/[-._ ]/g, '');
        }

        function normalizeName(name) {
          // Dots fold into dashes: .NET monorepos name modules `Conto.Api` while the
          // NP application is `conto-api` (110 unresolved assets in one live repo).
          let s = String(name).toLowerCase().replaceAll('.', '-');
          for (let changed = true; changed; ) {
            changed = false;
            for (const suf of NAME_SUFFIXES) {
              if (s.endsWith(suf)) {
                s = s.slice(0, -suf.length);
                changed = true;
              }
            }
          }
          return s.replace(/[^a-z0-9]/g, '');
        }

        /** `https://github.com/acme/x(.git)` -> `{owner, repo}`; null when not GitHub. */
        function parseRepoUrl(url) {
          const m = /github\.com[:/]+([^/]+)\/([^/]+?)(?:\.git)?\/?$/.exec(String(url || ''));
          return m ? { owner: m[1], repo: m[2] } : null;
        }

        /**
         * Compile the configured internal-library patterns once.
         * Accepts an array or the JSON string a config entry delivers (entries are
         * always strings, so `LIB_INTERNAL_PATTERNS` arrives as `'["^github\\.com/Acme/"]'`).
         */
        function compileInternalPatterns(patterns) {
          let list = patterns;
          if (typeof list === 'string') {
            const raw = list.trim();
            if (!raw) return [];
            try {
              list = JSON.parse(raw);
            } catch {
              // Tolerate a bare comma-separated list so a mis-typed entry still works.
              list = raw
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean);
            }
          }
          if (!Array.isArray(list)) return [];
          return list.map((p) => new RegExp(p));
        }

        /**
         * Python dependency parsing.
         *
         * Python declares dependencies in at least three unrelated files, so unlike Go
         * or Node this parser dispatches on the FILENAME. All three are handled because
         * a repository routinely has more than one — a `pyproject.toml` for the package
         * and a `requirements.txt` for the deployment.
         *
         * DIRECT DEPENDENCIES ONLY, same reasoning as Node: transitivity lives in a
         * lock file (`poetry.lock`, `requirements.txt` compiled by pip-tools) and those
         * are large enough to reintroduce the payload problem the per-build split
         * exists to solve. A hand-written `requirements.txt` is a direct declaration; a
         * pip-compiled one lists the closure and will over-report as direct. That is
         * visible in the data rather than hidden: such files carry `# via …` comment
         * lines, so `requirements_compiled` is recorded in `manifest_config`.
         */

        /** `name[extra1,extra2] >= 1.2 ; marker` → the name and the specifier. */
        const REQUIREMENT = /^([A-Za-z0-9._-]+)\s*(\[[^\]]*\])?\s*(.*)$/;

        /** Specifiers that mean "code in this repository", not a published package. */
        const LOCAL_PREFIX = /^(-e\s|\.|\.\.|\/|file:)/;

        /**
         * Parse a `requirements.txt`.
         *
         * Environment markers (`; python_version < "3.9"`) are dropped from the version
         * but the requirement is kept: it IS declared, and which interpreter selects it
         * is a different question from which libraries this asset can pull in.
         */
        function parseRequirementsTxt(text) {
          const deps = [];
          const seen = new Set();
          for (const raw of String(text).split('\n')) {
            let line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            // `-r other.txt` / `-c constraints.txt` point at another file, which the
            // scan will have fetched on its own if it is a recognised manifest.
            if (/^-{1,2}(r|c|requirement|constraint)\b/.test(line)) continue;
            if (/^-{1,2}(i|index-url|extra-index-url|f|find-links|no-|hash)/.test(line)) continue;

            const local = LOCAL_PREFIX.test(line);
            if (line.startsWith('-e ')) line = line.slice(3).trim();
            // Drop an inline comment and any environment marker.
            line = line.split('#')[0].split(';')[0].trim();
            if (!line) continue;

            // A path requirement (`-e ./svc`, `../shared`, `file:...`) has no package
            // name to extract — the path IS the identity. Running it through the
            // name regex yielded a dependency literally called ".".
            if (local) {
              if (seen.has(line.toLowerCase())) continue;
              seen.add(line.toLowerCase());
              deps.push({ name: line, version: '', direct: true, ecosystem: 'python', local: true });
              continue;
            }

            const m = REQUIREMENT.exec(line);
            if (!m) continue;
            const name = m[1];
            if (seen.has(name.toLowerCase())) continue;
            seen.add(name.toLowerCase());
            deps.push({
              name,
              version: (m[3] ?? '').trim(),
              direct: true,
              ecosystem: 'python',
              local,
            });
          }
          return deps;
        }

        /** The body of a `[section]` in a TOML file, up to the next section header. */
        function tomlSection(text, header) {
          const re = new RegExp(`^\\[${header.replace(/[.[\]]/g, '\\$&')}\\]\\s*$`, 'm');
          const start = re.exec(text);
          if (!start) return null;
          const rest = text.slice(start.index + start[0].length);
          const next = /^\[[^\]]+\]\s*$/m.exec(rest);
          return next ? rest.slice(0, next.index) : rest;
        }

        /** Entries of a TOML array-of-strings assigned to `key`. */
        function tomlStringArray(section, key) {
          const re = new RegExp(`^\\s*${key}\\s*=\\s*\\[([\\s\\S]*?)\\]`, 'm');
          const m = re.exec(section);
          if (!m) return [];
          return (m[1].match(/(['"])((?:\\.|(?!\1).)*)\1/g) ?? []).map((q) => q.slice(1, -1));
        }

        /**
         * Parse a `pyproject.toml`.
         *
         * Covers the two shapes in the wild: PEP 621 (`[project] dependencies = [...]`)
         * and Poetry (`[tool.poetry.dependencies]` as key/value). Poetry's `python`
         * entry is the INTERPRETER, not a library — it is excluded here and surfaces
         * through `manifest_config` instead, where the runtime question belongs.
         */
        function parsePyProjectToml(text) {
          const src = String(text);
          const deps = [];
          const seen = new Set();
          const push = (name, version, extra = {}) => {
            const key = name.toLowerCase();
            if (!name || seen.has(key)) return;
            seen.add(key);
            deps.push({ name, version, direct: true, ecosystem: 'python', local: false, ...extra });
          };

          // PEP 621
          const project = tomlSection(src, 'project');
          if (project) {
            for (const entry of tomlStringArray(project, 'dependencies')) {
              const m = REQUIREMENT.exec(entry.split(';')[0].trim());
              if (m) push(m[1], (m[3] ?? '').trim());
            }
          }
          // PEP 621 optional groups: `[project.optional-dependencies]`
          const optional = tomlSection(src, 'project.optional-dependencies');
          if (optional) {
            const arrays = optional.match(/^\s*[A-Za-z0-9_-]+\s*=\s*\[[\s\S]*?\]/gm) ?? [];
            for (const arr of arrays) {
              for (const entry of tomlStringArray(arr, '[A-Za-z0-9_-]+')) {
                const m = REQUIREMENT.exec(entry.split(';')[0].trim());
                if (m) push(m[1], (m[3] ?? '').trim(), { optional: true });
              }
            }
          }

          // Poetry
          for (const [header, flags] of [
            ['tool.poetry.dependencies', {}],
            ['tool.poetry.dev-dependencies', { dev: true }],
            ['tool.poetry.group.dev.dependencies', { dev: true }],
          ]) {
            const section = tomlSection(src, header);
            if (!section) continue;
            const entry = /^\s*([A-Za-z0-9._-]+)\s*=\s*(.+)$/gm;
            let m = entry.exec(section);
            while (m !== null) {
              const name = m[1];
              const rawValue = m[2].trim();
              if (name.toLowerCase() !== 'python') {
                const quoted = /^(['"])((?:\\.|(?!\1).)*)\1/.exec(rawValue);
                // An inline table (`{ path = "../shared" }`) is in-repo code; a
                // `{ version = "^1.2" }` table still carries a version.
                const version = quoted
                  ? quoted[2]
                  : (/version\s*=\s*['"]([^'"]+)['"]/.exec(rawValue)?.[1] ?? '');
                push(name, version, {
                  ...flags,
                  ...(/(path|url)\s*=/.test(rawValue) ? { local: true } : {}),
                });
              }
              m = entry.exec(section);
            }
          }

          return deps;
        }

        /** `Pipfile` — `[packages]` / `[dev-packages]`, TOML like Poetry's. */
        function parsePipfile(text) {
          const src = String(text);
          const deps = [];
          const seen = new Set();
          for (const [header, flags] of [
            ['packages', {}],
            ['dev-packages', { dev: true }],
          ]) {
            const section = tomlSection(src, header);
            if (!section) continue;
            const entry = /^\s*"?([A-Za-z0-9._-]+)"?\s*=\s*(.+)$/gm;
            let m = entry.exec(section);
            while (m !== null) {
              const name = m[1];
              const key = name.toLowerCase();
              if (!seen.has(key)) {
                seen.add(key);
                const rawValue = m[2].trim();
                const quoted = /^(['"])((?:\\.|(?!\1).)*)\1/.exec(rawValue);
                const version = quoted
                  ? quoted[2]
                  : (/version\s*=\s*['"]([^'"]+)['"]/.exec(rawValue)?.[1] ?? '');
                deps.push({
                  name,
                  version: version === '*' ? '' : version,
                  direct: true,
                  ecosystem: 'python',
                  local: /(path|file)\s*=/.test(rawValue),
                  ...flags,
                });
              }
              m = entry.exec(section);
            }
          }
          return deps;
        }

        /** Dispatch on the manifest filename — Python has three, unrelated in shape. */
        function parsePython(text, path = '') {
          const file = path.slice(path.lastIndexOf('/') + 1);
          if (file === 'pyproject.toml') return parsePyProjectToml(text);
          if (file === 'Pipfile') return parsePipfile(text);
          return parseRequirementsTxt(text);
        }

        /**
         * What a Python manifest declares about ITSELF — chiefly the interpreter it
         * targets, which is the runtime-deprecation question and is invisible in a
         * dependency list.
         */
        function pythonConfig(text, path = '') {
          const file = path.slice(path.lastIndexOf('/') + 1);
          const src = String(text);
          const cfg = {};

          if (file === 'pyproject.toml') {
            const project = tomlSection(src, 'project');
            const requires = /^\s*requires-python\s*=\s*['"]([^'"]+)['"]/m.exec(project ?? src);
            if (requires) cfg['requires-python'] = requires[1];
            const name = /^\s*name\s*=\s*['"]([^'"]+)['"]/m.exec(project ?? '');
            if (name) cfg.name = name[1];
            const poetry = tomlSection(src, 'tool.poetry.dependencies');
            const poetryPython = poetry ? /^\s*python\s*=\s*['"]([^'"]+)['"]/m.exec(poetry) : null;
