      # Same rate-limit handling as the tree fetch above: the wait comes from
      # GitHub's own reset header, not from this interval.
      retry_policy:
        max_attempts: 4
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    forEach:
      expression: "${{ steps.plan_manifest_fetches.outputs.requests }}"
      itemVariable: item
      spreadItem: true
      parallel: true
      maxConcurrency: 10

