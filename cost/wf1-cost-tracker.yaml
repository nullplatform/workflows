# Cost Tracker — daily per-scope cost from cluster Prometheus usage.
#
# For every active K8s scope, dispatches the metrics collector script through
# the np agent (previous UTC day, hourly buckets), prices the usage
# (millicore-hours × COST_PER_MILLICORE_HOUR + MB-hours × COST_PER_MB_RAM_HOUR)
# and upserts the scope's `cost-tracking` catalog instance (visible rollups +
# bounded 365-day series). The lake mirrors the instance JSON
# (core_entities_metadata.data), so Insights dashboards un-nest the series for
# zoom in/out — the instance is the single source both for the UI and the lake.
#
# Data flows step→step through declared `inputs:`/forEach expressions — no
# set-variable hops (snapshot shared-ref hazard + np-* plugins merge
# `{...config, ...ctx.inputs}`, so upstream output fields named like config
# keys hijack the plugin config).
#
# Per-org configuration (config entries on folder /cost):
#   NP_API_KEY (secret)            — NP API key (exchanged+cached by the plugins)
#   NP_ORGANIZATION_ID (var)       — organization id
#   COST_PER_MILLICORE_HOUR (var)  — price per millicore-hour (e.g. 0.000011)
#   COST_PER_MB_RAM_HOUR (var)     — price per MB-hour (e.g. 0.0000048)
#   COST_CURRENCY (var)            — display currency (e.g. USD)
#   COST_AGENT_CMDLINE (var)       — base command on the agent host
#                                    (e.g. /opt/nullplatform/cost/collect-metrics.sh)
#   COST_AGENT_NRN (var)           — nrn for agent selection (e.g. organization=…)
#   COST_AGENT_CLUSTER (var)       — agent tag `cluster` value (e.g. runtime)
#   COST_POD_MATCHERS_TEMPLATE (var) — PromQL matchers with {scope_id}
#                                    {scope_slug} {scope_name} {app_name}
#                                    placeholders
id: cost_tracker
name: "Cost Tracker"
description: >
  Daily job (04:00, also manual) that computes yesterday's cost per active K8s
  scope from cluster Prometheus usage via the np agent, and upserts each
  scope's cost-tracking catalog instance (rollups + 365-day series).
path: "/cost"
semantic_version: 1.0.0

inputs:
  date:
    type: string
    required: false
    description: "UTC day to compute (YYYY-MM-DD). Default: yesterday."
  nrn:
    type: string
    required: false
    description: "Optional NRN prefix filter — only scopes under this NRN are processed (empty = whole organization)"

steps:
  - id: start_manual
    type: trigger
    plugin_type: manual
    name: "Run Now"
    config:
      description: "Computes per-scope cost for one day (default: yesterday)."
      inputs:
        date:
          type: string
          required: false
          description: "UTC day to compute (YYYY-MM-DD)"
          placeholder: "2026-07-15"
        nrn:
          type: string
          required: false
          description: "Only process scopes under this NRN (prefix match)"
          placeholder: "organization=…:account=…"

  - id: start_cron
    type: trigger
    plugin_type: cron
    name: "Daily 04:00"
    config:
      schedule: "0 4 * * *"
      timezone: "America/Argentina/Buenos_Aires"

  # ── Active K8s scopes ─────────────────────────────────────────────────
  - id: lake_scopes
    type: module
    plugin_type: np-lake-query
    name: "Active K8s Scopes (lake)"
    join_strategy: any
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      sql: |
        SELECT s.id AS scope_id, s.name AS scope_name, s.scope_slug AS scope_slug,
               s.nrn AS scope_nrn, s.type AS scope_type, a.app_name AS app_name
        FROM core_entities_scope AS s FINAL
        JOIN core_entities_application AS a FINAL
          ON s.application_id = a.app_id AND a._deleted = 0
        WHERE s._deleted = 0
          AND s.status = 'active'
          -- Same coverage as the scanner: every type that can be k8s-backed.
          -- Non-k8s ones price as no-data (no pods match) and are skipped.
          AND s.type IN ('web_pool_k8s', 'custom', 'web_pool')
        LIMIT 5000

  # ── Resolve run parameters + optional NRN filter ──────────────────────
  - id: prep_run
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item. In the Temporal
    # sandbox plugin descriptors are unavailable, so the engine cannot see
    # executeMode "all" and would fan out per item (N identical runs).
    metadata: { fanOutPerItem: false }
    name: "Resolve Date & Filter Scopes"
    inputs:
      rows: "${{ steps.lake_scopes.outputs.rows }}"
      date: "${{ workflow.inputs.date }}"
      nrn:  "${{ workflow.inputs.nrn }}"
    config:
      code: |
        var rows = inputs.rows || [];
        var date = String(inputs.date || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          // Default: yesterday (UTC). Runs as an activity, Date is fine here.
          date = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        }
        var nrn = String(inputs.nrn || '').trim();
        var out = [];
        for (var i = 0; i < rows.length; i++) {
          var s = (rows[i] || {}).scope_nrn || '';
          if (!nrn || s === nrn || s.indexOf(nrn + ':') === 0) out.push(rows[i]);
        }
        log.info('Cost run prepared', { date: date, scopes: out.length, of: rows.length, nrn_filter: nrn || null });
        return { date: date, scopes: out, total: out.length, nrn_filter: nrn || null };

  # ── One collector sub-execution per scope ─────────────────────────────
  - id: collect_scopes
    type: module
    plugin_type: sub-workflow
    name: "Collect & Price per Scope"
    forEach:
      expression: "${{ steps.prep_run.outputs.scopes }}"
      itemVariable: scope
      parallel: true
      maxConcurrency: 5
    inputs:
      date: "${{ steps.prep_run.outputs.date }}"
    config:
      # PER-ORG id of the loaded "Cost Tracker — Collect Scope" workflow.
      # Sub-workflow resolution is by workflow id (slugs do NOT resolve).
      # setup/04-upload-workflows.mjs patches this on upload.
      workflowId: cost_scope_collect
      waitForCompletion: true

  - id: summary
    type: module
    plugin_type: code-exec
    # Aggregate step: NEVER dispatch per upstream item (see prep_run note).
    metadata: { fanOutPerItem: false }
    name: "Build Summary"
    inputs:
      results:    "${{ steps.collect_scopes.outputs.items }}"
      date:       "${{ steps.prep_run.outputs.date }}"
      total:      "${{ steps.prep_run.outputs.total }}"
      nrn_filter: "${{ steps.prep_run.outputs.nrn_filter }}"
    config:
      code: |
        var results = inputs.results || [];
        var ok = 0, noData = 0, failed = 0, orgCost = 0;
        for (var i = 0; i < results.length; i++) {
          // Live engine wraps each fan-out item as {outputs, _childExecutionId};
          // the E2E harness stubs return the outputs flat. Accept both.
          var r = (results[i] || {}).outputs || results[i] || {};
          if (r.status === 'ok') { ok++; orgCost += Number(r.cost_day) || 0; }
          else if (r.status === 'no-data') noData++;
          else failed++;
        }
        return {
          date: inputs.date,
          nrn_filter: inputs.nrn_filter || null,
          scopes: inputs.total || 0,
          priced: ok,
          no_data: noData,
          failed: failed,
          org_cost_day: Math.round(orgCost * 10000) / 10000
        };

  - id: log_done
    type: module
    plugin_type: log
    name: "Run Complete"
    config:
      level: info
      message: "Cost tracker ${{ steps.summary.outputs.date }}: ${{ steps.summary.outputs.priced }}/${{ steps.summary.outputs.scopes }} scopes priced (no data: ${{ steps.summary.outputs.no_data }}, failed: ${{ steps.summary.outputs.failed }}), org cost of the day: ${{ steps.summary.outputs.org_cost_day }}."

connections:
  - { id: c1, from: start_manual,   to: lake_scopes }
  - { id: c2, from: start_cron,     to: lake_scopes }
  - { id: c3, from: lake_scopes,    to: prep_run }
  - { id: c4, from: prep_run,       to: collect_scopes }
  - { id: c5, from: collect_scopes, to: summary }
  - { id: c6, from: summary,        to: log_done }

outputs:
  date:         "${{ steps.summary.outputs.date }}"
  scopes:       "${{ steps.summary.outputs.scopes }}"
  priced:       "${{ steps.summary.outputs.priced }}"
  no_data:      "${{ steps.summary.outputs.no_data }}"
  failed:       "${{ steps.summary.outputs.failed }}"
  org_cost_day: "${{ steps.summary.outputs.org_cost_day }}"
