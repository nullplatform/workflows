# finops/wf3-k8s-consumption-daily.yaml
#
# Kubernetes consumption of one day, per null scope, priced with the cluster's
# BLENDED rates of that day (raw cluster row from wf1: rate_cpu_usd_core_h,
# rate_mem_usd_gb_h) — and the consumption metric the allocator uses to split the
# cluster's cost among applications.
#
# Chargeback model (same as the cost tracker, docs/decisions D-chargeback): a scope
# pays max(usage, request) PER HOUR — requests bind nodes whether used or not.
#   core_h_chargeable = Σ_hours max(cpu_used, cpu_requested) / 1000
#   gb_h_chargeable   = Σ_hours max(mem_used, mem_requested) / 1024
#   cost_usd          = core_h_chargeable × rate_cpu + gb_h_chargeable × rate_mem
#   usage_usd / waste_usd alongside (what it used / reserved-but-unused).
# Σ scope cost ≤ cluster cost; the difference (system namespaces, observability
# stacks, idle headroom) is the cluster's k8s overhead and stays with the cluster.
#
# Data path: scopes from the lake → per scope, the collector script on the
# customer's agent (`collect-metrics.sh --mode day --scope <id>`, Prometheus in the
# cluster, matches both k8s scope naming styles by pod name) → raw facts
# `raw-k8s-scope-<scope_id>-<day>` (source k8s) + the cluster row patched with
# `metric: k8s.chargeable`, `metric_shares` {scope_id → share}, `metric_owners`.
# Replaces the metadata `cost_tracking` write of cost/wf1b: everything is catalog.
id: finops_k8s_consumption_daily
name: "FinOps — Kubernetes consumption per scope (daily)"
description: >
  Per-scope Kubernetes consumption of a day (usage vs request, priced with the
  cluster's blended rates) and the consumption shares that split the cluster's
  cost among applications.
path: "/finops"
semantic_version: 0.1.0

inputs:
  date:
    type: string
    required: false
    description: "Day, YYYY-MM-DD (UTC). Default: yesterday."
  cluster:
    type: string
    required: false
    description: "Cluster name as in the raw cluster row (default: variables.cluster)"
  nrn:
    type: string
    required: false
    description: "Only scopes under this NRN"
  dry_run:
    type: boolean
    required: false
  collector_mode:
    type: string
    required: false
    description: "Override of variables.collector_mode: agent | newrelic"
  nr_account_id:
    type: number
    required: false
    description: "Override of the NR_ACCOUNT_ID config entry (newrelic mode)"

variables:
  # Where the per-scope consumption comes from: `agent` (collector script on the customer's agent →
  # Prometheus in the cluster) or `newrelic` (NerdGraph K8sContainerSample, labels scope_id/application_id
  # ingested by the NR Kubernetes integration; needs config entries NR_USER_KEY, NR_ACCOUNT_ID [, NR_GRAPHQL_URL]).
  collector_mode:
    initialValue: "agent"
  cluster:
    initialValue: "runtime"
  # NRN subtree of the scopes this cluster serves (the org, or one account): lake + API listings.
  org_nrn:
    initialValue: "organization=1255165411"
  # Agent that can reach the cluster's Prometheus (the same one the cost tracker uses).
  agent_tags:
    initialValue: { cluster: "runtime" }
  agent_nrn:
    initialValue: ""
  # Collector command on the agent (command repo), day mode: `<base> --mode day --date D --scope ID`.
  collector_cmd:
    initialValue: "nullplatform/platform-scopes-override/cost/collect_metrics --prom http://prometheus-server.default.svc.cluster.local"
  max_concurrency:
    initialValue: 4
  collector:
    initialValue: "finops_k8s_consumption_daily@0.1.0"

steps:
  - id: start
    type: trigger
    plugin_type: manual
    name: "Collect k8s consumption"
    config:
      description: "Per-scope Kubernetes consumption of a day."
      inputs:
        date: { type: string, required: false, description: "YYYY-MM-DD" }
        cluster: { type: string, required: false, description: "Cluster name" }
        nrn: { type: string, required: false, description: "Scope subtree" }
        dry_run: { type: boolean, required: false, description: "Compute without writing" }

  - id: prep
    type: module
    plugin_type: code-exec
    name: "Day, cluster, agent"
    inputs:
      date: "${{ workflow.inputs.date }}"
      cluster: "${{ workflow.inputs.cluster }}"
      cluster_default: "${{ variables.cluster }}"
      collector_mode: "${{ workflow.inputs.collector_mode }}"
      collector_mode_default: "${{ variables.collector_mode }}"
      agent_tags: "${{ variables.agent_tags }}"
      agent_nrn: "${{ variables.agent_nrn }}"
      org_nrn: "${{ variables.org_nrn }}"
    config:
      language: javascript
      code: |
        function iso(dt) { return dt.toISOString().slice(0, 10); }
        var day = inputs.date && /^\d{4}-\d{2}-\d{2}$/.test(String(inputs.date)) ? String(inputs.date) : iso(new Date(Date.now() - 86400000));
        var cluster = String(inputs.cluster || inputs.cluster_default || "").trim();
        if (!cluster) throw new Error("cluster is required");
        var mode = String(inputs.collector_mode || inputs.collector_mode_default || "agent").trim().toLowerCase(); if (mode !== "agent" && mode !== "newrelic") throw new Error("collector_mode must be agent or newrelic (got " + mode + ")");
        var sel = { tags: inputs.agent_tags || { cluster: cluster } };
        if (inputs.agent_nrn) sel.nrn = String(inputs.agent_nrn);
        return { day: day, cluster: cluster, collector_mode: mode, agent_selector: sel, scope_filters: { nrn: String(inputs.org_nrn || ""), status: "active" }, cluster_row_path: "/catalog/instances/cost_daily/raw-cluster-" + cluster.toLowerCase().replace(/[^a-z0-9_]+/g, "-") + "-" + day };

  - id: lake_scopes
    type: module
    plugin_type: np-lake-query
    name: "Active k8s-capable scopes (lake)"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      sql: |
        SELECT s.id AS scope_id, s.name AS scope_name, s.scope_slug AS scope_slug,
               s.nrn AS scope_nrn, s.type AS scope_type, a.app_name AS app_name, a.application_slug AS app_slug
        FROM core_entities_scope AS s FINAL
        JOIN core_entities_application AS a FINAL
          ON s.application_id = a.app_id AND a._deleted = 0
        WHERE s._deleted = 0
          AND s.status = 'active'
          AND s.type IN ('web_pool_k8s', 'custom', 'web_pool')
          -- only the subtree the cluster serves (variables.org_nrn: the org, or one account); an org
          -- with thousands of scopes would otherwise drag ~0.5 MB through the parent's history
          AND (s.nrn = '${{ variables.org_nrn }}' OR s.nrn LIKE '${{ variables.org_nrn }}:%')
        LIMIT 5000

  - id: scope_dims
    type: module
    plugin_type: np-entity-paginated-fetch
    name: "Scopes with dimensions (API)"
    output_projection: ["items[].id", "items[].dimensions", "totalFetched", "pages"]
    inputs:
      filters: "${{ steps.prep.outputs.scope_filters }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      entity: "scope"
      filters: { status: "active" }
      limit: 100
      maxPages: 100

  - id: cluster_row
    type: module
    plugin_type: np-api-call
    name: "Raw cluster row of the day (rates)"
    inputs:
      path: "${{ steps.prep.outputs.cluster_row_path }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/catalog/instances/cost_daily/placeholder"
      failOnHttpError: false

  - id: prep_run
    type: module
    plugin_type: code-exec
    name: "Scopes → collector commands"
    metadata: { fanOutPerItem: false }
    join_strategy: all
    inputs:
      rows: "${{ steps.lake_scopes.outputs.rows }}"
      api_scopes: "${{ steps.scope_dims.outputs.items }}"
      day: "${{ steps.prep.outputs.day }}"
      nrn: "${{ workflow.inputs.nrn }}"
      base: "${{ variables.collector_cmd }}"
      cluster_status: "${{ steps.cluster_row.outputs.status }}"
      cluster_body: "${{ steps.cluster_row.outputs.body }}"
    config:
      language: javascript
      code: |
        var rows = inputs.rows || []; var nrn = String(inputs.nrn || "").trim();
        var dimsById = {}; (inputs.api_scopes || []).forEach(function (sc) { if (sc && sc.id) dimsById[String(sc.id)] = sc.dimensions && Object.keys(sc.dimensions).length ? sc.dimensions : null; });
        function dims(n) { var o = {}; String(n || "").split(":").forEach(function (kv) { var p = kv.split("="); if (p.length === 2) o[p[0]] = p[1]; }); return o; }
        var scopes = [];
        rows.forEach(function (r) {
          var sn = String(r.scope_nrn || ""); if (nrn && sn !== nrn && sn.indexOf(nrn + ":") !== 0) return;
          var d = dims(sn);
          scopes.push({ scope_id: String(r.scope_id), scope_name: r.scope_name || null, scope_slug: r.scope_slug || null, scope_type: r.scope_type || null, app_name: r.app_name || null, app_slug: r.app_slug || null,
                        application_id: d.application || null, namespace_id: d.namespace || null, account_id: d.account || null, nrn: sn || null,
                        dimensions: dimsById[String(r.scope_id)] || null });
        });
        if (Number(inputs.cluster_status) !== 200 || !inputs.cluster_body || !inputs.cluster_body.id) throw new Error("raw cluster row not found for the day (run finops_aws_billing_daily first): " + JSON.stringify(inputs.cluster_body).slice(0, 200));
        var c = inputs.cluster_body;
        if (!(Number(c.rate_cpu_usd_core_h) > 0) || !(Number(c.rate_mem_usd_gb_h) > 0)) throw new Error("cluster row has no blended rates");
        var cmds = scopes.map(function (s) { return { cmdline: String(inputs.base) + " --mode day --date " + String(inputs.day) + " --scope " + s.scope_id }; });
        return { scopes: scopes, commands: cmds, count: scopes.length, cluster: { id: c.id, cost_usd: Number(c.cost_usd) || 0, rate_cpu: Number(c.rate_cpu_usd_core_h), rate_mem: Number(c.rate_mem_usd_gb_h), cpu_share: Number(c.cpu_share) || 0.5, core_h: Number(c.cpu_capacity_core_h) || 0, gb_h: Number(c.mem_capacity_gb_h) || 0 }, cluster_body: c };

  - id: route
    type: decider
    plugin_type: conditional
    name: "Collector: New Relic or agent?"
    config:
      expression: "steps.prep.outputs.collector_mode == 'newrelic'"

  # ── New Relic path: one NRQL for the whole cluster-day, FACET scope_id × hour ─────────────
  - id: nr_build
    type: module
    plugin_type: code-exec
    name: "Build NerdGraph query (cluster-day by scope × hour)"
    inputs:
      day: "${{ steps.prep.outputs.day }}"
      cluster: "${{ steps.prep.outputs.cluster }}"
      account_id: "${{ workflow.inputs.nr_account_id || vars.NR_ACCOUNT_ID }}"
      scopes: "${{ steps.prep_run.outputs.scopes }}"
    config:
      language: javascript
      code: |
        var accountId = Number(inputs.account_id); if (!(accountId > 0)) throw new Error("NR_ACCOUNT_ID config entry must be a positive number");
        var day = String(inputs.day); var next = new Date(new Date(day + "T00:00:00Z").getTime() + 86400000).toISOString().slice(0, 10);
        var cluster = String(inputs.cluster).replace(/'/g, "");
        // Per (scope, hour): average per pod-sample × distinct pods ≈ the scope's hourly consumption; same
        // pod-hour semantics as the agent collector (cost-nr wf1b, FACET podName+hour, summed here per hour).
        var nrql = "SELECT average(cpuUsedCores) AS cpu, average(memoryWorkingSetBytes) AS mem, average(cpuRequestedCores) AS cpuReq, average(memoryRequestedBytes) AS memReq, uniqueCount(podName) AS pods, count(*) AS samples " +
          "FROM K8sContainerSample WHERE clusterName = '" + cluster + "' AND containerName = 'application' AND `label.scope_id` IS NOT NULL " +
          "FACET `label.scope_id`, hourOf(timestamp) SINCE '" + day + " 00:00:00 UTC' UNTIL '" + next + " 00:00:00 UTC' LIMIT MAX";
        function esc(q) { return q.split("\\").join("\\\\").split('"').join('\\"'); }
        var gql = "{ actor { account(id: " + accountId + ") { usage: nrql(query: \"" + esc(nrql) + "\", timeout: 120) { results } } } }";
        return { payload: { query: gql }, nrql: nrql, scopes: (inputs.scopes || []).length };

  # inputs shield: http-request merges ctx.inputs OVER config — the declared body keeps inherited
  # passthrough from touching url/method.
  - id: nr_query
    type: module
    plugin_type: http-request
    name: "Query New Relic"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "5s"
        backoff_strategy: exponential
        jitter: 0.3
    inputs:
      body: "${{ steps.nr_build.outputs.payload }}"
    config:
      url: "${{ vars.NR_GRAPHQL_URL || 'https://api.newrelic.com/graphql' }}"
      method: POST
      timeout: "150s"
      headers:
        Api-Key: "${{ secrets.NR_USER_KEY }}"
        Content-Type: "application/json"

  - id: nr_shape
    type: module
    plugin_type: code-exec
    name: "NR rows → per-scope collector shape"
    inputs:
      scopes: "${{ steps.prep_run.outputs.scopes }}"
      status: "${{ steps.nr_query.outputs.status }}"
      body: "${{ steps.nr_query.outputs.body }}"
    config:
      language: javascript
      code: |
        var body = inputs.body; if (typeof body === "string") { try { body = JSON.parse(body); } catch (e) { body = null; } }
        if (Number(inputs.status) !== 200 || !body) throw new Error("NerdGraph HTTP " + inputs.status + ": " + String(JSON.stringify(inputs.body) || "").slice(0, 200));
        if (body.errors && body.errors.length) throw new Error("NerdGraph error: " + JSON.stringify(body.errors).slice(0, 300));
        var rows = ((((body.data || {}).actor || {}).account || {}).usage || {}).results || [];
        // Same shape the agent collector prints per scope (hours[] + totals), keyed by scope id.
        var per = {};
        rows.forEach(function (r) {
          var sid = String(r["label.scope_id"] || (r.facet && r.facet[0]) || ""); if (!sid) return;
          var hourLabel = String(r["Hour of timestamp"] || (r.facet && r.facet[1]) || ""); var h = parseInt(hourLabel, 10); if (isNaN(h)) return;
          var pods = Number(r.pods) || 0; if (!(pods > 0)) return;
          var o = per[sid] || (per[sid] = { samples: 0, hours: [], cpu_mc_hours: 0, mem_mb_hours: 0 });
          var cpuMc = (Number(r.cpu) || 0) * 1000 * pods, memMb = (Number(r.mem) || 0) / 1048576 * pods;
          o.hours.push({ hour: h, cpu_mc: cpuMc, mem_mb: memMb, cpu_req_mc: (Number(r.cpuReq) || 0) * 1000 * pods, mem_req_mb: (Number(r.memReq) || 0) / 1048576 * pods, pods: pods });
          o.cpu_mc_hours += cpuMc; o.mem_mb_hours += memMb; o.samples += Number(r.samples) || pods;
        });
        var items = (inputs.scopes || []).map(function (s) { var o = per[String(s.scope_id)]; return { stdout: JSON.stringify(o || { samples: 0, hours: [] }) }; });
        return { items: items, scopes_with_data: Object.keys(per).length, rows: rows.length };

  - id: collect
    type: module
    plugin_type: np-agent-command
    name: "Collector on the agent (per scope, fan-out)"
    forEach:
      expression: "${{ steps.prep_run.outputs.commands }}"
      itemVariable: cmd
      spreadItem: true
      parallel: true
      maxConcurrency: 4
    error_handling:
      retry_policy:
        max_attempts: 2
        initial_interval: "5s"
        backoff_strategy: exponential
        jitter: 0.3
    config:
      command_type: exec
      apikey: "${{ secrets.NP_API_KEY }}"
      timeout_seconds: 120
      inject_workflow_env: false
      agent_selector:
        nrn: "${{ variables.agent_nrn }}"
        tags: "${{ variables.agent_tags }}"
      cmdline: "/bin/true"

  - id: build
    type: module
    plugin_type: code-exec
    name: "Price scopes + cluster shares"
    metadata: { fanOutPerItem: false }
    join_strategy: any
    inputs:
      results_nr: "${{ steps.nr_shape.outputs.items }}"
      day: "${{ steps.prep.outputs.day }}"
      cluster_name: "${{ steps.prep.outputs.cluster }}"
      scopes: "${{ steps.prep_run.outputs.scopes }}"
      cluster: "${{ steps.prep_run.outputs.cluster }}"
      cluster_body: "${{ steps.prep_run.outputs.cluster_body }}"
      results: "${{ steps.collect.outputs.items }}"
      collector: "${{ variables.collector }}"
      collector_mode: "${{ steps.prep.outputs.collector_mode }}"
      dry_run: "${{ workflow.inputs.dry_run }}"
    config:
      language: javascript
      code: |
        var d = String(inputs.day); var now = new Date().toISOString(); var C = inputs.cluster || {}; var cname = String(inputs.cluster_name);
        function num(x) { return Math.round((Number(x) || 0) * 1e6) / 1e6; }
        var scopes = inputs.scopes || []; var results = String(inputs.collector_mode) === "newrelic" ? (inputs.results_nr || []) : (inputs.results || []);
        var facts = []; var shares = {}; var owners = {}; var sum = 0; var withData = 0; var errors = [];
        scopes.forEach(function (s, i) {
          var r = results[i] || {}; var o = r.outputs || r; var parsed = null;
          try { parsed = JSON.parse(String(o.stdout || "")); } catch (e) { errors.push({ scope_id: s.scope_id, error: "stdout is not JSON: " + String(o.stdout || o.stderr || "").slice(0, 120) }); return; }
          if (parsed.error) { errors.push({ scope_id: s.scope_id, error: String(parsed.error).slice(0, 200) }); return; }
          var samples = Number(parsed.samples) || 0; if (!samples) return; // no pods in this cluster → not a k8s scope here
          withData += 1;
          var hrs = parsed.hours || []; var chCore = 0, chGb = 0, reqCore = 0, reqGb = 0, pods = 0, podsN = 0;
          hrs.forEach(function (h) {
            var cu = Number(h.cpu_mc) || 0, mu = Number(h.mem_mb) || 0, cr = Number(h.cpu_req_mc) || 0, mr = Number(h.mem_req_mb) || 0, p = Number(h.pods) || 0;
            if (cu <= 0 && mu <= 0 && cr <= 0 && mr <= 0) return;
            chCore += Math.max(cu, cr) / 1000; chGb += Math.max(mu, mr) / 1024; reqCore += cr / 1000; reqGb += mr / 1024; if (p > 0) { pods += p; podsN += 1; }
          });
          var usedCore = (Number(parsed.cpu_mc_hours) || 0) / 1000, usedGb = (Number(parsed.mem_mb_hours) || 0) / 1024;
          if (!hrs.length) { chCore = Math.max(usedCore, (Number(parsed.cpu_req_mc_avg) || 0) * samples / 1000); chGb = Math.max(usedGb, (Number(parsed.mem_req_mb_avg) || 0) * samples / 1024); }
          var cost = num(chCore * C.rate_cpu + chGb * C.rate_mem); var usage = num(usedCore * C.rate_cpu + usedGb * C.rate_mem);
          var f = { id: "raw-k8s-scope-" + s.scope_id + "-" + d, date: d, day: d, stage: "raw", subject_type: "scope", subject_id: s.scope_id, subject_name: (s.app_slug ? s.app_slug + "." : "") + (s.scope_slug || s.scope_name || s.scope_id),
                    cloud: "aws", cloud_account: inputs.cluster_body.cloud_account || null, cloud_service: null, cluster: cname, region: inputs.cluster_body.region || null, source: "k8s", collected_at: now, collector: String(inputs.collector),
                    scope_id: s.scope_id, scope_name: s.scope_name || null, scope_type: s.scope_type || null, dimensions: s.dimensions || null, environment: (s.dimensions || {}).environment || null, application_id: s.application_id, application_slug: s.app_slug || null, namespace_id: s.namespace_id, account_id: s.account_id, nrn: s.nrn,
                    cost_usd: cost, usage_usd: usage, waste_usd: num(Math.max(cost - usage, 0)), core_h_chargeable: num(chCore), gb_h_chargeable: num(chGb), core_h_used: num(usedCore), gb_h_used: num(usedGb),
                    core_h_requested: num(reqCore), gb_h_requested: num(reqGb), pods_avg: podsN ? num(pods / podsN) : null, quantity: samples, units: "samples",
                    rate_cpu_usd_core_h: C.rate_cpu, rate_mem_usd_gb_h: C.rate_mem, allocation_method: "direct_resource", metric: "k8s.chargeable" };
          facts.push(f); sum += cost;
          if (cost > 0) { shares[s.scope_id] = cost; owners[s.scope_id] = { application_id: s.application_id, namespace_id: s.namespace_id, scope_id: s.scope_id, account_id: s.account_id, application_slug: s.app_slug || null, scope_name: s.scope_name || null, scope_type: s.scope_type || null, dimensions: s.dimensions || null }; }
        });
        var clusterCost = num(C.cost_usd); var denom = clusterCost > 0 ? Math.max(clusterCost, sum) : sum; // shares never exceed 1
        Object.keys(shares).forEach(function (k) { shares[k] = denom ? num(shares[k] / denom) : 0; });
        var overhead = num(Math.max(clusterCost - sum, 0));
        var clusterRow = Object.assign({}, inputs.cluster_body, { metric: "k8s.chargeable", metric_shares: shares, metric_owners: owners, k8s_overhead_usd: overhead, collected_at: now });
        var writes = facts.map(function (f) { return { fact: f, catalog_slug: "cost_daily" }; });
        if (Object.keys(shares).length) writes.push({ fact: clusterRow, catalog_slug: "cost_daily" });
        var summary = { day: d, cluster: cname, cluster_cost_usd: clusterCost, scopes: scopes.length, with_data: withData, scopes_cost_usd: num(sum), overhead_usd: overhead, coverage_pct: clusterCost ? num(100 * Math.min(sum, clusterCost) / clusterCost) : 0,
                        rate_cpu_usd_core_h: C.rate_cpu, rate_mem_usd_gb_h: C.rate_mem, errors: errors.slice(0, 20), error_count: errors.length, dry_run: !!inputs.dry_run,
                        top: facts.slice().sort(function (a, b) { return b.cost_usd - a.cost_usd; }).slice(0, 15).map(function (f) { return { scope: f.subject_name, application_id: f.application_id, cost_usd: f.cost_usd, usage_usd: f.usage_usd, core_h_chargeable: f.core_h_chargeable, gb_h_chargeable: f.gb_h_chargeable }; }) };
        return { facts: facts, cluster_row: clusterRow, to_write: inputs.dry_run ? [] : writes, summary: summary };

  - id: write
    type: module
    plugin_type: sub-workflow
    name: "Upsert scope facts + cluster metric (fan-out)"
    forEach:
      expression: "${{ steps.build.outputs.to_write }}"
      itemVariable: row
      spreadItem: true
      parallel: true
      maxConcurrency: 5
    config:
      # Definition id of finops/wf-cost-fact-upsert.yaml (patched at publish time).
      workflowId: FINOPS_COST_FACT_UPSERT_ID
      alias: live
      waitForCompletion: true

  - id: summary
    type: module
    plugin_type: code-exec
    name: "Summary"
    metadata: { fanOutPerItem: false }
    inputs:
      summary: "${{ steps.build.outputs.summary }}"
      results: "${{ steps.write.outputs.items }}"
    config:
      language: javascript
      code: |
        var s = Object.assign({}, inputs.summary || {}); s.written = s.dry_run ? 0 : (inputs.results || []).length; return s;

connections:
  - { from: start, to: prep }
  - { from: prep, to: lake_scopes }
  - { from: prep, to: scope_dims }
  - { from: prep, to: cluster_row }
  - { from: lake_scopes, to: prep_run }
  - { from: scope_dims, to: prep_run }
  - { from: cluster_row, to: prep_run }
  - { from: prep_run, to: route }
  - { id: r_agent, from: route, to: collect, source_port: "false" }
  - { id: r_nr, from: route, to: nr_build, source_port: "true" }
  - { from: nr_build, to: nr_query }
  - { from: nr_query, to: nr_shape }
  - { from: nr_shape, to: build }
  - { from: collect, to: build }
  - { from: build, to: write }
  - { from: write, to: summary }

outputs:
  summary: "${{ steps.summary.outputs }}"
  facts: "${{ steps.build.outputs.facts }}"
