# finops/wf0-aws-billing-dispatch.yaml
#
# Daily loop: collect (wf1 per target) → k8s consumption per scope (wf3, per cluster) →
# allocate (wf2, rules + consumption shares) → suggest (evidence for the rest). Multi-account dispatcher: one `target` per AWS account to collect, each with
# ITS OWN agent (tags), role (AssumeRole ARN + ExternalId) and region. Fans out
# `wf1-aws-billing-daily` once per target and summarizes. The association of
# facts → account is NOT taken from this config: every fact carries
# `cloud_account` from the STS identity the worker actually ran with.
#
# targets (variable `targets`, JSON array — set it on the customer's revision or
# from a config entry): [{ "name": "prod", "agent_tags": {"cluster":"runtime"}, "agent_nrn": "organization=4:account=17",
#   "assume_role_arn": "arn:aws:iam::111122223333:role/np-finops", "assume_role_external_id": "…",
#   "region": "us-east-1", "expected_account": "111122223333" }]
# `expected_account` (optional) makes the run fail if the worker's identity is a
# different account — catches a wrong role/agent pairing.
id: finops_aws_billing_dispatch
name: "FinOps — AWS billing dispatch (multi-account)"
description: >
  Runs the daily AWS billing collector once per configured target (account ×
  agent × role) and summarizes facts written per account.
path: "/finops"
semantic_version: 0.1.0

inputs:
  date:
    type: string
    required: false
    description: "Day to collect, YYYY-MM-DD (UTC). Default: yesterday."
  targets:
    type: array
    required: false
    description: "Override of variables.targets: [{name, agent_tags, agent_nrn?, org_nrn?, assume_role_arn?, assume_role_external_id?, region?, expected_account?}]"
  callback_base_url:
    type: string
    required: false
    description: "Engine URL the workers can reach (local dev only)"
  dry_run:
    type: boolean
    required: false
    description: "Build facts without writing (collection, allocation and suggestions)"
  allocate:
    type: boolean
    required: false
    description: "Run the allocator + suggestions after collection (default true)"
  k8s:
    type: boolean
    required: false
    description: "Collect Kubernetes consumption per scope for the configured clusters before allocating (default true)"
  k8s_clusters:
    type: array
    required: false
    description: "Override of variables.k8s_clusters: [{cluster}]"

variables:
  targets:
    initialValue: []
  # Kubernetes clusters whose consumption splits their cost: [{cluster}] (wf3 variables hold the agent + collector per org).
  k8s_clusters:
    initialValue: []

steps:
  - id: start
    type: trigger
    plugin_type: manual
    name: "Dispatch"
    config:
      description: "Collect one day of AWS billing for every configured account."
      inputs:
        date: { type: string, required: false, description: "YYYY-MM-DD (UTC)" }
        targets: { type: array, required: false, description: "Targets override" }
        callback_base_url: { type: string, required: false, description: "Engine URL for the worker callback" }
        dry_run: { type: boolean, required: false, description: "Build facts without writing" }
        allocate: { type: boolean, required: false, description: "Run allocator + suggestions after collection (default true)" }
        k8s: { type: boolean, required: false, description: "Collect Kubernetes consumption before allocating (default true)" }
        k8s_clusters: { type: array, required: false, description: "Clusters override" }

  - id: daily_cron
    type: trigger
    plugin_type: cron
    name: "Daily 04:15 UTC"
    config:
      schedule: "15 4 * * *"
      timezone: "UTC"

  - id: prep
    type: module
    plugin_type: code-exec
    name: "Resolve targets"
    join_strategy: any
    inputs:
      targets: "${{ workflow.inputs.targets }}"
      default_targets: "${{ variables.targets }}"
      date: "${{ workflow.inputs.date }}"
      callback_base_url: "${{ workflow.inputs.callback_base_url }}"
      dry_run: "${{ workflow.inputs.dry_run }}"
      allocate: "${{ workflow.inputs.allocate }}"
      k8s: "${{ workflow.inputs.k8s }}"
      k8s_clusters: "${{ workflow.inputs.k8s_clusters }}"
      k8s_clusters_default: "${{ variables.k8s_clusters }}"
    config:
      language: javascript
      code: |
        var list = Array.isArray(inputs.targets) && inputs.targets.length ? inputs.targets : (Array.isArray(inputs.default_targets) ? inputs.default_targets : []);
        if (!list.length) throw new Error("no targets configured (variables.targets or inputs.targets)");
        var seen = {};
        var runs = list.map(function (t, i) {
          if (!t || typeof t !== "object") throw new Error("targets[" + i + "] must be an object");
          var name = String(t.name || ("target-" + i));
          if (seen[name]) throw new Error("duplicate target name " + name); seen[name] = true;
          if (!t.agent_tags || typeof t.agent_tags !== "object" || !Object.keys(t.agent_tags).length) throw new Error("targets[" + i + "] (" + name + ") needs agent_tags");
          // Keys match wf1's inputs: the forEach spreads each target into the child's inputs.
          return { target_name: name, agent_tags: t.agent_tags, agent_nrn: t.agent_nrn || null, org_nrn: t.org_nrn || null, assume_role_arn: t.assume_role_arn || null, assume_role_external_id: t.assume_role_external_id || null,
                   package_version: t.package_version || null, region: t.region || null, expected_account: t.expected_account ? String(t.expected_account) : null, account_dimensions: t.dimensions && typeof t.dimensions === "object" ? t.dimensions : null,
                   date: inputs.date || null, callback_base_url: inputs.callback_base_url || null, dry_run: !!inputs.dry_run };
        });
        function iso(dt) { return dt.toISOString().slice(0, 10); }
        var day = inputs.date && /^\d{4}-\d{2}-\d{2}$/.test(String(inputs.date)) ? String(inputs.date) : iso(new Date(Date.now() - 86400000));
        var doAlloc = inputs.allocate === undefined || inputs.allocate === null || inputs.allocate === "" ? true : !!inputs.allocate;
        var doK8s = inputs.k8s === undefined || inputs.k8s === null || inputs.k8s === "" ? true : !!inputs.k8s;
        var clusters = Array.isArray(inputs.k8s_clusters) && inputs.k8s_clusters.length ? inputs.k8s_clusters : (Array.isArray(inputs.k8s_clusters_default) ? inputs.k8s_clusters_default : []);
        var k8s = doK8s ? clusters.map(function (c) { return { date: day, cluster: String(c.cluster), dry_run: !!inputs.dry_run }; }) : [];
        return { runs: runs, count: runs.length, day: day, k8s: k8s, allocate: doAlloc ? [{ date: day, dry_run: !!inputs.dry_run }] : [] };

  - id: collect
    type: module
    plugin_type: sub-workflow
    # Children return their facts/batches for tests and drill-down; the dispatcher only needs the summary
    # (and the allocator's unallocated leaves). Keeps the parent's history and the next step's input small.
    output_projection: ["items[].outputs.summary", "items[].outputs.unallocated_leaves", "items[]._childExecutionId", "summary", "unallocated_leaves"]
    name: "Collect per account (fan-out)"
    forEach:
      expression: "${{ steps.prep.outputs.runs }}"
      itemVariable: target
      # Spread each target object into the child's inputs (its keys are wf1's input names).
      spreadItem: true
      parallel: true
      maxConcurrency: 3
    config:
      # Definition id of finops/wf1-aws-billing-daily.yaml (patched at publish time).
      workflowId: FINOPS_AWS_BILLING_DAILY_ID
      alias: live
      waitForCompletion: true

  - id: summary
    type: module
    plugin_type: code-exec
    name: "Summary per account"
    metadata: { fanOutPerItem: false }
    inputs:
      runs: "${{ steps.prep.outputs.runs }}"
      results: "${{ steps.collect.outputs.items }}"
    config:
      language: javascript
      code: |
        var runs = inputs.runs || []; var results = inputs.results || [];
        var accounts = results.map(function (r, i) {
          // live engine wraps each fan-out item as {outputs, _childExecutionId}; the E2E stub returns outputs flat
          var o = (r || {}).outputs || r || {}; var s = o.summary || {};
          return { target: (runs[i] || {}).target_name || null, account: s.account || null, day: s.day || null,
                   daily_total_usd: s.daily_total_usd || 0, facts: s.facts || 0, written: s.written || 0, clusters: (s.clusters || []).length };
        });
        var total = accounts.reduce(function (a, x) { return a + (Number(x.daily_total_usd) || 0); }, 0);
        return { targets: runs.length, accounts: accounts, total_usd: Math.round(total * 1e6) / 1e6 };

  # ── Kubernetes consumption per scope for each configured cluster (needs the raw cluster row of the day).
  - id: k8s
    type: module
    plugin_type: sub-workflow
    # Children return their facts/batches for tests and drill-down; the dispatcher only needs the summary
    # (and the allocator's unallocated leaves). Keeps the parent's history and the next step's input small.
    output_projection: ["items[].outputs.summary", "items[].outputs.unallocated_leaves", "items[]._childExecutionId", "summary", "unallocated_leaves"]
    name: "k8s consumption per scope (wf3)"
    forEach:
      expression: "${{ steps.prep.outputs.k8s }}"
      itemVariable: run
      spreadItem: true
    config:
      # Definition id of finops/wf3-k8s-consumption-daily.yaml (patched at publish time).
      workflowId: FINOPS_K8S_CONSUMPTION_ID
      alias: live
      waitForCompletion: true

  # ── allocate the day (rules → allocated facts + rollup per application). One item, or none when allocate=false.
  - id: allocate
    type: module
    plugin_type: sub-workflow
    # Children return their facts/batches for tests and drill-down; the dispatcher only needs the summary
    # (and the allocator's unallocated leaves). Keeps the parent's history and the next step's input small.
    output_projection: ["items[].outputs.summary", "items[].outputs.unallocated_leaves", "items[]._childExecutionId", "summary", "unallocated_leaves"]
    name: "Allocate the day (wf2)"
    forEach:
      expression: "${{ steps.prep.outputs.allocate }}"
      itemVariable: run
      spreadItem: true
    config:
      # Definition id of finops/wf2-allocate-daily.yaml (patched at publish time).
      workflowId: FINOPS_ALLOCATE_DAILY_ID
      alias: live
      waitForCompletion: true

  - id: suggest_prep
    type: module
    plugin_type: code-exec
    name: "Unallocated leaves → suggestion run"
    metadata: { fanOutPerItem: false }
    inputs:
      day: "${{ steps.prep.outputs.day }}"
      dry_run: "${{ workflow.inputs.dry_run }}"
      results: "${{ steps.allocate.outputs.items }}"
    config:
      language: javascript
      code: |
        var r = (inputs.results || [])[0] || {}; var o = r.outputs || r || {};
        var leaves = o.unallocated_leaves || [];
        var summary = o.summary || null;
        return { allocation: summary, runs: leaves.length ? [{ date: String(inputs.day), unallocated_leaves: leaves, dry_run: !!inputs.dry_run }] : [] };

  - id: suggest
    type: module
    plugin_type: sub-workflow
    name: "Suggest mapping rules (evidence)"
    forEach:
      expression: "${{ steps.suggest_prep.outputs.runs }}"
      itemVariable: run
      spreadItem: true
    config:
      # Definition id of finops/wf-suggest-mappings.yaml (patched at publish time).
      workflowId: FINOPS_SUGGEST_MAPPINGS_ID
      alias: live
      waitForCompletion: true

  - id: final
    type: module
    plugin_type: code-exec
    name: "Daily summary"
    metadata: { fanOutPerItem: false }
    inputs:
      collection: "${{ steps.summary.outputs }}"
      k8s: "${{ steps.k8s.outputs.items }}"
      allocation: "${{ steps.suggest_prep.outputs.allocation }}"
      suggestions: "${{ steps.suggest.outputs.items }}"
    config:
      language: javascript
      code: |
        var sg = (inputs.suggestions || [])[0] || {}; var so = sg.outputs || sg || {};
        var k = (inputs.k8s || []).map(function (r) { var o = r.outputs || r || {}; return o.summary || null; }).filter(Boolean);
        return { collection: inputs.collection || null, kubernetes: k, allocation: inputs.allocation || null, suggestions: so.summary || null };

connections:
  - { from: start, to: prep }
  - { from: daily_cron, to: prep }
  - { from: prep, to: collect }
  - { from: collect, to: summary }
  - { from: summary, to: k8s }
  - { from: k8s, to: allocate }
  - { from: allocate, to: suggest_prep }
  - { from: suggest_prep, to: suggest }
  - { from: suggest, to: final }

outputs:
  summary: "${{ steps.final.outputs }}"
