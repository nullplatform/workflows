# finops/wf1-aws-billing-daily.yaml
#
# Daily collector (phase 1): one day of AWS billing → cost_daily facts.
#
#   cloud-query (agent, IAM role)             build_facts (code-exec)            write_facts (fan-out)
#   ─────────────────────────────             ───────────────────────            ───────────────────────
#   CE by SERVICE                         →   cloud_service facts (Σ = day)  →   finops_cost_fact_upsert
#   CE by SERVICE + USAGE_TYPE            →   bucket facts (parent = service)    one child per fact
#   CE per EC2 resource (+ hours)         →   scope / resource facts
#   EC2 DescribeInstances / Volumes       →   cluster facts + components
#   Tagging API (LBs, RDS, cache…)        →   cluster LB share, DB facts
#   EC2 DescribeInstanceTypes (2nd call)  →   capacity → blended rates
#
# Cost basis: AMORTIZED (cost_usd), unblended kept in unblended_usd.
# Sum rule: Σ cost_usd over subject_type=cloud_service for a day equals the
# AWS daily amortized total. Every other subject is an ATTRIBUTION of part of
# that total (bucket / resource / scope / cluster carry `parent_id` or are
# derived) and must not be added to it.
#
# Cluster = nodes + control plane + load balancers tagged to it + VPC-level
# networking (NAT, endpoints, public IPv4, data transfer) + EBS attached to
# its nodes + other EC2 charges (CPU credits) by instance share. The cluster is
# NOT split per scope here: it carries a BLENDED RATE per core-hour and per
# GB-hour over its reserved capacity (cpu_share configurable) so the allocator
# can charge consumers by consumption; idle capacity stays on the cluster.
# `dry_run: true` builds everything and writes nothing.
id: finops_aws_billing_daily
name: "FinOps — AWS billing daily"
description: >
  Collects one day of AWS cost through the cloud-query package (Cost Explorer
  by service, by usage type, per EC2 resource; EC2, volumes, tags, instance
  types) and upserts dimensioned cost_daily facts: cloud services, buckets,
  tagged scopes, EKS clusters with components and blended rates, databases.
path: "/finops"
semantic_version: 0.2.0

inputs:
  date:
    type: string
    required: false
    description: "Day to collect, YYYY-MM-DD (UTC). Default: yesterday."
  agent_tags:
    type: object
    required: false
    description: "Agent selector tags. Default: variables.agent_tags"
  agent_nrn:
    type: string
    required: false
    description: "NRN subtree of the agent (e.g. organization=4:account=17). Default: variables.agent_nrn"
  org_nrn:
    type: string
    required: false
    description: "Root NRN for listing null services (mapping DB hosts → services). Default: variables.org_nrn"
  callback_base_url:
    type: string
    required: false
    description: "Engine URL the worker can reach (local dev: http://host.docker.internal:<port>)"
  dry_run:
    type: boolean
    required: false
    description: "When true, build the facts but do not write them"
  assume_role_arn:
    type: string
    required: false
    description: "Per-customer/account role the worker assumes for the AWS calls (default: variables.assume_role_arn). Empty = the pod's own identity."
  assume_role_external_id:
    type: string
    required: false
    description: "ExternalId for that role's trust policy (default: variables.assume_role_external_id)"
  package_version:
    type: string
    required: false
    description: "cloud-query version to run → selects the agent's worker pin and its SERVICE ACCOUNT (default: variables.package_version)"
  target_name:
    type: string
    required: false
    description: "Label of the dispatcher target (informational)"
  expected_account:
    type: string
    required: false
    description: "If set, the run FAILS when the worker's STS identity is another AWS account (wrong agent/role pairing)"

variables:
  agent_tags:
    initialValue: { package: "cloud-query" }
  # Per-customer role configuration. Set these on the customer's revision (or
  # pass the inputs): with an ARN the worker runs STS AssumeRole before every
  # call; empty means the pod's own IAM identity (IRSA / Pod Identity).
  assume_role_arn:
    initialValue: ""
  assume_role_external_id:
    initialValue: ""
  package_version:
    initialValue: ""
  # AWS region for regional SDK calls (EC2, ELB, RDS). Cost Explorer is global.
  aws_region:
    initialValue: "us-east-1"
  ec2_service_name:
    initialValue: "Amazon Elastic Compute Cloud - Compute"
  ec2_other_service_name:
    initialValue: "EC2 - Other"
  eks_service_name:
    initialValue: "Amazon Elastic Container Service for Kubernetes"
  vpc_service_name:
    initialValue: "Amazon Virtual Private Cloud"
  elb_service_name:
    initialValue: "Amazon Elastic Load Balancing"
  rds_service_name:
    initialValue: "Amazon Relational Database Service"
  # Cost allocation tag that names the owner of RDS resources (nullplatform: `application`).
  rds_owner_tag:
    initialValue: "application"
  # Cloud services whose resources carry the null tags (Lambda functions today): their cost is
  # grouped by the active cost allocation tags `scope` × `application` and mapped to the scope id
  # through the resource tags (tagging API). One CE call per service (CE groups by 2 keys max).
  tagged_services:
    initialValue: ["AWS Lambda"]
  tagged_resource_types:
    initialValue: ["lambda:function"]
  # Share of the cluster cost attributed to CPU (the rest to memory) when
  # deriving the blended rates. 0.5 = Kubecost-style even split; tune per org.
  cpu_share:
    initialValue: 0.5
  # Root NRN for listing null services (mapping cloud databases/caches → null service by host).
  org_nrn:
    initialValue: "organization=1255165411"
  # NRN subtree of the agent; needed when the agent is registered under an account.
  agent_nrn:
    initialValue: ""
  collector:
    initialValue: "finops_aws_billing_daily@0.2.0"

steps:
  - id: start
    type: trigger
    plugin_type: manual
    name: "Collect"
    config:
      description: "Collect one day of AWS billing into cost_daily facts."
      inputs:
        date:
          type: string
          required: false
          description: "YYYY-MM-DD (UTC), default yesterday"
        agent_tags:
          type: object
          required: false
          description: "Agent selector tags"
        agent_nrn:
          type: string
          required: false
          description: "NRN subtree of the agent"
        org_nrn:
          type: string
          required: false
          description: "Root NRN for listing null services"
        callback_base_url:
          type: string
          required: false
          description: "Engine URL for the worker callback"
        dry_run:
          type: boolean
          required: false
          description: "Build facts without writing"
        assume_role_arn:
          type: string
          required: false
          description: "Role ARN the worker assumes"
        assume_role_external_id:
          type: string
          required: false
          description: "AssumeRole ExternalId"
        package_version:
          type: string
          required: false
          description: "cloud-query version (→ pin → service account)"
        target_name:
          type: string
          required: false
          description: "Dispatcher target label"
        expected_account:
          type: string
          required: false
          description: "Expected AWS account id"

  - id: prep
    type: module
    plugin_type: code-exec
    name: "Day window + cloud-query calls"
    join_strategy: any
    inputs:
      date: "${{ workflow.inputs.date }}"
      agent_tags: "${{ workflow.inputs.agent_tags }}"
      default_tags: "${{ variables.agent_tags }}"
      agent_nrn: "${{ workflow.inputs.agent_nrn }}"
      agent_nrn_default: "${{ variables.agent_nrn }}"
      org_nrn: "${{ workflow.inputs.org_nrn }}"
      org_nrn_default: "${{ variables.org_nrn }}"
      region: "${{ variables.aws_region }}"
      ec2_service: "${{ variables.ec2_service_name }}"
      rds_service: "${{ variables.rds_service_name }}"
      rds_owner_tag: "${{ variables.rds_owner_tag }}"
      tagged_services: "${{ variables.tagged_services }}"
      tagged_resource_types: "${{ variables.tagged_resource_types }}"
      role_arn: "${{ workflow.inputs.assume_role_arn }}"
      role_arn_default: "${{ variables.assume_role_arn }}"
      role_ext: "${{ workflow.inputs.assume_role_external_id }}"
      role_ext_default: "${{ variables.assume_role_external_id }}"
      package_version: "${{ workflow.inputs.package_version }}"
      package_version_default: "${{ variables.package_version }}"
    config:
      language: javascript
      code: |
        function iso(d) { return d.toISOString().slice(0, 10); }
        var day = inputs.date && /^\d{4}-\d{2}-\d{2}$/.test(String(inputs.date)) ? String(inputs.date) : iso(new Date(Date.now() - 86400000));
        var next = iso(new Date(new Date(day + "T00:00:00Z").getTime() + 86400000));
        var period = { Start: day, End: next };
        var tags = (inputs.agent_tags && Object.keys(inputs.agent_tags).length) ? inputs.agent_tags : inputs.default_tags;
        var agentNrn = String(inputs.agent_nrn || inputs.agent_nrn_default || "").trim();
        var orgNrn = String(inputs.org_nrn || inputs.org_nrn_default || "").trim();
        if (!/^organization=\d+/.test(orgNrn)) throw new Error("org_nrn must start with organization=<id> (got " + orgNrn + ")");
        var calls = [
          { id: "identity", service: "sts", operation: "GetCallerIdentity" },
          { id: "by_service", service: "ce", operation: "GetCostAndUsage",
            params: { TimePeriod: period, Granularity: "DAILY", Metrics: ["AmortizedCost", "UnblendedCost"], GroupBy: [{ Type: "DIMENSION", Key: "SERVICE" }] } },
          { id: "by_usage_type", service: "ce", operation: "GetCostAndUsage",
            params: { TimePeriod: period, Granularity: "DAILY", Metrics: ["AmortizedCost", "UnblendedCost", "UsageQuantity"], GroupBy: [{ Type: "DIMENSION", Key: "SERVICE" }, { Type: "DIMENSION", Key: "USAGE_TYPE" }] } },
          { id: "ec2_by_resource", service: "ce", operation: "GetCostAndUsageWithResources",
            params: { TimePeriod: period, Granularity: "DAILY", Metrics: ["AmortizedCost", "UnblendedCost", "UsageQuantity"], GroupBy: [{ Type: "DIMENSION", Key: "RESOURCE_ID" }, { Type: "DIMENSION", Key: "INSTANCE_TYPE" }],
                      Filter: { Dimensions: { Key: "SERVICE", Values: [String(inputs.ec2_service)] } } } },
          // RDS by the owner tag (cost allocation tag `application`, active on the payer) × usage type: the real
          // cost per cluster (tagged) and the untagged usage types (an untagged instance, backups) to place by class.
          { id: "rds_by_tag", service: "ce", operation: "GetCostAndUsage",
            params: { TimePeriod: period, Granularity: "DAILY", Metrics: ["AmortizedCost"], GroupBy: [{ Type: "TAG", Key: String(inputs.rds_owner_tag) }, { Type: "DIMENSION", Key: "USAGE_TYPE" }],
                      Filter: { Dimensions: { Key: "SERVICE", Values: [String(inputs.rds_service)] } } } },
          { id: "instances", service: "ec2", operation: "DescribeInstances", params: {} },
          { id: "volumes", service: "ec2", operation: "DescribeVolumes", params: {} },
          // Tags for the resources we attribute beyond EC2: load balancers (cluster
          // ownership), databases, caches. Scoped by type to stay under the cap.
          { id: "tagged", service: "tagging", operation: "GetResources",
            params: { ResourceTypeFilters: ["elasticloadbalancing:loadbalancer", "rds:cluster", "rds:db", "elasticache:cluster", "elasticache:replicationgroup"], ResourcesPerPage: 100 }, maxPages: 20 },
          // All load balancers (the tagging API omits never-tagged resources, so it
          // cannot be the denominator of the cluster's LB share).
          { id: "lbs", service: "elbv2", operation: "DescribeLoadBalancers", params: {} },
          { id: "db_clusters", service: "rds", operation: "DescribeDBClusters", params: {} },
          { id: "db_instances", service: "rds", operation: "DescribeDBInstances", params: {} }
        ];
        // Tagged services (Lambda…): cost by the null tags `scope` × `application`, plus the resources' full tag
        // sets so the (application, scope) pair resolves to scope_id / application_id / namespace_id.
        var tagged = Array.isArray(inputs.tagged_services) ? inputs.tagged_services.map(String).filter(Boolean) : [];
        tagged.forEach(function (svc) {
          calls.push({ id: "svc_by_tag_" + svc.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""), service: "ce", operation: "GetCostAndUsage",
            params: { TimePeriod: period, Granularity: "DAILY", Metrics: ["AmortizedCost", "UnblendedCost"], GroupBy: [{ Type: "TAG", Key: "scope" }, { Type: "TAG", Key: "application" }],
                      Filter: { Dimensions: { Key: "SERVICE", Values: [svc] } } } });
        });
        var taggedTypes = Array.isArray(inputs.tagged_resource_types) ? inputs.tagged_resource_types.map(String).filter(Boolean) : [];
        if (tagged.length && taggedTypes.length) calls.push({ id: "fn_tags", service: "tagging", operation: "GetResources", params: { ResourceTypeFilters: taggedTypes, ResourcesPerPage: 100 }, maxPages: 20 });
        var roleArn = String(inputs.role_arn || inputs.role_arn_default || "").trim();
        if (roleArn && !/^arn:aws:iam::\d{12}:role\/[\w+=,.@\/-]+$/.test(roleArn)) throw new Error("assume_role_arn is not an IAM role ARN: " + roleArn);
        var roleExt = String(inputs.role_ext || inputs.role_ext_default || "").trim();
        var ver = String(inputs.package_version || inputs.package_version_default || "").trim();
        return { day: day, calls: calls, agent_tags: tags, agent_nrn: agentNrn || null, org_nrn: orgNrn, region: String(inputs.region), assume_role_arn: roleArn || null, assume_role_external_id: roleExt || null, package_version: ver || null };

  - id: query
    type: module
    plugin_type: sub-workflow
    name: "cloud-query (agent)"
    inputs:
      agent_tags: "${{ steps.prep.outputs.agent_tags }}"
      agent_nrn: "${{ steps.prep.outputs.agent_nrn }}"
      calls: "${{ steps.prep.outputs.calls }}"
      region: "${{ steps.prep.outputs.region }}"
      callback_base_url: "${{ workflow.inputs.callback_base_url }}"
      assume_role_arn: "${{ steps.prep.outputs.assume_role_arn }}"
      assume_role_external_id: "${{ steps.prep.outputs.assume_role_external_id }}"
      package_version: "${{ steps.prep.outputs.package_version }}"
    config:
      # Definition id of finops/tool-cloud-query.yaml (patched at publish time).
      workflowId: FINOPS_CLOUD_QUERY_ID
      alias: live
      waitForCompletion: true
      iterateItems: false

  - id: prep_types
    type: module
    plugin_type: code-exec
    name: "Instance types in use"
    inputs:
      results: "${{ steps.query.outputs.results }}"
      failed: "${{ steps.query.outputs.failed }}"
      day: "${{ steps.prep.outputs.day }}"
    config:
      language: javascript
      code: |
        var failed = inputs.failed || [];
        if (failed.length) throw new Error("cloud-query calls failed: " + failed.join(", "));
        var types = {};
        (((inputs.results || {}).instances || {}).Reservations || []).forEach(function (res) {
          (res.Instances || []).forEach(function (i) { if (i.InstanceType) types[i.InstanceType] = true; });
        });
        // types of instances that already terminated (Cost Explorer resource rows carry INSTANCE_TYPE)
        (((inputs.results || {}).ec2_by_resource || {}).ResultsByTime || []).forEach(function (rt) { (rt.Groups || []).forEach(function (g) { var t = g.Keys && g.Keys[1]; if (t && t !== "NoInstanceType" && /^[a-z0-9]+\.[a-z0-9]+$/.test(t)) types[t] = true; }); });
        var list = Object.keys(types).sort();
        var calls = [{ id: "instance_types", service: "ec2", operation: "DescribeInstanceTypes", params: { InstanceTypes: list.length ? list : ["t3.micro"] } }];
        // Performance Insights: DB load by DATABASE for each RDS subject (the writer of an Aurora
        // cluster, or the instance itself). This is what splits a shared cluster by consumer.
        var day = String(inputs.day); var next = new Date(new Date(day + "T00:00:00Z").getTime() + 86400000).toISOString().slice(0, 10);
        var byInst = {}; (((inputs.results || {}).db_instances || {}).DBInstances || []).forEach(function (i) { byInst[i.DBInstanceIdentifier] = i; });
        var pi = [];
        (((inputs.results || {}).db_clusters || {}).DBClusters || []).forEach(function (c) {
          var w = (c.DBClusterMembers || []).filter(function (m) { return m.IsClusterWriter; })[0] || (c.DBClusterMembers || [])[0];
          var inst = w ? byInst[w.DBInstanceIdentifier] : null;
          if (inst && inst.PerformanceInsightsEnabled && inst.DbiResourceId) pi.push({ subject: c.DBClusterIdentifier, res: inst.DbiResourceId });
        });
        Object.keys(byInst).forEach(function (id) { var i = byInst[id]; if (!i.DBClusterIdentifier && i.PerformanceInsightsEnabled && i.DbiResourceId) pi.push({ subject: id, res: i.DbiResourceId }); });
        pi.forEach(function (p) {
          calls.push({ id: "pi_" + p.subject, service: "pi", operation: "GetResourceMetrics", params: { ServiceType: "RDS", Identifier: p.res, StartTime: day + "T00:00:00Z", EndTime: next + "T00:00:00Z", PeriodInSeconds: 86400,
                       MetricQueries: [{ Metric: "db.load.avg", GroupBy: { Group: "db", Limit: 25 } }] } });
        });
        return { types: list, pi_subjects: pi.map(function (p) { return p.subject; }), calls: calls };

  - id: query_types
    type: module
    plugin_type: sub-workflow
    name: "cloud-query: instance types"
    inputs:
      agent_tags: "${{ steps.prep.outputs.agent_tags }}"
      agent_nrn: "${{ steps.prep.outputs.agent_nrn }}"
      calls: "${{ steps.prep_types.outputs.calls }}"
      region: "${{ steps.prep.outputs.region }}"
      callback_base_url: "${{ workflow.inputs.callback_base_url }}"
      assume_role_arn: "${{ steps.prep.outputs.assume_role_arn }}"
      assume_role_external_id: "${{ steps.prep.outputs.assume_role_external_id }}"
      package_version: "${{ steps.prep.outputs.package_version }}"
    config:
      workflowId: FINOPS_CLOUD_QUERY_ID
      alias: live
      waitForCompletion: true
      iterateItems: false

  # null services (dependencies) with their attributes: a cloud database maps to
  # the service whose `attributes.host` is its endpoint. No tags needed.
  - id: np_services
    type: module
    plugin_type: np-api-call
    name: "null services (descendants)"
    inputs:
      day: "${{ steps.prep.outputs.day }}"
      # Inputs override config in np-api-call; the NRN is per run (org override).
      query:
        nrn: "${{ steps.prep.outputs.org_nrn }}"
        show_descendants: "true"
        limit: "500"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/service"
      query:
        nrn: "${{ variables.org_nrn }}"
        show_descendants: "true"
        limit: "500"
      failOnHttpError: false

  - id: build_facts
    type: module
    plugin_type: code-exec
    name: "Build cost_daily facts"
    inputs:
      day: "${{ steps.prep.outputs.day }}"
      np_services: "${{ steps.np_services.outputs.body }}"
      results: "${{ steps.query.outputs.results }}"
      types_results: "${{ steps.query_types.outputs.results }}"
      identity: "${{ steps.query.outputs.identity }}"
      failed: "${{ steps.query_types.outputs.failed }}"
      region: "${{ steps.prep.outputs.region }}"
      ec2_service: "${{ variables.ec2_service_name }}"
      ec2_other_service: "${{ variables.ec2_other_service_name }}"
      eks_service: "${{ variables.eks_service_name }}"
      vpc_service: "${{ variables.vpc_service_name }}"
      elb_service: "${{ variables.elb_service_name }}"
      rds_service: "${{ variables.rds_service_name }}"
      rds_owner_tag: "${{ variables.rds_owner_tag }}"
      tagged_services: "${{ variables.tagged_services }}"
      tagged_resource_types: "${{ variables.tagged_resource_types }}"
      cpu_share: "${{ variables.cpu_share }}"
      collector: "${{ variables.collector }}"
      dry_run: "${{ workflow.inputs.dry_run }}"
      expected_account: "${{ workflow.inputs.expected_account }}"
      target_name: "${{ workflow.inputs.target_name }}"
    config:
      language: javascript
      code: |
        var d = String(inputs.day);
        var r = inputs.results || {};
        var failed = inputs.failed || [];
        if (failed.length) throw new Error("cloud-query calls failed: " + failed.join(", "));
        function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
        var acct = (inputs.identity && inputs.identity.account) ? String(inputs.identity.account) : null;
        // The account comes from the STS identity the worker ACTUALLY ran with (after AssumeRole),
        // never from config. `expected_account` guards against a wrong agent/role pairing.
        if (inputs.expected_account && String(inputs.expected_account) !== String(acct)) throw new Error("worker identity is account " + acct + " but target " + (inputs.target_name || "?") + " expects " + inputs.expected_account);
        var region = String(inputs.region);
        var now = new Date().toISOString();
        var cpuShare = Number(inputs.cpu_share); if (!(cpuShare >= 0 && cpuShare <= 1)) cpuShare = 0.5;
        function num(x) { var n = Number(x); return isFinite(n) ? Math.round(n * 1e6) / 1e6 : 0; }
        // Cost basis: AMORTIZED (Savings Plans / RIs spread over the usage they cover).
        // Unblended shows on-demand equivalents per resource plus a negation line
        // without resource (seen in kwik: -22.85/day on NoResourceId), useless for
        // attribution. Unblended is kept alongside for transparency.
        function amort(g) { return num((g.Metrics.AmortizedCost || g.Metrics.UnblendedCost || {}).Amount); }
        function unbl(g) { return num((g.Metrics.UnblendedCost || {}).Amount); }
        function qty(g) { return num((g.Metrics.UsageQuantity || {}).Amount); }
        function base(stage, type, id) {
          // Logical id: every part is also a field. Dashes only — the catalog path rejects ':' and '/'.
          return { id: stage + "-" + type + "-" + slug(id) + "-" + d, date: d, day: d, stage: stage, subject_type: type, subject_id: id,
                   cloud: "aws", cloud_account: acct, source: "aws_ce", collected_at: now, collector: String(inputs.collector),
                   allocation_method: "unallocated" };
        }
        // Tag conventions seen in the wild: plain (EC2/Lambda/ECR) and `nullplatform:`-prefixed (API Gateway).
        function tagMap(list) { var t = {}; (list || []).forEach(function (kv) { t[kv.Key] = kv.Value; }); return t; }
        function npDims(t) {
          function pick() { for (var i = 0; i < arguments.length; i++) { var v = t[arguments[i]]; if (v !== undefined && v !== null && v !== "") return String(v); } return null; }
          return { scope_id: pick("scope_id", "nullplatform:scope-id", "np:scope_id"), scope_name: pick("scope", "nullplatform:scope", "np:scope"),
                   application_id: pick("application_id", "nullplatform:application-id"), application_name: pick("application", "nullplatform:application"),
                   namespace_id: pick("namespace_id", "nullplatform:namespace-id"), namespace_name: pick("namespace", "nullplatform:namespace"),
                   account_id: pick("account_id", "nullplatform:account-id"), account_name: pick("account", "nullplatform:account"),
                   environment: pick("environment", "nullplatform:environment", "env") };
        }
        function clusterOf(t) {
          var c = t["eks:cluster-name"] || t["aws:eks:cluster-name"] || t["elbv2.k8s.aws/cluster"] || null;
          if (!c) Object.keys(t).forEach(function (k) { var m = /^kubernetes\.io\/cluster\/(.+)$/.exec(k); if (m) c = m[1]; });
          return c;
        }
        var facts = [];
        // ── 1) cloud_service: the org-level truth, one per AWS service. Σ = daily total.
        var svcTotal = {}, svcUnbl = {};
        ((r.by_service || {}).ResultsByTime || []).forEach(function (rt) {
          (rt.Groups || []).forEach(function (g) { var svc = g.Keys[0]; svcTotal[svc] = (svcTotal[svc] || 0) + amort(g); svcUnbl[svc] = (svcUnbl[svc] || 0) + unbl(g); });
        });
        var svcFactId = {};
        Object.keys(svcTotal).forEach(function (svc) {
          var f = base("raw", "cloud_service", slug(svc));
          f.subject_name = svc; f.cloud_service = svc; f.cost_usd = num(svcTotal[svc]); f.unblended_usd = num(svcUnbl[svc]);
          svcFactId[svc] = f.id; facts.push(f);
        });
        // ── 2) bucket per (service, usage_type): breakdown of the service fact (parent_id).
        var usage = []; // [{svc, ut, cost, qty, unit}]
        ((r.by_usage_type || {}).ResultsByTime || []).forEach(function (rt) {
          (rt.Groups || []).forEach(function (g) {
            var svc = g.Keys[0], ut = g.Keys[1]; var c = amort(g);
            if (c === 0 && unbl(g) === 0) return;
            usage.push({ svc: svc, ut: ut, cost: c, qty: qty(g), unit: g.Metrics.UsageQuantity ? g.Metrics.UsageQuantity.Unit : null });
            var f = base("raw", "bucket", slug(svc) + "|" + slug(ut));
