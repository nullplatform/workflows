# Checklist template: deploy-gate
#
# The template the governance workflows in this folder pair with. Associate
# it with the ApprovalAction for `deployment:create` (typically scoped to
# `dimensions.environment=production`); every deployment then opens a
# ChecklistRun with these items, and the external ones are resolved by the
# workflows in `governance/` (matched by `external.kind` — see README.md).
#
# External items on the NP dispatch path declare ONLY
# `kind` + `inputs` + `timeout_seconds` + `trigger`. There is no
# channel/url/method/headers here: routing is decided by the
# notification_channel each workflow's `np-checklist-trigger` auto-registers
# on alias activation (filtering on `source=checklist`,
# `action=checklist:item:dispatched`, `context.kind=<kind>`). The
# approval-api validator rejects the old url-bearing shape
# (CHECKLIST_TEMPLATE.INVALID_EXTERNAL_SHAPE).
#
# Create + associate with the np-checklist skill (or the raw API):
#   create_template.sh --nrn "organization=<org-id>" --name "deploy-gate" \
#     --definition-file ./deploy-gate.yaml --created-by "<user>"
#   set_action_template.sh --action-id <approval-action-id> --template-id <tmpl_…>
items:
  - id: epic_valid
    type: external
    behavior: gate
    severity: error
    title: "Jira Epic is valid"
    description: |
      Validates that deployment.metadata.jira_epic refers to a Jira Epic
      currently in In Progress / In Development. Workflow returns the
      exact Jira error verbatim when the epic is missing, invalid, or
      in an unacceptable status.
    external:
      kind: "validate-jira-epic"
      inputs:
        jira_epic: "$context.metadata.jira_epic"
      timeout_seconds: 60
      trigger: auto

  - id: tests_confirmed
    type: manual
    behavior: gate
    severity: warn
    title: "I ran tests for this change"
    description: "Confirm after running the full test suite locally or in CI."
    require_comment: false

  - id: release_passed_stage
    type: external
    behavior: gate
    severity: error
    title: "Release was deployed to a stage scope"
    description: |
      Searches the last 30 finalized deployments across scopes with
      dimensions.environment=stage for this application; fails if the
      current release id is not found.
    external:
      kind: "check-release-staged"
      inputs:
        release_id: "$context.release.id"
        application_id: "$context.application.id"
      timeout_seconds: 60
      trigger: auto
