# Checklist specification: deploy-gate (v12, Jev — one item per check)
#
# Snapshot of the LIVE specification (spec_iwlmno0e71sjaj3i, "deploy-governance-v12-jev-per-check",
# 2026-09-18), associated in production with the `deployment:create` approval action
# 490799113 on `dimensions.environment=production`.
#
# Structure:
#   - source_branch (condition gate)
#   - API checks / Frontend checks / Common checks (groups): one external item PER CHECK,
#     `kind: deploy-change-check` with `inputs.check_id`, resolved by
#     governance/deploy-change-check.yaml — Jev (TypeSafe System One) judges every changed
#     code file (up to 60 per request). Whole gate: ~15 s end to end for 15 items, <1 s of
#     Jev each, ~USD 0.01. A `gate` check fails its item when any file scores >= 0.75;
#     `informational` checks only report (⚠️ in the message).
#   - human_approvals (override group): pair / admin approval unblocks a failed gate.
#
# No LLM in the gate: the Claude functional summary and change categories run later against
# the deploy history (deploy-analysis/*). No `for_each`: one approval = one deployment, and
# `context.deployment/scope/release` resolve directly (for_each rendered a duplicate nested row).
#
# Update with the np-checklist skill:
#   update_specification.sh --id <spec_…> --definition-file ./deploy-gate.yaml
#   set_action_specification.sh --action-id 490799113 --specification-id <new spec_…>
items:
- id: source_branch
  type: condition
  query:
    $or:
    - build.branch: master
    - build.branch: main
  title: Source branch
  behavior: gate
  severity: major
  description: >
    Production deploys only from `main` or `master`. If the build comes from

    another branch, this item fails and the deploy needs an approval from the

    "Human approval" group.
- id: api_checks
  type: group
  title: API checks
  behavior: gate
  severity: major
  aggregation: all
  description: >
    Backend / API safety over the diff between the live release and the candidate. Judged by Jev (TypeSafe
    System One): one calibrated probability per changed code file, in seconds. Gates fail when any file
    scores ≥ 0.75; informational checks only report.
  children:
  - id: breaks_api_contract
    type: external
    title: Breaks the public API contract
    behavior: gate
    severity: critical
    description: >
      Removed/renamed response fields or routes, changed types or status codes, newly required params.
      Additive changes do not count.
    external:
      kind: deploy-change-check
      inputs:
        check_id: breaks_api_contract
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: changes_db_schema
    type: external
    title: Changes the database schema
    behavior: gate
    severity: major
    description: >
      Adds, drops or alters tables, columns, indexes or constraints, or adds a migration.
    external:
      kind: deploy-change-check
      inputs:
        check_id: changes_db_schema
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: irreversible_migration
    type: external
    title: Irreversible or destructive migration
    behavior: gate
    severity: critical
    description: >
      DROP / data rewrite or a migration with no rollback.
    external:
      kind: deploy-change-check
      inputs:
        check_id: irreversible_migration
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: logs_sensitive_data
    type: external
    title: Logs sensitive data
    behavior: gate
    severity: critical
    description: >
      Passwords, tokens, keys, card numbers, raw headers/bodies or personal data written to logs.
    external:
      kind: deploy-change-check
      inputs:
        check_id: logs_sensitive_data
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: hardcoded_secret
    type: external
    title: Hardcoded credential
    behavior: gate
    severity: critical
    description: >
      A literal secret in production code or config (test fixtures excluded).
    external:
      kind: deploy-change-check
      inputs:
        check_id: hardcoded_secret
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: touches_auth
    type: external
    title: Touches authentication / authorization
    behavior: informational
    severity: major
    description: >
      Login, token validation, permission checks, roles, sessions. Reported so reviewers know.
    external:
      kind: deploy-change-check
      inputs:
        check_id: touches_auth
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: new_external_call_without_timeout
    type: external
    title: New outbound call without timeout
    behavior: informational
    severity: minor
    description: >
      A new fetch/http client call with no timeout, AbortSignal or deadline.
    external:
      kind: deploy-change-check
      inputs:
        check_id: new_external_call_without_timeout
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: removes_error_handling
    type: external
    title: Removes or weakens error handling
    behavior: informational
    severity: minor
    description: >
      Deleted try/catch, swallowed errors, removed validation or status checks.
    external:
      kind: deploy-change-check
      inputs:
        check_id: removes_error_handling
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
- id: frontend_checks
  type: group
  title: Frontend checks
  behavior: gate
  severity: major
  aggregation: all
  description: "UI conventions over the diff. Each check knows the repo's facts (component library, i18n)\
    \ and answers 'no' when the convention does not apply. Judged by Jev (TypeSafe System One): one calibrated\
    \ probability per changed code file, in seconds. \n"
  children:
  - id: bypasses_component_library
    type: external
    title: Bypasses the component library
    behavior: gate
    severity: major
    description: >
      Raw HTML elements or inline styles where the repo's design-system package exports an equivalent.
    external:
      kind: deploy-change-check
      inputs:
        check_id: bypasses_component_library
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: hardcoded_user_text
    type: external
    title: User-visible text without i18n
    behavior: gate
    severity: minor
    description: >
      Literal user-visible strings in a repo that translates through i18n.
    external:
      kind: deploy-change-check
      inputs:
        check_id: hardcoded_user_text
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: accessibility_regression
    type: external
    title: Accessibility regression
    behavior: informational
    severity: minor
    description: >
      Images without alt, inputs without labels, clickable non-buttons without keyboard/role handling.
    external:
      kind: deploy-change-check
      inputs:
        check_id: accessibility_regression
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: leftover_debug_output
    type: external
    title: Leftover debug output
    behavior: informational
    severity: info
    description: >
      console.log / print / debugger or commented-out code left in production paths.
    external:
      kind: deploy-change-check
      inputs:
        check_id: leftover_debug_output
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
- id: common_checks
  type: group
  title: Common checks
  behavior: gate
  severity: major
  aggregation: all
  description: "Hygiene for any stack plus Jev's own risk level. Judged by Jev (TypeSafe System One):\
    \ one calibrated probability per changed code file, in seconds. \n"
  children:
  - id: disables_tests_or_ci
    type: external
    title: Disables tests or CI
    behavior: gate
    severity: major
    description: >
      skip/only markers, deleted tests, lowered coverage thresholds, removed lint steps.
    external:
      kind: deploy-change-check
      inputs:
        check_id: disables_tests_or_ci
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: major_dependency_bump
    type: external
    title: Major dependency bump / new runtime dependency
    behavior: informational
    severity: minor
    description: >
      A dependency crosses a major version or a new runtime dependency appears.
    external:
      kind: deploy-change-check
      inputs:
        check_id: major_dependency_bump
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
  - id: risk
    type: external
    title: Risk level (Jev)
    behavior: informational
    severity: info
    description: >
      Jev's 0–4 risk score of the worst changed code file.
    external:
      kind: deploy-change-check
      inputs:
        check_id: risk
        scope_id: '{{ context.scope.id }}'
        release_id: '{{ context.release.id }}'
        deployment_id: '{{ context.deployment.id }}'
        application_id: '{{ context.application.id }}'
      trigger: auto
      timeout_seconds: 180
    applies_when:
      scope.dimensions.environment: production
- id: human_approvals
  type: group
  title: Human approval
  behavior: override
  children:
  - id: pair_review
    type: manual
    title: Pair approval
    behavior: gate
    severity: major
    description: >
      Approval by a **peer other than the requester** when the matrix requires

      it (medium risk on critical apps, high risk on important ones).

      It is only enabled once the analysis has finished and the matrix asks

      exactly for Pair — if it has not run yet, wait for it to finish.

      The four-eyes validation rejects self-approval.
    validations:
    - id: four_eyes
      rule:
        actor.user_id:
          $ne: $approval.requested_by
      message: Someone other than the requester must approve this deploy
    require_comment: true
  - id: admin_review
    type: manual
    title: Admin approval (ops/secops)
    behavior: gate
    severity: major
    description: >
      Approval by **admin/ops/secops** — valid at any time (break-glass): for

      the cases the matrix flags as group (high risk on mission-critical apps)

      or when the analysis is not available.
    validations:
    - id: admin_role
      rule:
        actor.effective_roles:
          $in:
          - admin
          - ops
          - secops
      message: Requires admin, ops or secops role on this scope
    require_comment: true
  severity: major
  aggregation: any
  description: >
    When the matrix requires human review, ONE of these approvals unblocks the deploy. The "Change analysis
    & risk matrix" item says which one applies for the detected risk.
