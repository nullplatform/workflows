# Checklist specification: deploy-gate (v11, Jev-only)
#
# Snapshot of the LIVE specification (spec_tlkh8gn2r89k4bck, "deploy-governance-v11-jev-only",
# 2026-09-18), associated in production with the `deployment:create` approval action
# 490799113 on `dimensions.environment=production`.
#
# Structure:
#   - source_branch (condition gate)
#   - api_checks / frontend_checks / common_checks (external gates, `kind: deploy-change-check`):
#     resolved by governance/deploy-change-check.yaml — Jev (TypeSafe System One) judges every
#     changed code file, several files per request, all in parallel. Whole gate: ~10 s end to
#     end, ~1 s of it is Jev, well under a cent. Each item fails only when a GATE check scores
#     >= 0.75 on some file; informational checks are reported in the same message.
#   - human_approvals (override group): pair / admin approval unblocks a failed gate.
#
# No LLM in the gate: the Claude functional summary and change categories run later against
# the deploy history (deploy-analysis/*), not as approval items.
#
# External items on the NP dispatch path declare ONLY `kind` + `inputs` + `timeout_seconds` +
# `trigger`; routing is the notification_channel the workflow's `np-checklist-trigger`
# registers on alias activation. `external.inputs` keep the `context.` root. Update with the
# np-checklist skill:
#   update_specification.sh --id <spec_…> --definition-file ./deploy-gate.yaml
#   set_action_specification.sh --action-id 490799113 --specification-id <new spec_…>
items:
- id: source_branch
  type: condition
  query:
    $or:
    - build.branch: master
    - build.branch: main
  title: Source branch
  behavior: gate
  severity: major
  description: >
    Production deploys only from `main` or `master`. If the build comes from

    another branch, this item fails and the deploy needs an approval from the

    "Human approval" group.
- id: api_checks
  type: external
  title: API checks (Jev)
  behavior: gate
  severity: critical
  description: >
    Gates: breaks the public API contract, changes the DB schema, irreversible migration, logs sensitive
    data, hardcoded credential. Informational: touches auth, new outbound call without timeout, removes
    error handling. Judged by Jev (TypeSafe System One): one calibrated probability per changed code file,
    several files per request, all in parallel — seconds, not minutes. Fails only when a GATE check scores
    ≥ 0.75 on some file; docs/tests/config never gate. Per-check verdicts, files and probabilities in
    the message and details.
  external:
    kind: deploy-change-check
    inputs:
      check_group: api
      scope_id: '{{ context.scope.id }}'
      release_id: '{{ context.release.id }}'
      deployment_id: '{{ context.deployment.id }}'
      application_id: '{{ context.application.id }}'
    trigger: auto
    timeout_seconds: 180
  for_each: deployments
  applies_when:
    scope.dimensions.environment: production
- id: frontend_checks
  type: external
  title: Frontend checks (Jev)
  behavior: gate
  severity: major
  description: >
    Gates: bypasses the component library, user-visible text without i18n (both answer 'no' when the repo
    has no design system / no i18n). Informational: accessibility regression, leftover debug output. Judged
    by Jev (TypeSafe System One): one calibrated probability per changed code file, several files per
    request, all in parallel — seconds, not minutes. Fails only when a GATE check scores ≥ 0.75 on some
    file; docs/tests/config never gate. Per-check verdicts, files and probabilities in the message and
    details.
  external:
    kind: deploy-change-check
    inputs:
      check_group: frontend
      scope_id: '{{ context.scope.id }}'
      release_id: '{{ context.release.id }}'
      deployment_id: '{{ context.deployment.id }}'
      application_id: '{{ context.application.id }}'
    trigger: auto
    timeout_seconds: 180
  for_each: deployments
  applies_when:
    scope.dimensions.environment: production
- id: common_checks
  type: external
  title: Common checks (Jev)
  behavior: gate
  severity: major
  description: >
    Gate: disables tests or CI. Informational: major dependency bump / new runtime dependency, Jev risk
    level (0–4) of the worst code file. Judged by Jev (TypeSafe System One): one calibrated probability
    per changed code file, several files per request, all in parallel — seconds, not minutes. Fails only
    when a GATE check scores ≥ 0.75 on some file; docs/tests/config never gate. Per-check verdicts, files
    and probabilities in the message and details.
  external:
    kind: deploy-change-check
    inputs:
      check_group: common
      scope_id: '{{ context.scope.id }}'
      release_id: '{{ context.release.id }}'
      deployment_id: '{{ context.deployment.id }}'
      application_id: '{{ context.application.id }}'
    trigger: auto
    timeout_seconds: 180
  for_each: deployments
  applies_when:
    scope.dimensions.environment: production
- id: human_approvals
  type: group
  title: Human approval
  behavior: override
  children:
  - id: pair_review
    type: manual
    title: Pair approval
    behavior: gate
    severity: major
    description: >
      Approval by a **peer other than the requester** when the matrix requires

      it (medium risk on critical apps, high risk on important ones).

      It is only enabled once the analysis has finished and the matrix asks

      exactly for Pair — if it has not run yet, wait for it to finish.

      The four-eyes validation rejects self-approval.
    validations:
    - id: four_eyes
      rule:
        actor.user_id:
          $ne: $approval.requested_by
      message: Someone other than the requester must approve this deploy
    require_comment: true
  - id: admin_review
    type: manual
    title: Admin approval (ops/secops)
    behavior: gate
    severity: major
    description: >
      Approval by **admin/ops/secops** — valid at any time (break-glass): for

      the cases the matrix flags as group (high risk on mission-critical apps)

      or when the analysis is not available.
    validations:
    - id: admin_role
      rule:
        actor.effective_roles:
          $in:
          - admin
          - ops
          - secops
      message: Requires admin, ops or secops role on this scope
    require_comment: true
  severity: major
  aggregation: any
  description: >
    When the matrix requires human review, ONE of these approvals unblocks the deploy. The "Change analysis
    & risk matrix" item says which one applies for the detected risk.
