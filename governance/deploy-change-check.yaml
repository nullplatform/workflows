# Deploy Change Check — deploy-gate checks judged by Jev (TypeSafe System One).
#
# Pairs with checklist external items of `kind: deploy-change-check`. One item per
# CHECK GROUP (`check_group`: api | frontend | common); each dispatch spawns one
# execution:
#   gather   diff previous-deployed → candidate WITH patches + repo facts, and the
#            group's typed questions, in BATCHES of files (one Jev request judges
#            several files: question `<check>__<i>` reads `files[i].diff`)
#   → jev    jev-system-one, one request per batch, all batches in parallel
#   → aggregate  per check: max probability over CODE files, evidence ≥ high,
#            grey band; the item fails only on `gate` checks
#   → resolve    passed / failed + per-check verdicts in message and details.
#
# Speed is the point: no heartbeats, no LLM. Jev itself answers in well under a
# second per request; what remains is the engine's per-activity cost, so the
# graph is four activities plus ceil(files / batch) parallel Jev calls.
# Docs/tests/config never gate. Informational work (functional summary, change
# categories) is NOT here — it runs later against the deploy history.
#
# Config entries (folder /checklist/deploy): secrets NP_API_KEY (folder),
# GITHUB_TOKEN (root). Jev's credential is platform-provided (TYPESAFE_API_KEY on
# the worker), never configured here.
#
# NOTE: excluded from `npm run validate` until @nullplatform/workflow-kit ships the
# `jev-system-one` plugin (kit ^0.1.0 predates it); the live engine validated this
# definition on publish. Re-include it in package.json when the kit is bumped.
id: deploy_change_check
key: deploy-change-check
name: "Deploy Change Check (Jev)"
path: /checklist/deploy
semantic_version: 2.0.0
description: >
  Resolves one deploy-gate check group (API / Frontend / Common) over the diff
  between the previously deployed release and the candidate. Jev judges every
  changed code file, several files per request, all requests in parallel; the
  item fails with the files and probabilities that tripped a gate check.

inputs:
  triggerPayload:
    type: object
    default: {}

variables:
  # Jev repeats the same diff within about ±0.02; 0.75 keeps a margin above that
  # jitter so a gate never flaps on identical input. The grey band (low..high) is
  # reported in the details for reviewers.
  threshold_low:
    initialValue: 0.3
  threshold_high:
    initialValue: 0.75
  max_patch_chars:
    initialValue: 6000
  max_total_chars:
    initialValue: 600000
  # Questions per Jev request stay ≤ 60 (plugin cap 64): batch = floor(60 / group questions).
  max_questions_per_request:
    initialValue: 60

steps:
  - id: trigger
    type: trigger
    plugin_type: np-checklist-trigger
    name: "On checklist dispatch (deploy-change-check)"
    config:
      pathPrefix: /checklist/deploy/change-check
      mode: start
      kind: deploy-change-check
      nrn: "organization=4"
      npApiKey: "${{ secrets.NP_API_KEY }}"

  - id: gather
    type: module
    plugin_type: code-exec
    name: "Gather diff + repo facts, build Jev batches"
    inputs:
      scope_id:       "${{ steps.trigger.outputs.inputs.scope_id }}"
      release_id:     "${{ steps.trigger.outputs.inputs.release_id }}"
      deployment_id:  "${{ steps.trigger.outputs.inputs.deployment_id }}"
      application_id: "${{ steps.trigger.outputs.inputs.application_id }}"
      check_group:    "${{ steps.trigger.outputs.inputs.check_group }}"
      np_api_key:     "${{ secrets.NP_API_KEY }}"
      github_token:   "${{ secrets.GITHUB_TOKEN }}"
      max_patch_chars: "${{ variables.max_patch_chars }}"
      max_total_chars: "${{ variables.max_total_chars }}"
      max_questions_per_request: "${{ variables.max_questions_per_request }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com", "api.github.com"]
      code: |
        const { application_id, release_id, scope_id, np_api_key, github_token } = $item;
        const group = String($item.check_group || "api");
        const MAX_PATCH = Number($item.max_patch_chars) || 6000;
        const MAX_TOTAL = Number($item.max_total_chars) || 600000;
        const MAX_Q = Number($item.max_questions_per_request) || 60;

        // ---------- clients ----------
        const tokRes = await fetch("https://api.nullplatform.com/token", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ api_key: np_api_key }) });
        if (!tokRes.ok) throw new Error(`NP token exchange failed: ${tokRes.status}`);
        const npToken = (await tokRes.json()).access_token;
        const np = async (path) => { const r = await fetch(`https://api.nullplatform.com${path}`, { headers: { authorization: `Bearer ${npToken}` } }); if (!r.ok) throw new Error(`NP GET ${path} → ${r.status}`); return r.json(); };
        const gh = async (path, accept) => {
          const r = await fetch(`https://api.github.com${path}`, { headers: { authorization: `Bearer ${github_token}`, accept: accept || "application/vnd.github+json", "user-agent": "nullplatform-workflows/deploy-change-check" } });
          if (r.status === 404 && accept) return null;
          if (!r.ok) throw new Error(`GitHub ${path} → ${r.status}`);
          return accept ? r.text() : r.json();
        };
        const releaseInfo = async (id) => { const rel = await np(`/release/${id}`); const build = await np(`/build/${rel.build_id}`); return { id: rel.id, semver: rel.semver, commit_sha: build.commit && build.commit.id }; };

        // ---------- phase 1 (parallel): candidate, deployments, application, criticality ----------
        // `sort=created_at:desc` is essential: without it the API returns an arbitrary old page.
        const [to, deps, app, meta] = await Promise.all([
          releaseInfo(release_id),
          np(`/deployment?scope_id=${scope_id}&limit=30&sort=created_at:desc`),
          np(`/application/${application_id}`),
          np(`/metadata/application/${application_id}`).catch(() => ({})),
        ]);
        const finalized = (deps.results || []).filter(d => ["finalized", "active"].includes(d.status)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        const previously_deployed = finalized.slice(0, 10).some(d => String(d.release_id) === String(release_id));
        const current = finalized.find(d => String(d.release_id) !== String(release_id));
        const repo = (app.repository_url || "").replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "");
        if (!repo) throw new Error(`application ${application_id} has no repository_url`);
        const criticality = (meta.governance && meta.governance.criticality) ? String(meta.governance.criticality) : "critical";

        // ---------- phase 2 (parallel): previous release, package.json at the candidate ----------
        const [from, pkgRaw] = await Promise.all([
          current ? releaseInfo(current.release_id) : Promise.resolve(null),
          gh(`/repos/${repo}/contents/package.json?ref=${to.commit_sha}`, "application/vnd.github.raw+json").catch(() => null),
        ]);
        let pkg = {}; try { if (pkgRaw) pkg = JSON.parse(pkgRaw); } catch (e) { pkg = {}; }
        const deps_ = Object.keys({ ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) });
        const dep = (re) => deps_.find(d => re.test(d)) || null;
        const repo_facts = {
          package_name: pkg.name || null,
          design_system_package: dep(/design-system|ui-kit|@nullplatform\/ui|@mui\/material|^antd$|@chakra-ui\/react|@mantine\/core|@radix-ui\//),
          uses_i18n: !!dep(/i18n|react-intl|@lingui|formatjs/),
          logging_library: dep(/^(pino|winston|bunyan|log4js|loglevel)$/),
          http_client_library: dep(/^(axios|undici|got|node-fetch|ky)$/),
          frontend_framework: dep(/^(react|vue|@angular\/core|svelte|next)$/),
          backend_framework: dep(/^(fastify|express|koa|@nestjs\/core|hapi)$/),
        };
        const stack = repo_facts.backend_framework && repo_facts.frontend_framework ? "fullstack" : repo_facts.backend_framework ? "node-api" : repo_facts.frontend_framework ? "frontend" : "unknown";

        // ---------- phase 3: compare with patches, one entry per changed file ----------
        const SKIP = /(^|\/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|go\.sum|Cargo\.lock|poetry\.lock)$|\.(min\.js|min\.css|map|snap|svg|png|jpg|jpeg|gif|ico|woff2?|pdf)$|(^|\/)(dist|build|node_modules|vendor)\//i;
        const kindOf = (f) => /\.(md|mdx|rst|txt)$/i.test(f) ? "docs" : /(^|\/)(__tests__|tests?|spec|e2e)\/|\.(test|spec)\.[a-z]+$/i.test(f) ? "test" : /\.(ya?ml|json|toml|ini|env(\..*)?)$|(^|\/)Dockerfile$/i.test(f) ? "config" : "code";
        // The change under judgment is ALWAYS live release → candidate, even when the
        // candidate was deployed here before (a re-deploy of an old release changes
        // production just the same). Only an identical commit has nothing to judge.
        let files = [], skipped = [], total_files = 0, rollback = false;
        if (from && from.commit_sha && to.commit_sha && from.commit_sha !== to.commit_sha) {
          let cmp = await gh(`/repos/${repo}/compare/${from.commit_sha}...${to.commit_sha}`);
          // GitHub compare is directional: deploying an OLDER commit yields status
          // 'behind' and no files. That is a rollback — judge the changes being
          // reverted (the reverse diff) and say so.
          if ((cmp.files || []).length === 0 && cmp.status === "behind") {
            cmp = await gh(`/repos/${repo}/compare/${to.commit_sha}...${from.commit_sha}`);
            rollback = true;
          }
          const all = cmp.files || []; total_files = all.length;
          let budget = 0;
          for (const f of all) {
            if (SKIP.test(f.filename) || !f.patch) { skipped.push(f.filename); continue; }
            if (budget > MAX_TOTAL) { skipped.push(f.filename); continue; }
            const patch = f.patch.length > MAX_PATCH ? f.patch.slice(0, MAX_PATCH) + `\n… [truncated ${f.patch.length - MAX_PATCH} chars]` : f.patch;
            budget += patch.length;
            files.push({ path: f.filename, kind: kindOf(f.filename), status: f.status, additions: f.additions, deletions: f.deletions, is_route_or_handler_file: /(^|\/)(routes?|controllers?|handlers?|api|endpoints?)\//i.test(f.filename), diff: patch });
          }
        }
        // Only code files are judged (docs/tests/config never gate) — fewer Jev requests, no noise.
        const codeFiles = files.filter(f => f.kind === "code");
        const nonCode = files.length - codeFiles.length;

        // ---------- the catalogue ----------
        const N = (question, tru, fal, focus) => ({ type: "noul", instructions: focus ? { question, focus } : question, ...(tru || fal ? { criteria: { ...(tru ? { true: tru } : {}), ...(fal ? { false: fal } : {}) } } : {}) });
        const F = "`files[I]`";
        const CHECKS = {
          api: {
            title: "API checks",
            checks: {
              breaks_api_contract: { title: "Breaks the public API contract", behavior: "gate", q: () => N(`Does the change in ${F}.diff break the public HTTP API contract for existing clients?`, "An existing API consumer that worked before would receive a different shape, a different path, or an error.", `Only additive or internal changes; existing consumers keep working unchanged, or ${F}.diff has no API surface.`, `Removed or renamed response fields, changed URL paths, changed status codes, removed or renamed request parameters, changed field types, or a newly REQUIRED header/parameter. Additive changes (new optional field, new route) do NOT count. ${F}.is_route_or_handler_file says whether this file is API surface.`) },
              changes_db_schema: { title: "Changes the database schema", behavior: "gate", q: () => N(`Does the change in ${F}.diff modify a DATABASE schema (SQL tables, columns, indexes, constraints, ORM models) or add a database migration? API schemas, JSON schemas, config schemas and catalog specifications are NOT database schema.`, "Adds, drops or alters database tables, columns, indexes or constraints, or adds/edits a database migration file.", "No database schema or migration change; JSON/API/config schema edits, or reads and writes to existing columns, do not count.") },
              irreversible_migration: { title: "Irreversible or destructive migration", behavior: "gate", q: () => N(`Assuming ${F}.diff contains a database migration, is it irreversible or destructive? If it has no migration, answer no.`, "The migration drops or rewrites existing data, or cannot be rolled back.", "The migration is additive with a rollback, or there is no migration.") },
              logs_sensitive_data: { title: "Logs sensitive data", behavior: "gate", q: () => N(`Does the change in ${F}.diff write sensitive data to logs?`, "A new or changed logging call includes a secret, credential, card number, raw headers/body or personal data.", "Logging only includes non-sensitive identifiers (ids, counts, statuses), or there is no new logging.", "Passwords, tokens, API keys, session ids, card numbers, full request headers or bodies that can carry credentials, personal identifiers such as emails or document numbers. Logging goes through `repo_facts.logging_library` when set, or console/print otherwise.") },
              hardcoded_secret: { title: "Hardcoded credential", behavior: "gate", q: () => N(`Does the change in ${F}.diff add a hardcoded credential (API key, password, token, private key) as a literal in production code or config?`, "A literal secret value appears in the added lines.", "Secrets come from env, config entries or a secret store, or no secret is involved.") },
              touches_auth: { title: "Touches authentication / authorization", behavior: "informational", q: () => N(`Does the change in ${F}.diff modify authentication or authorization logic (login, token validation, permission checks, roles, session handling)?`) },
              new_external_call_without_timeout: { title: "New outbound call without timeout", behavior: "informational", q: () => N(`Does the change in ${F}.diff add a new outbound HTTP or network call that has no timeout or abort handling?`, "A new fetch/axios/http/client call is added and no timeout, AbortSignal or deadline is set for it.", "Any new outbound call sets a timeout or uses a shared client that owns timeouts, or no outbound call is added.") },
              removes_error_handling: { title: "Removes or weakens error handling", behavior: "informational", q: () => N(`Does the change in ${F}.diff remove or weaken error handling (deleted try/catch, swallowed errors, removed validation, removed status checks)?`) },
            },
          },
          frontend: {
            title: "Frontend checks",
            checks: {
              bypasses_component_library: { title: "Bypasses the component library", behavior: "gate", q: () => N(`Does the change in ${F}.diff render UI with raw HTML elements or inline styles instead of the repo's component library \`repo_facts.design_system_package\`?`, "The repo has a component library and this UI is built from raw elements or inline styles instead.", "UI uses the component library, the repo has no component library (`repo_facts.design_system_package` is null), or the file has no UI markup.", "Only applies when `repo_facts.design_system_package` is not null. If it is null the repo has no component library and the answer is no.") },
              hardcoded_user_text: { title: "User-visible text without i18n", behavior: "gate", q: () => N(`Does the change in ${F}.diff add user-visible text (labels, placeholders, button text, messages) as a literal string instead of a translation lookup?`, "The repo uses i18n and a user-visible string literal is added without t()/i18n, or a translation call is replaced by a literal.", "Strings go through the translation function, the repo has no i18n (`repo_facts.uses_i18n` is false), or there is no UI text.", "Only applies when `repo_facts.uses_i18n` is true. If it is false the repo does not translate and the answer is no.") },
              accessibility_regression: { title: "Accessibility regression", behavior: "informational", q: () => N(`Does the change in ${F}.diff add UI that is missing basic accessibility: images without alt text, form inputs without labels, clickable non-button elements without keyboard/role handling?`) },
              leftover_debug_output: { title: "Leftover debug output", behavior: "informational", q: () => N(`Does the change in ${F}.diff leave debugging output in production code paths (console.log/print/debugger statements, commented-out blocks of code)? Deliberate structured logging through \`repo_facts.logging_library\` does not count.`) },
            },
          },
          common: {
            title: "Common checks",
            checks: {
              disables_tests_or_ci: { title: "Disables tests or CI", behavior: "gate", q: () => N(`Does the change in ${F}.diff disable, skip or delete tests, or weaken CI checks (skip/xit/only markers, removed test files, lowered coverage thresholds, removed lint steps)?`) },
              major_dependency_bump: { title: "Major dependency bump / new runtime dependency", behavior: "informational", q: () => N(`Does the change in ${F}.diff bump a dependency across a major version or add a new runtime dependency?`) },
              risk: { title: "Risk level (Jev)", behavior: "informational", q: () => ({ type: "score", instructions: { question: `How risky is deploying the change in ${F}.diff to production for an application of criticality \`deployment.criticality\`?`, note: "Judge blast radius and reversibility, not code style." }, criteria: [ { summary: "Negligible", signals: ["Pure refactor, formatting, comments, docs or tests only"] }, { summary: "Low", signals: ["Additive change, easily reverted, no data or contract impact"] }, { summary: "Moderate", signals: ["Behaviour change in a code path users depend on", "New logging, config or dependency"] }, { summary: "High", signals: ["Breaking API change", "Schema migration", "Auth or payment logic"] }, { summary: "Critical", signals: ["Irreversible data change", "Security exposure such as leaked credentials"] } ] }) },
            },
          },
        };
        const g = CHECKS[group];
        if (!g) throw new Error(`unknown check_group '${group}' — known: ${Object.keys(CHECKS).join(", ")}`);
        const checkIds = Object.keys(g.checks);

        // ---------- batches: several files per Jev request, one question per (check, file) ----------
        const batchSize = Math.max(1, Math.floor(MAX_Q / checkIds.length));
        const batches = [];
        for (let i = 0; i < codeFiles.length; i += batchSize) {
          const slice = codeFiles.slice(i, i + batchSize);
          // Pad the last batch so every request shares ONE static question set.
          while (slice.length < batchSize && codeFiles.length > 0) slice.push({ path: "(padding)", kind: "padding", diff: "(no file — ignore)" });
          batches.push({ index: batches.length, files: slice });
        }
        const questions = {};
        for (let i = 0; i < (batches.length ? batchSize : 0); i++) for (const cid of checkIds) questions[`${cid}__${i}`] = JSON.parse(JSON.stringify(g.checks[cid].q()).split("`files[I]`").join(`\`files[${i}]\``));
        const checks = Object.fromEntries(checkIds.map(cid => [cid, { title: g.checks[cid].title, behavior: g.checks[cid].behavior }]));

        return {
          group, group_title: g.title, checks, batch_size: batchSize, batch_count: batches.length, batches, questions,
          repo, criticality, stack, repo_facts,
          from_release: from ? { id: from.id, semver: from.semver, commit_sha: from.commit_sha } : null,
          to_release: { id: to.id, semver: to.semver, commit_sha: to.commit_sha },
          previously_deployed, rollback, total_files, files_count: files.length, code_files: codeFiles.length, non_code_files: nonCode, skipped_count: skipped.length,
        };
    error_handling:
      fallback_step: resolve_failure

  - id: jev
    type: module
    plugin_type: jev-system-one
    name: "Jev: one request per batch of files"
    forEach:
      expression: "${{ steps.gather.outputs.batches }}"
      itemVariable: batch
      parallel: true
      maxConcurrency: 12
    inputs:
      files: "${{ batch.files }}"
      repo_facts: "${{ steps.gather.outputs.repo_facts }}"
      deployment:
        environment: production
        criticality: "${{ steps.gather.outputs.criticality }}"
        stack: "${{ steps.gather.outputs.stack }}"
    config:
      questions: "${{ steps.gather.outputs.questions }}"
      maxStateChars: 120000
    error_handling:
      fallback_step: resolve_failure

  - id: aggregate
    type: module
    plugin_type: code-exec
    name: "Aggregate: per-check verdicts"
    inputs:
      results: "${{ steps.jev.outputs.items }}"
      gathered: "${{ steps.gather.outputs }}"
      low: "${{ variables.threshold_low }}"
      high: "${{ variables.threshold_high }}"
    config:
      code: |
        const { results = [], gathered = {} } = $item;
        const low = Number($item.low), high = Number($item.high);
        const checks = gathered.checks || {};
        const per = Object.fromEntries(Object.keys(checks).map(c => [c, { ...checks[c], max: 0, evidence: [], grey: [] }]));
        let tokens = 0, latency = 0, model = null, requests = 0;
        let riskMax = 0, riskFile = null;
        results.forEach((r, bi) => {
          const batch = (gathered.batches || [])[bi] || { files: [] };
          const s = (r && r.summary) || {}; const u = (r && r.usage) || {};
          tokens += Number(u.input_tokens || 0); latency += Number(r && r.latency_ms || 0); model = (r && r.model) || model; requests++;
          for (const [qid, v] of Object.entries(s)) {
            const m = qid.match(/^(.*)__(\d+)$/); if (!m) continue;
            const cid = m[1], f = batch.files[Number(m[2])];
            if (!f || f.kind === "padding" || !per[cid]) continue;
            if (cid === "risk") { if (Number(v) > riskMax) { riskMax = Number(v); riskFile = f.path; } continue; }
            const p = Number(v); if (!Number.isFinite(p)) continue;
            if (p > per[cid].max) per[cid].max = p;
            if (p >= high) per[cid].evidence.push({ file: f.path, p: +p.toFixed(2) }); else if (p >= low) per[cid].grey.push({ file: f.path, p: +p.toFixed(2) });
          }
        });
        const short = (f) => f.split("/").pop();
        const lines = [];
        let failedGates = 0;
        for (const [cid, c] of Object.entries(per)) {
          if (cid === "risk") { const LEVELS = ["Negligible", "Low", "Moderate", "High", "Critical"]; lines.push(`ℹ️ ${c.title}: **${LEVELS[Math.round(riskMax)] || "n/a"}** (${riskMax.toFixed(2)}${riskFile ? `, ${short(riskFile)}` : ""})`); continue; }
          const tag = c.behavior === "gate" ? (c.evidence.length ? "❌" : "✅") : (c.evidence.length ? "⚠️" : "ℹ️");
          if (c.behavior === "gate" && c.evidence.length) failedGates++;
          const ev = c.evidence.length ? ` — ${c.evidence.slice(0, 3).map(e => `${short(e.file)} ${e.p}`).join(", ")}${c.evidence.length > 3 ? ", …" : ""}` : c.grey.length ? ` — grey: ${c.grey.slice(0, 2).map(e => `${short(e.file)} ${e.p}`).join(", ")}` : "";
          lines.push(`${tag} ${c.title}: max ${c.max.toFixed(2)}${ev}`);
        }
        const from = gathered.from_release ? gathered.from_release.semver : "first deploy", to = gathered.to_release ? gathered.to_release.semver : "?";
        const cost = +(tokens / 1e6 * 0.042).toFixed(5);
        const rb = gathered.rollback ? " ⏪ rollback: judging the changes being reverted" : "";
        const head = gathered.code_files === 0
          ? (!gathered.from_release || (gathered.from_release.commit_sha === gathered.to_release.commit_sha) ? `✅ **${gathered.group_title}** — candidate is the commit already live on this scope (${from} → ${to}); nothing to judge.` : `✅ **${gathered.group_title}** — no code files changed between ${from} and ${to} (${gathered.non_code_files || 0} docs/tests/config files not judged).`)
          : `${failedGates ? "❌" : "✅"} **${gathered.group_title}** — ${from} → ${to}${rb}, ${gathered.code_files} code file(s) in ${requests} Jev request(s), ${(latency / 1000).toFixed(1)} s of Jev, $${cost}.`;
        const status = failedGates ? "failed" : "passed";
        return { status, message: gathered.code_files === 0 ? head : `${head}\n\n${lines.join("\n")}`, details: {
          group: gathered.group, checks: per, risk: { max: +riskMax.toFixed(2), file: riskFile }, thresholds: { low, high },
          from_release: gathered.from_release, to_release: gathered.to_release, previously_deployed: gathered.previously_deployed, rollback: gathered.rollback,
          code_files: gathered.code_files, files_count: gathered.files_count, total_files: gathered.total_files, skipped_count: gathered.skipped_count, batch_size: gathered.batch_size, requests,
          repo_facts: gathered.repo_facts, jev_model: model, input_tokens: tokens, est_cost_usd: cost, jev_latency_ms: latency,
        } };

  - id: resolve
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve checklist item"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        "${{ steps.aggregate.outputs.status }}"
      message:       "${{ steps.aggregate.outputs.message }}"
      details:       "${{ steps.aggregate.outputs.details }}"

  # Reached only via `error_handling.fallback_step` of gather / jev. A check
  # group that could not run resolves FAILED loudly — never as a silent pass.
  - id: resolve_failure
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve checklist item (checks could not run)"
    join_strategy: any
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        failed
      message:       "⚠️ Check group `${{ steps.trigger.outputs.inputs.check_group }}` could not run: ${{ steps.gather.error.message }}${{ steps.jev.error.message }}"
      details:
        check_group:    "${{ steps.trigger.outputs.inputs.check_group }}"
        release_id:     "${{ steps.trigger.outputs.inputs.release_id }}"
        application_id: "${{ steps.trigger.outputs.inputs.application_id }}"
        gather_error:   "${{ steps.gather.error.message }}"
        jev_error:      "${{ steps.jev.error.message }}"
        jev_error_code: "${{ steps.jev.error.code }}"

connections:
  - { id: c1, from: trigger,   to: gather }
  - { id: c2, from: gather,    to: jev }
  - { id: c3, from: jev,       to: aggregate }
  - { id: c4, from: aggregate, to: resolve }
  - { id: f1, from: gather,    to: resolve_failure, condition: "false" }
  - { id: f2, from: jev,       to: resolve_failure, condition: "false" }

outputs:
  check_group:      "${{ steps.trigger.outputs.inputs.check_group }}"
  resolved_status:  "${{ steps.aggregate.outputs.status }}"
  resolved_message: "${{ steps.aggregate.outputs.message }}"
  callback_ok:      "${{ steps.resolve.outputs.ok }}"
