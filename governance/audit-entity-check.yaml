# Audit Coverage — entity configuration checklist item resolver.
#
# Pairs with checklist external items of `kind: audit-entity-check`. ONE item
# per deploy: it reads the code about to ship and the audit-enhancer's
# configuration, and reports whether the entities this application writes are
# wired into the HTTP audit pipeline (producer → audit-enhancer →
# customers_lake).
#
# PREVENTIVE AND STATIC, ON PURPOSE. The gate reads source — this repository at
# the commit being deployed, plus the enhancer's config in its own repo — and
# calls nothing else. It does not query the lake and it does not probe any API.
# That is a deliberate narrowing, and the reasoning matters for anyone tempted
# to add a runtime signal back:
#   - Runtime health (`degraded` enrichment, `dropped` events, DLQ depth) is
#     already covered by the pipeline's own Datadog monitors, which watch it
#     continuously and org-wide. A per-deploy gate re-reading the same data adds
#     no coverage and reports it at the wrong moment, against the wrong owner.
#   - Lake signals cannot be attributed to the deploy that gates on them. The
#     `application` column is the CALLER of the audited request, not the service
#     that produced the event, so for a producer API it points the wrong way;
#     and the chronic degraded entities of the whole organization would land on
#     every application's item as findings that are not theirs.
#   - A pre-deploy probe of a NEW entity proves nothing: there is no traffic yet
#     and the read endpoint is not deployed, so a 404 is the expected answer and
#     says nothing about the configuration.
# What genuinely cannot be verified before the deploy — the enhancer's read
# grant, and what the first real write will do — is reported as unverified, and
# picked up on the NEXT deploy through the checkpoint: by then the entity has
# traffic and the monitors have had their say.
#
# An entity is "correctly configured" when three sides agree:
#   A. the producer emits the audit event (framework-dependent: server-audit
#      on Fastify is opt-in per route; np-api-js on Express is opt-out; the
#      service-api and workflow-api derive names with hand-rolled rules),
#   B. the enhancer handles the entity name (entityConfig in its app.js:
#      STANDARD / SELF_CONTAINED / NRN, plus clients map for non-default hosts),
#   C. the enhancer's service account can read the entity (platform grant).
# A and B are decidable from source. C is not, pre-deploy, and the report says
# so instead of guessing.
#
# The deterministic half (`enhancer_config`) reads the enhancer repo: the
# entityConfig and clients maps out of `audit-ennhancer/app.js`. Both are
# properties of a constructor call, most entityConfig keys are computed
# (`[ENTITIES.USER]:`) or arrive through `...selfContained(…)`, so the ENTITIES
# map in `audit_enhancer.js` is read too, and the key set is only used when
# every key position resolved. Each entry is classified by the mechanism it
# wires up — only a STANDARD entry makes the enhancer fetch the entity — which
# is what tells the agent whether an entity has to be echoed by the write
# instead. A source that cannot be read is reported as `unverified`: published on
# the item, never fatal, and never a finding.
#
# The LLM covers what static config cannot: write routes that produce NO audit
# event (the evidence is an absence), the entity name each route will emit under
# its framework's derivation rule, and whether a SELF_CONTAINED entity is really
# echoed back by the write that produces it.
#
# The snapshot it reads is budgeted, so on a large repository it can be partial —
# and one of its two checks reasons from an ABSENCE, which a partial snapshot
# manufactures for free. `gather` therefore measures its own coverage while it
# packs: every audit-relevant file the budget did not reach, and every one it had
# to clip. That list is handed to the agent (whose instruction is to mark the
# affected entities `unverified`) and published on the item as `coverage`, so a
# pass over 60% of the routes never reads like a pass over all of them. It is
# declared, not enforced: the gate stays best-effort and coverage never flips the
# verdict.
#
# Incremental strategy (same as arch-rule-check): past checklist runs are the
# checkpoint store. The verdict has TWO inputs, so a checkpoint is only reusable
# while both are unchanged: the code diff must carry no audit-relevant changes,
# AND the enhancer configuration must fingerprint the same as when that verdict
# was produced — otherwise a change in the enhancer's repo would never re-evaluate
# any application until it happened to touch its own code. Fail open towards FULL
# analysis, never towards skipping.
id: audit-entity-check
key: audit-entity-check
name: "Audit Coverage — Entity Config Check"
description: >
  Static, preventive check that the entities written by this application are
  configured for the HTTP audit pipeline: the write produces an audit event, and
  the audit-enhancer handles the entity name (fetching it, or relying on the
  write to echo it). Reads this repository and the enhancer's configuration —
  no lake queries, no live probes; runtime health is covered by the pipeline's
  monitors. One execution per checklist item (kind: audit-entity-check).
semantic_version: 1.0.0
path: "/checklist/audit"

inputs:
  triggerPayload:
    type: object
    default: {}

steps:
  - id: trigger
    type: trigger
    plugin_type: np-checklist-trigger
    name: "On checklist dispatch (audit-entity-check)"
    config:
      pathPrefix: /np/checklist/audit-entity-check
      mode: start
      kind: audit-entity-check
      # Literal NRN: the hosted engine does NOT resolve ${{ vars.* }} in
      # trigger config at activation time — an expression here reaches the
      # notifications API verbatim and fails channel creation with an
      # unexplained 403. Change this value when publishing to another org, and
      # keep it in sync with the NP_ORGANIZATION_ID config entry the rest of
      # the governance suite registers under.
      nrn: "organization=1255165411"

  - id: progress
    type: module
    plugin_type: np-checklist-item-progress
    name: "Heartbeat: reading the enhancer configuration"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      message:       "Reading the audit-enhancer entity configuration…"

  - id: enhancer_config
    type: module
    plugin_type: code-exec
    name: "Enhancer entity configuration (side B)"
    inputs:
      github_token:  "${{ secrets.GITHUB_TOKEN }}"
      enhancer_repo: "nullplatform/data-audit-stream-enhancer"
    config:
      network:
        allowedHosts: ["api.github.com"]
      code: |
        const { github_token, enhancer_repo } = $item;

        // Sources this step could not read. Published on the item so the report
        // says what it could not check, never fatal and never a finding.
        const unverified = [];
        // A config entry that does not exist is absent from $item altogether,
        // so an unset secret would otherwise reach fetch() as "undefined".
        const isSet = (v) => typeof v === "string" && v.trim().length > 0;

        // Marks every offset of `src` that is real code. Everything inside a
        // comment or inside a string literal is not — the delimiters themselves
        // still are, so a quoted property key can anchor while a string that
        // merely mentions the map cannot.
        const codeOffsets = (src) => {
          const isCode = new Array(src.length).fill(true);
          for (let i = 0; i < src.length; i++) {
            const c = src[i], next = src[i + 1];
            if (c === "/" && next === "/") {
              while (i < src.length && src[i] !== "\n") { isCode[i] = false; i++; }
              continue;
            }
            if (c === "/" && next === "*") {
              const close = src.indexOf("*/", i + 2);
              const stop = close < 0 ? src.length : close + 2;
              while (i < stop) { isCode[i] = false; i++; }
              i--; continue;
            }
            if (c === '"' || c === "'" || c === "`") {
              // Only a template literal may span lines, so a quote with no
              // partner on its own line is not opening a string — it is a
              // character inside something else, typically a regex like
              // /['"]/. Treating it as a string would blank out the rest of
              // the file and lose the anchor. A regex is still not modelled:
              // one holding a quote that DOES have a partner on the same line
              // masks the span between them, which can only cost the anchor
              // (an unfound anchor degrades the source, it never invents one).
              let j = i + 1;
              while (j < src.length && src[j] !== c) {
                if (c !== "`" && src[j] === "\n") { j = -1; break; }
                if (src[j] === "\\" && j + 1 < src.length) j++;
                j++;
              }
              if (j < 0 || j >= src.length) continue;
              for (let k = i + 1; k < j; k++) isCode[k] = false;
              i = j; continue;
            }
          }
          return isCode;
        };

        // Extracts the top-level keys of an object literal, plus the source text
        // of each value and of the literal itself. The name is matched either as
        // an assignment (`const X = { … }`) or as a property
        // (`new Thing({ X: { … } })`) — the enhancer builds its maps the second
        // way.
        //
        // Two shapes need `resolveRef` to be named at all: computed keys
        // (`[ENTITIES.USER]:`) and spreads of a helper call
        // (`...selfContained(ENTITIES.LINK, …)`). `unresolved` counts the key
        // positions that could not be named — a non-zero count means the key
        // list is INCOMPLETE, which is the difference between "this entity is
        // not configured" and "we did not read the whole map".
        const extractObjectLiteral = (src, name, resolveRef) => {
          const resolve = resolveRef || (() => undefined);
          // The name may be quoted when it is a property key. A quoted key
          // closes its quote right after the name, which is what tells it apart
          // from a string literal that happens to contain `name: {`.
          const anchor = new RegExp(
            "(?:(?:const|let|var)\\s+" + name + "\\s*=|\"" + name + "\"\\s*:|'" + name + "'\\s*:"
            + "|\\b" + name + "\\s*:)\\s*\\{", "g");
          // An anchor found in a comment or inside a string is a decoy: it would
          // hand the caller (and the LLM excerpt) a completely unrelated object.
          const isCode = codeOffsets(src);
          let decl = null, candidate = null;
          while ((candidate = anchor.exec(src)) !== null) {
            if (isCode[candidate.index]) { decl = candidate; break; }
          }
          if (!decl) return null;
          const open = decl.index + decl[0].length - 1;
          const keys = [];
          const entries = {};
          const codeEntries = {};
          let depth = 0, end = -1, expectKey = false, unresolved = 0;
          let pendingKey = null, valueStart = -1;
          // Two views of every value: `entries` is the source text (a caller
          // reading a string literal out of it needs the literal intact), and
          // `codeEntries` has comments and string contents blanked, for callers
          // that classify an entry by the mechanism it wires up — prose that
          // merely mentions that mechanism must not count.
          const closeEntry = (at) => {
            if (pendingKey !== null && valueStart >= 0) {
              entries[pendingKey] = src.slice(valueStart, at).trim();
              let masked = "";
              for (let i = valueStart; i < at; i++) masked += isCode[i] ? src[i] : " ";
              codeEntries[pendingKey] = masked.trim();
            }
            pendingKey = null; valueStart = -1;
          };
          for (let i = open; i < src.length; i++) {
            const c = src[i], next = src[i + 1];
            if (c === "/" && next === "/") {
              const nl = src.indexOf("\n", i);
              if (nl < 0) break;
              i = nl; continue;
            }
            if (c === "/" && next === "*") {
              const close = src.indexOf("*/", i + 2);
              if (close < 0) break;
              i = close + 1; continue;
            }
            if (/\s/.test(c)) continue;
            // Key position is tested before the string skipper, otherwise a
            // quoted key would be consumed as a plain string literal.
            if (expectKey && depth === 1) {
              expectKey = false;
              const ahead = src.slice(i, i + 4000);
              if (c === ".") {
                // `...helper(A, B)` contributes one key per argument; a bare
                // `...other` contributes an unknown number of them. The helper
                // name is the only description those keys have, so it stands in
                // as their value text.
                const call = /^\.\.\.\s*([A-Za-z_$][\w$]*)\s*\(([\s\S]*?)\)/.exec(ahead);
                if (call) {
                  for (const raw of call[2].split(",")) {
                    const arg = raw.replace(/\/\/[^\n]*/g, "").trim();
                    if (!arg) continue;
                    const k = resolve(arg);
                    if (k === undefined) unresolved++;
                    else {
                      keys.push(k);
                      entries[k] = `...${call[1]}(…)`;
                      codeEntries[k] = entries[k];
                    }
                  }
                  i += call[0].length - 1;
                  continue;
                }
                if (ahead.startsWith("...")) { unresolved++; i += 2; continue; }
              }
              if (c === "[") {
                const computed = /^\[\s*([^\]]+?)\s*\]\s*:/.exec(ahead);
                if (computed) {
                  const k = resolve(computed[1]);
                  if (k === undefined) unresolved++;
                  else { keys.push(k); pendingKey = k; valueStart = i + computed[0].length; }
                  i += computed[0].length - 1;
                  continue;
                }
                unresolved++;
              }
              const m = /^(?:(["'])((?:\\.|[^\\\n])*?)\1|([A-Za-z_$][\w$]*))\s*:/.exec(ahead);
              if (m) {
                const k = m[2] !== undefined ? m[2] : m[3];
                keys.push(k);
                pendingKey = k;
                valueStart = i + m[0].length;
                i += m[0].length - 1;
                continue;
              }
            }
            if (c === '"' || c === "'" || c === "`") {
              let j = i + 1;
              while (j < src.length && src[j] !== c) { if (src[j] === "\\") j++; j++; }
              i = j; continue;
            }
            // Brackets and parens count towards depth too, so a comma inside a
            // value (an array, an arrow's parameter list) is not read as the
            // start of the next key.
            if (c === "{" || c === "[" || c === "(") {
              depth++;
              if (depth === 1) expectKey = true;
              continue;
            }
            if (c === "}" || c === "]" || c === ")") {
              depth--;
              if (depth === 0) { closeEntry(i); end = i; break; }
              continue;
            }
            if (c === "," && depth === 1) { closeEntry(i); expectKey = true; continue; }
          }
          if (end < 0) return null;
          return { keys, entries, codeEntries, unresolved, block: src.slice(open, end + 1) };
        };

        // Both maps live in `audit-ennhancer/app.js` — that directory name is
        // spelled with a double n in the enhancer repo.
        const ENHANCER_DIR = "audit-ennhancer";
        let entityConfigKeys = [];
        let entityConfigTrusted = false;
        let clientsKeys = null;
        let appJsExcerpt = "";
        // How the enhancer will treat each configured entity. `getEntityData` in
        // its entity_enhancer.js dispatches on ENTITY_TYPE, and the mode decides
        // where the enriched data comes from — which is what the agent needs to
        // know to judge the write route:
        //   standard       → the enhancer FETCHES `GET /<entity>/<id>`,
        //   self_contained → it does not fetch; the event body must carry the
        //                    entity (an echo, or an entity_snapshot),
        //   nrn            → it resolves the nrn's own parts, no entity read,
        //   ignored        → the entry opts out of enrichment entirely,
        //   unknown        → the entry does not say (typically it delegates to a
        //                    variable declared elsewhere).
        //
        // Every mode is matched explicitly and anything left over is `unknown`,
        // never assumed: the only statically checkable obligation belongs to
        // SELF_CONTAINED (the write has to echo the entity), so quietly calling
        // an unreadable entry STANDARD would skip the one check this gate is
        // best at. `unknown` sends the agent to look at both.
        //
        // The patterns match the mechanism, never the prose: entries carry
        // `expandNRN: true` and comments that discuss self-containedness at
        // length, so a loose match would mislabel an entity — the failure
        // direction that hides real misconfiguration. `ignore: true` is anchored
        // to the whole entry because that is the only way the real map uses it;
        // nested in a `fields[]` element it means something else entirely.
        const ENTRY_MODES = [
          ["ignored", /^\{\s*ignore\s*:\s*true\s*,?\s*\}$/i],
          ["self_contained", new RegExp(
            "\\.\\.\\.[A-Za-z_$]*self[_-]?contained"
            + "|self[_-]?contained[A-Za-z_$]*enhancer"
            + "|entityType\\s*:\\s*ENTITY_TYPE\\.SELF_CONTAINED", "i")],
          ["nrn", /entityType\s*:\s*ENTITY_TYPE\.NRN/i],
          ["standard", /entityType\s*:\s*ENTITY_TYPE\.STANDARD/i],
        ];
        const entityModes = {};
        if (!isSet(github_token)) {
          unverified.push("config entry GITHUB_TOKEN missing — enhancer entityConfig not read");
        } else {
          try {
            const ghFile = async (path) => {
              const r = await fetch(`https://api.github.com/repos/${enhancer_repo}/contents/${path}`, {
                headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github.raw+json" },
              });
              if (!r.ok) throw new Error(`GET ${path} → ${r.status}`);
              return r.text();
            };
            // audit_enhancer.js only carries the ENTITIES map; without it the
            // computed keys stay unresolved and the key set is untrusted, but
            // the clients map and the excerpt are still worth having.
            const [appJs, enhancerJs] = await Promise.all([
              ghFile(`${ENHANCER_DIR}/app.js`),
              ghFile(`${ENHANCER_DIR}/audit_enhancer.js`).catch(() => ""),
            ]);
            // ENTITIES maps the constant names used as computed keys of
            // entityConfig to the entity names the audit events carry.
            const entityNames = {};
            const entities = enhancerJs ? extractObjectLiteral(enhancerJs, "ENTITIES") : null;
            if (entities) {
              for (const k of entities.keys) {
                const literal = /^["'](.*)["']$/.exec(entities.entries[k] || "");
                if (literal) entityNames[k] = literal[1];
              }
            }
            const resolveRef = (expr) => {
              const e = String(expr).trim();
              const literal = /^["'](.*)["']$/.exec(e);
              if (literal) return literal[1];
              const ref = /^ENTITIES\.([A-Za-z_$][\w$]*)$/.exec(e);
              if (ref) return entityNames[ref[1]];
              return undefined;
            };

            const cfg = extractObjectLiteral(appJs, "entityConfig", resolveRef);
            if (!cfg) throw new Error(`no entityConfig object literal in ${ENHANCER_DIR}/app.js`);
            entityConfigKeys = cfg.keys;
            // The clients map gets its own confidence gate, for the same reason
            // entityConfig has one: the agent is told to conclude from these key
            // lists, so a mis-parsed one would turn healthy entities into
            // findings. The real map always routes `default`, which makes it a
            // usable anchor.
            const clients = extractObjectLiteral(appJs, "clients", resolveRef);
            const clientsDoubts = [];
            if (!clients) clientsDoubts.push("no clients object literal found");
            else {
              if (clients.unresolved > 0) clientsDoubts.push(`${clients.unresolved} key position(s) unresolved`);
              if (!clients.keys.includes("default")) clientsDoubts.push('no "default" client');
              if (clients.keys.length < 3) clientsDoubts.push(`only ${clients.keys.length} client(s) parsed`);
            }
            clientsKeys = clientsDoubts.length === 0 ? clients.keys : null;
            if (clientsDoubts.length) {
              unverified.push(
                `enhancer clients map not parsed with confidence (${clientsDoubts.join("; ")})`
                + ` — non-default hosts cannot be cross-checked`);
            }
            // Sanity gate before any comparison. An incomplete key set is the
            // dangerous one: comparing against it reports entities that ARE
            // configured as missing, so the gate demands every key position
            // resolved plus two entities the enhancer has always configured.
            const doubts = [];
            if (cfg.unresolved > 0) doubts.push(`${cfg.unresolved} key position(s) unresolved`);
            if (entityConfigKeys.length < 5) doubts.push(`only ${entityConfigKeys.length} key(s) parsed`);
            for (const known of ["user", "parameter"]) {
              if (!entityConfigKeys.includes(known)) doubts.push(`no "${known}" key`);
            }
            entityConfigTrusted = doubts.length === 0;
            if (!entityConfigTrusted) {
              unverified.push(
                `enhancer entityConfig not parsed with confidence (${doubts.join("; ")})`
                + ` — per-entity comparison skipped`);
            } else {
              // Classified on the entry's code, with comments and strings
              // blanked.
              for (const k of entityConfigKeys) {
                const code = cfg.codeEntries[k] || "";
                const hit = ENTRY_MODES.find(([, re]) => re.test(code));
                entityModes[k] = hit ? hit[0] : "unknown";
              }
            }
            appJsExcerpt = [
              "// --- entityConfig ---",
              cfg.block.slice(0, 8000),
              clients
                ? "\n// --- clients ---\n" + clients.block.slice(0, 4000)
                : `\n// --- clients: no clients object literal found in ${ENHANCER_DIR}/app.js ---`,
            ].join("\n");
          } catch (e) {
            unverified.push(`enhancer entityConfig unavailable: ${e.message}`);
          }
        }

        const classified = Object.keys(entityModes).length > 0;
        const byMode = (mode) => Object.keys(entityModes).filter(k => entityModes[k] === mode);
        // entityConfig has a `default` entry, so an entity absent from the map is
        // not misconfigured by itself: it gets the default STANDARD treatment.
        const hasDefaultConfig = entityConfigKeys.includes("default");

        // A fingerprint of everything about the enhancer that can change a
        // verdict: which entities it knows, how it will enrich each one, and
        // which ones it routes off the default host. `gather` compares it against
        // the fingerprint the previous verdict stamped, so a change in the
        // ENHANCER's repository re-opens the analysis of applications whose own
        // code did not move. Canonical by construction (sorted, one token per
        // entity) so the same configuration always hashes the same.
        //
        // Only emitted when the map was parsed with confidence: a fingerprint of
        // a doubtful parse would flap and force a full analysis forever.
        const hash32 = (text) => {
          let h = 5381;
          for (let i = 0; i < text.length; i++) {
            h = (((h << 5) + h) ^ text.charCodeAt(i)) >>> 0;
          }
          return h.toString(16).padStart(8, "0");
        };
        const canonicalConfig = [
          ...entityConfigKeys.slice().sort().map(k => `${k}=${entityModes[k] || "?"}`),
          `clients:${(clientsKeys || []).slice().sort().join(",")}`,
        ].join("|");
        const configFingerprint = entityConfigTrusted ? hash32(canonicalConfig) : "";

        const config_view = [
          `### Enhancer entityConfig keys (${entityConfigKeys.length}${entityConfigTrusted ? "" : ", NOT trusted — see the unverified section"})`,
          entityConfigKeys.length ? "```\n" + entityConfigKeys.join(", ") + "\n```" : "(unavailable)",
          ``,
          hasDefaultConfig
            ? `The map has a \`default\` entry: an entity with no entry of its own is enriched by the default STANDARD path (the enhancer fetches \`GET /<entity>/<id>\`).`
            : `The map has NO \`default\` entry.`,
          ``,
          `### How the enhancer will treat each configured entity`,
          classified
            ? [
                `- STANDARD (the enhancer fetches the entity): ${byMode("standard").join(", ") || "(none)"}`,
                `- SELF_CONTAINED (no fetch — the WRITE must carry the entity): ${byMode("self_contained").join(", ") || "(none)"}`,
                `- NRN (only the nrn is resolved): ${byMode("nrn").join(", ") || "(none)"}`,
                `- IGNORED (opted out of enrichment): ${byMode("ignored").join(", ") || "(none)"}`,
                `- UNKNOWN (the entry delegates elsewhere — judge both sides): ${byMode("unknown").join(", ") || "(none)"}`,
              ].join("\n")
            : "(not classified — the key set could not be trusted)",
          ``,
          `### Enhancer clients map (entities routed to a non-default host)`,
          clientsKeys ? "```\n" + clientsKeys.join(", ") + "\n```" : "(could not be read with confidence)",
          ``,
          `### Enhancer app.js excerpt (entityConfig + clients)`,
          appJsExcerpt ? "```js\n" + appJsExcerpt + "\n```" : "(unavailable)",
          ``,
          `### Not verified — what this check could not read (${unverified.length})`,
          unverified.length ? unverified.map(f => `- ${f}`).join("\n") : "(none)",
        ].join("\n");

        return {
          unverified,
          entity_config_keys: entityConfigKeys,
          entity_config_trusted: entityConfigTrusted,
          entity_modes: entityModes,
          self_contained_entities: byMode("self_contained"),
          clients_keys: clientsKeys,
          has_default_config: hasDefaultConfig,
          config_fingerprint: configFingerprint,
          config_view,
        };

    error_handling:
      fallback_step: resolve_failure_config

  - id: gather
    type: module
    plugin_type: code-exec
    name: "Checkpoint + diff + repo content"
    inputs:
      application_id: "${{ steps.trigger.outputs.inputs.application_id }}"
      release_id:     "${{ steps.trigger.outputs.inputs.release_id }}"
      trigger_build:  "${{ steps.trigger.outputs.build }}"
      check_id:       "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:        "${{ steps.trigger.outputs.itemId }}"
      force_full:     "${{ steps.trigger.outputs.inputs.force_full }}"
      callbackUrl:    "${{ steps.trigger.outputs.callbackUrl }}"
      config_fingerprint: "${{ steps.enhancer_config.outputs.config_fingerprint }}"
      np_api_key:     "${{ secrets.NP_API_KEY }}"
      github_token:   "${{ secrets.GITHUB_TOKEN }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com", "api.github.com"]
      code: |
        const { application_id, release_id, trigger_build, check_id, item_id,
                force_full, callbackUrl, config_fingerprint, np_api_key, github_token } = $item;
        const isSet = (v) => typeof v === "string" && v.trim().length > 0;
        // The dispatch carries the item id first-class; `check_id` in the item
        // inputs stays supported as an override.
        const itemId = check_id || item_id || "audit_entity_check";

        // --- NP client (api-key → token) ---
        const tokRes = await fetch("https://api.nullplatform.com/token", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ api_key: np_api_key }),
        });
        if (!tokRes.ok) throw new Error(`NP token exchange failed: ${tokRes.status}`);
        const npToken = (await tokRes.json()).access_token;
        const np = async (path) => {
          const r = await fetch(`https://api.nullplatform.com${path}`, {
            headers: { authorization: `Bearer ${npToken}` },
          });
          if (!r.ok) throw new Error(`NP GET ${path} → ${r.status}`);
          return r.json();
        };
        const npTry = async (path) => { try { return await np(path); } catch (e) { return null; } };
        const ghJson = async (path) => {
          const r = await fetch(`https://api.github.com${path}`, {
            headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github+json" },
          });
          if (!r.ok) throw new Error(`GitHub ${path} → ${r.status}`);
          return r.json();
        };
        const ghRaw = async (path) => {
          const r = await fetch(`https://api.github.com${path}`, {
            headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github.raw+json" },
          });
          if (!r.ok) return null;
          return r.text();
        };

        // --- App, repo, current commit ---
        const app = await np(`/application/${application_id}`);
        const repo = (app.repository_url || "").replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "");
        if (!repo) throw new Error(`application ${application_id} has no repository_url`);
        // The dispatch already expands the build behind this release, so the
        // /release + /build round trips only happen when it does not.
        let currentSha = (trigger_build && trigger_build.commit && trigger_build.commit.id) || null;
        let branch = (trigger_build && trigger_build.branch) || null;
        if (!currentSha && release_id) {
          const rel = await npTry(`/release/${release_id}`);
          const build = rel && rel.build_id ? await npTry(`/build/${rel.build_id}`) : null;
          currentSha = build && build.commit && build.commit.id || null;
          branch = branch || (build && build.branch) || null;
        }
        const repoInfo = await ghJson(`/repos/${repo}`);
        branch = branch || repoInfo.default_branch || "main";
        if (!currentSha) {
          const head = await ghJson(`/repos/${repo}/commits/${branch}`);
          currentSha = head.sha;
        }

        // --- Checkpoint: previous checklist run with our item stamped ---
        const myApproval = (callbackUrl.match(/\/approval\/(\d+)\//) || [])[1];
        const flatten = (items) => (items || []).reduce((acc, it) => {
          acc.push(it);
          if (it.children) acc.push(...flatten(it.children));
          return acc;
        }, []);
        let checkpoint = null;
        const appNrn = encodeURIComponent(app.nrn);
        const prior = await npTry(`/approval?nrn=${appNrn}&limit=10`);
        // GET /approval returns its results ASCENDING by created_at (verified
        // against the API), so iterating them as they arrive picks the OLDEST
        // stamped verdict as the checkpoint — which compares this run against an
        // ancient sha and fingerprint and re-analyses every time. Sort newest
        // first here rather than relying on the API's order ever changing.
        const priorRows = (prior && prior.results || []).slice().sort((a, b) =>
          String(b.created_at || "").localeCompare(String(a.created_at || "")));
        // Cancelled approvals are VALID checkpoints — the natural loop is
        // cancel → fix → redeploy. What matters is the stamped analyzed_sha.
        for (const row of priorRows) {
          if (String(row.id) === String(myApproval)) continue;
          if (row.mode !== "checklist") continue;
          const run = await npTry(`/approval/${row.id}/checklist`);
          if (!run) continue;
          const item = flatten(run.items).find(i => i.id === itemId);
          const det = item && (item.details || (item.state && item.state.details));
          if (item && det && det.analyzed_sha && (item.status === "passed" || item.status === "failed")) {
            checkpoint = {
              approval_id: row.id,
              sha: det.analyzed_sha,
              status: item.status,
              findings: det.findings || [],
              entities: det.entities || [],
              config_fingerprint: det.config_fingerprint || "",
              markdown: det.markdown || "",
            };
            break;
          }
        }

        // --- Decision: carry_over vs analyze (full | diff | verify_fix) ---
        // Audit wiring lives in source code (routes, audit config), so any
        // changed source file is relevant; docs/tests/lockfiles are not.
        // The verdict has TWO inputs: this repository and the enhancer's entity
        // configuration, which lives in another repo and moves on its own. A
        // checkpoint is only reusable while neither of them moved, so the
        // fingerprint of the configuration is compared alongside the code diff —
        // otherwise a change in the enhancer would never re-evaluate any
        // application until that application happened to touch its own code.
        //
        // Compared only when both fingerprints are known: the current one is
        // empty when the map could not be parsed with confidence (nothing to
        // conclude), and a checkpoint stamped before this comparison existed has
        // none, which re-opens the analysis exactly once.
        const forceFull = String(force_full || "") === "true";
        const configChanged = !!checkpoint && isSet(config_fingerprint)
          && checkpoint.config_fingerprint !== config_fingerprint;
        // Tests, mocks, specs and documentation are not audit wiring. Declared
        // once and consulted twice — by the diff rule right below, and by the
        // snapshot ranking further down — because the two have to exclude exactly
        // the same files. While they did not, a Ruby `spec/…_spec.rb` change
        // matched the diff rule and opened a run whose snapshot then dropped the
        // very file that caused it, and reported its coverage complete.
        // Matched on whole path segments, so `routes/test_utils.js` stays a route.
        const TEST_OR_DOCS = /(^|\/)(__tests__|__mocks__|tests?|specs?|docs?)\//i;
        const RELEVANT = /\.([cm]?[jt]sx?|py|go|rb|java|kt|rs|php|cs)$|(^|\/)(null(app)?\.ya?ml|\.nullplatform\/[^/]+)$/i;
        const IRRELEVANT = new RegExp(TEST_OR_DOCS.source + "|\\.(md|txt|snap)$|package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock", "i");
        let mode = "analyze", scope = "full", changed = null;

        if (!forceFull && checkpoint && checkpoint.sha) {
          if (checkpoint.sha === currentSha) {
            changed = [];
            if (checkpoint.status === "failed") { mode = "analyze"; scope = "verify_fix"; }
            else if (configChanged) { mode = "analyze"; scope = "diff"; }
            else { mode = "carry_over"; }
          } else {
            try {
              const cmp = await ghJson(`/repos/${repo}/compare/${checkpoint.sha}...${currentSha}`);
              changed = (cmp.files || []).map(f => f.filename);
              const tooBig = changed.length > 80 || (cmp.files || []).length === 0 && (cmp.commits || []).length > 0;
              const relevant = changed.filter(p => RELEVANT.test(p) && !IRRELEVANT.test(p));
              if (tooBig) { mode = "analyze"; scope = "full"; }
              else if (checkpoint.status === "failed") { mode = "analyze"; scope = "verify_fix"; }
              else if (relevant.length === 0 && !configChanged) { mode = "carry_over"; }
              else { mode = "analyze"; scope = "diff"; }
            } catch (e) {
              // compare failed (force-push, divergent history) → full, never skip
              mode = "analyze"; scope = "full"; changed = null;
            }
          }
        }

        if (mode === "carry_over") {
          return {
            mode, repo, branch, analyzed_sha: currentSha,
            prev: checkpoint,
            changed_count: changed ? changed.length : 0,
          };
        }

        // --- Build llm_view for the analysis path ---
        const tree = await ghJson(`/repos/${repo}/git/trees/${branch}?recursive=1`);
        const blobs = (tree.tree || []).filter(t => t.type === "blob");
        const paths = blobs.map(t => t.path);
        // Audit wiring concentrates in routes/controllers/middleware and the
        // app entry point, so those rank first in the snapshot.
        const AUDIT_HOT = /(route|controller|handler|endpoint|middleware|audit|server|api|entit)/i;
        const ALWAYS = /(^|\/)(package\.json|requirements\.txt|go\.mod|Dockerfile|null(app)?\.ya?ml|\.nullplatform\/[^/]+)$/i;
        const ENTRY = /(^|\/)(src\/)?(index|main|app|server)\.[cm]?[jt]sx?$|(^|\/)(app|main)\.py$|(^|\/)main\.go$/i;
        // The write routes are the evidence this whole check rests on, and by
        // convention they live under one of these directories. They therefore
        // outrank the rest of the hot set: when a repository does not fit the
        // budget, the slots that remain have to go to routes, not to whatever
        // else happens to have "api" or "server" in its name.
        const ROUTE_DIR = /(^|\/)(routes?|controllers?|handlers?|endpoints?)\//i;
        const SKIP =/(^|\/)(node_modules|dist|build|\.git|vendor|coverage|\.next|out)\/|(\.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map|lock|min\.js|min\.css))$|package-lock\.json|pnpm-lock\.yaml|yarn\.lock/i;

        const changedSet = new Set(changed || []);
        const findingFiles = new Set((checkpoint && checkpoint.findings || []).map(f => f.file).filter(Boolean));
        const score = (p) => {
          if (SKIP.test(p)) return -1;
          // Whatever opened this run is read, wherever it lives. Ranking it after
          // the test/docs exclusion would let a file trigger the analysis and
          // then be missing from it — invisible to the agent AND to the coverage
          // that is supposed to report what the snapshot missed.
          if (scope !== "full" && (changedSet.has(p) || findingFiles.has(p))) return 5;
          // A suite that mirrors the routes it exercises (`test/routes/*.spec.js`
          // beside `routes/*.js`) would otherwise claim the whole snapshot at the
          // route-dir rank and push the production code out.
          if (TEST_OR_DOCS.test(p)) return 0;
          if (ENTRY.test(p)) return 4;
          if (ROUTE_DIR.test(p)) return 4;
          if (AUDIT_HOT.test(p)) return 3;
          if (ALWAYS.test(p)) return 3;
          return 0;
        };
        // Selection budget: how much file content is worth fetching at all. It
        // sits below MAX_PROMPT further down, with room left for the file tree and
        // the notes that travel with it, so the assembled view normally fits
        // without trimming — ASCII source at TOTAL plus a full tree lands near
        // 80000 of the 91600 bytes available. Accented source spends more than one
        // byte per character and does get trimmed; that is the cap's job, and it
        // is reported. A blob past MAX_BLOB is not worth a slot either — what
        // would survive the per-file clip is a fraction of it, at the cost of a
        // whole file's budget.
        const MAX_FILES = 60, PER_FILE = 24000, TOTAL = 60000, MAX_BLOB = 200000;
        // Ties inside one score are broken by path. Ordering by ascending size
        // fits more files in the same budget, but it drops the largest file of
        // every tier — in a routes directory that is the CRUD module this check
        // most needs to read. Path order carries no such bias and is stable
        // across runs, and what does not fit is reported below instead.
        const byRank = blobs
          .map(b => ({ path: b.path, size: b.size || 0, s: score(b.path) }))
          .filter(b => b.s > 0)
          .sort((a, b) => b.s - a.s || (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
        const ranked = byRank.filter(b => b.size < MAX_BLOB).slice(0, MAX_FILES);

        let used = 0;
        const files = [];
        for (const f of ranked) {
          if (used >= TOTAL) break;
          const content = await ghRaw(`/repos/${repo}/contents/${encodeURIComponent(f.path).replace(/%2F/g, "/")}?ref=${branch}`);
          if (content === null) continue;
          const clipped = content.slice(0, Math.min(PER_FILE, TOTAL - used));
          used += clipped.length;
          files.push({ path: f.path, truncated: content.length > clipped.length, content: clipped });
        }

        // Bytes of UTF-8, counted from code points. The limit this budget answers
        // to is a byte limit, and `String.length` counts UTF-16 code units, which
        // undercounts everything outside ASCII — accented prose runs about 1.16
        // bytes per character and CJK three, so a view measured in characters can
        // be three times its assumed size. There is no Buffer in this sandbox, so
        // the count is done by hand: one byte below U+0080, two below U+0800, four
        // for a surrogate pair (a single astral code point), three otherwise —
        // including an unpaired surrogate, which encodes as U+FFFD.
        const utf8ByteLength = (s) => {
          let n = 0;
          for (let i = 0; i < s.length; i++) {
            const c = s.charCodeAt(i);
            if (c < 0x80) { n += 1; continue; }
            if (c < 0x800) { n += 2; continue; }
            if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {
              const d = s.charCodeAt(i + 1);
              if (d >= 0xdc00 && d <= 0xdfff) { n += 4; i++; continue; }
            }
            n += 3;
          }
          return n;
        };

        // The agent runner re-expands the user prompt as a single shell argument,
        // and the kernel caps one argument at 131072 bytes (MAX_ARG_STRLEN).
        // Crossing that line does not degrade the analysis — execve fails, and the
        // step dies with exit status 126 and no diagnostic worth reading.
        //
        // The argument is not this view alone: the agent's prompt template
        // interpolates three of them. So the budget is shared, and the share left
        // for the snapshot is what remains after the others are reserved:
        //
        //   131072  kernel limit per argument
        //   120000  ASSEMBLED_TARGET — what the three views plus template may total
        //     -400  TEMPLATE_BYTES — the fixed prose around the interpolations
        //   -20000  CONFIG_VIEW_BYTES — the enhancer view, bounded in its own step
        //           (an 8000 + 4000 character source excerpt, plus key and mode
        //           lines); reserved here because this step cannot measure it
        //    -8000  FINDINGS_BYTES — the previous findings, capped below
        //   ------
        //    91600  MAX_PROMPT — the snapshot's share
        const ASSEMBLED_TARGET = 120000, TEMPLATE_BYTES = 400;
        const CONFIG_VIEW_BYTES = 20000, FINDINGS_BYTES = 8000;
        const MAX_PROMPT = ASSEMBLED_TARGET - TEMPLATE_BYTES - CONFIG_VIEW_BYTES - FINDINGS_BYTES;

        // The tree is the agent's map of what exists — a list of names, not
        // evidence — so it takes a bounded share: whichever comes first, 400
        // entries or TREE_BYTES. Bounding it is what makes the trimming below
        // terminate: with every part of the view except the file contents bounded,
        // dropping files always brings the total under MAX_PROMPT.
        const TREE_BYTES = 20000;
        const treeCandidates = paths.filter(p => !SKIP.test(p));
        const treePaths = [];
        let treeUsed = 0;
        for (const p of treeCandidates) {
          if (treePaths.length >= 400) break;
          const cost = utf8ByteLength(p) + 1;
          if (treeUsed + cost > TREE_BYTES) break;
          treePaths.push(p);
          treeUsed += cost;
        }
        const treeView = treePaths.join("\n");
        const treeNote = treePaths.length < treeCandidates.length
          ? ` — first ${treePaths.length} of ${treeCandidates.length} listed`
          : "";
        const scopeNote = scope === "full"
          ? "FULL AUDIT: no previous checkpoint (or forced)."
          : scope === "verify_fix"
            ? `FIX VERIFICATION: this check FAILED at commit ${checkpoint.sha.slice(0,7)}. Changed files since then: ${(changed||[]).join(", ") || "(none)"}.`
            : `DIFF-SCOPED AUDIT: check passed at ${checkpoint.sha.slice(0,7)}; re-checking because of ${(changed||[]).length} changed file(s)${configChanged ? ", and because the enhancer configuration changed since that verdict" : ""}.`;

        // How much of the audit-relevant code the agent actually got to read.
        // This is a property of the snapshot, so it is computed here and handed
        // to the agent and to the item as a fact — never asked of the agent,
        // which can only report what it was shown. `omitted` follows the ranking
        // order, so the capped list names the most relevant misses first.
        const OMITTED_CAP = 50;
        const listFor = (list, total) => {
          const rest = total - list.length;
          return list.map(p => `- ${p}`).join("\n") + (rest > 0 ? `\n- …and ${rest} more` : "");
        };
        const coverageOf = (shown) => {
          const includedPaths = new Set(shown.map(f => f.path));
          const omitted = byRank.map(b => b.path).filter(p => !includedPaths.has(p));
          const truncatedPaths = shown.filter(f => f.truncated).map(f => f.path);
          return {
            complete: omitted.length === 0 && truncatedPaths.length === 0,
            hot_total: byRank.length,
            included: shown.length,
            omitted_count: omitted.length,
            omitted: omitted.slice(0, OMITTED_CAP),
            truncated_count: truncatedPaths.length,
            truncated: truncatedPaths.slice(0, OMITTED_CAP),
          };
        };
        const noteOf = (cov) => cov.complete
          ? "COMPLETE: every audit-relevant file of the tree is included below, in full."
          : [
              `INCOMPLETE: ${cov.included} of ${cov.hot_total} audit-relevant file(s) fit the snapshot budget.`,
              cov.omitted_count
                ? `NOT shown to you at all (${cov.omitted_count}):\n${listFor(cov.omitted, cov.omitted_count)}`
                : "",
              cov.truncated_count
                ? `Included but CUT OFF mid-file (${cov.truncated_count}):\n${listFor(cov.truncated, cov.truncated_count)}`
                : "",
              "Treat every file listed above as unread. An entity whose write routes"
                + " live in one of them must be reported with verdict `unverified` and a"
                + " reason naming this coverage gap, and neither your summary nor any"
                + " finding may claim the review covered the whole repository.",
            ].filter(Boolean).join("\n\n");
        const viewOf = (shown, cov) => [
          `## Repository: ${repo} (branch: ${branch}, commit: ${currentSha.slice(0,7)}) — application "${app.name}"`,
          ``, `### Analysis scope`, scopeNote, ``,
          `### Snapshot coverage`, noteOf(cov), ``,
          `### Full file tree (${paths.length} files${treeNote})`,
          "```", treeView, "```",
          ``,
          `### Selected file contents (${shown.length} files)`,
          ...shown.map(f => `\n--- ${f.path}${f.truncated ? " (truncated)" : ""} ---\n${f.content}`),
        ].join("\n");

        // The file budget above is only the selection heuristic — it cannot know
        // how many bytes the view it produces will occupy. MAX_PROMPT is the
        // invariant that has to hold. Trimming drops whole files from the tail of
        // the ranking — lowest score, last one in, first one out — and never cuts
        // through the assembled string. A file sliced mid-body is worse evidence
        // than an absent one, and every file that goes has to stay reportable, so
        // coverage is recomputed on each pass instead of describing a snapshot
        // that changed underneath it.
        let shown = files;
        let coverage = coverageOf(shown);
        let llm_view = viewOf(shown, coverage);
        while (utf8ByteLength(llm_view) > MAX_PROMPT && shown.length > 0) {
          shown = shown.slice(0, shown.length - 1);
          coverage = coverageOf(shown);
          llm_view = viewOf(shown, coverage);
        }

        // The previous findings ride in the same argument, so they get a bounded
        // share of it too. Whole findings are dropped from the end of the list,
        // never half a line, and the view says how many are missing so the agent
        // does not read a trimmed list as the complete one.
        const findingLines = (checkpoint && checkpoint.findings || [])
          .map(f => `- ${f.file || f.entity}: ${f.issue}`);
        const keptFindings = [];
        let findingsUsed = 0;
        for (const line of findingLines) {
          const cost = utf8ByteLength(line) + 1;
          // Leaves room for the "not shown" line the trimming itself adds.
          if (findingsUsed + cost > FINDINGS_BYTES - 80) break;
          keptFindings.push(line);
          findingsUsed += cost;
        }
        const droppedFindings = findingLines.length - keptFindings.length;
        if (droppedFindings > 0) {
          keptFindings.push(`- …and ${droppedFindings} older finding(s) not shown`);
        }
        const prev_findings_view = keptFindings.join("\n") || "(none)";

        return {
          mode: "analyze", scope, repo, branch, analyzed_sha: currentSha,
          prev: checkpoint, changed_count: changed ? changed.length : null,
          total_files: paths.length,
          coverage,
          prev_findings_view,
          llm_view,
        };
    error_handling:
      fallback_step: resolve_failure_gather

  - id: route
    type: decider
    plugin_type: conditional
    name: "Carry-over or analyze?"
    config:
      expression: "steps.gather.outputs.mode == 'analyze'"

  - id: progress_analyzing
    type: module
    plugin_type: np-checklist-item-progress
    name: "Heartbeat: auditing entity configuration"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      message:       "Auditing entity audit configuration (${{ steps.gather.outputs.scope }}) with AI…"

  - id: audit_agent
    type: module
    plugin_type: claude-code-agent
    name: "Audit entity configuration coverage"
    config:
      model: claude-opus-4-8
      maxIterations: 5
      systemPrompt: |
        You are the audit-coverage auditor for nullplatform's engineering
        platform. Every HTTP write (POST/PUT/PATCH/DELETE) served by an
        internal API must produce an audit event that flows producer →
        audit-enhancer → customers_lake. Your job: given ONE application's
        repository snapshot plus the audit-enhancer's entity configuration,
        decide whether the entities this application writes are configured for
        auditing. Do not use tools; respond directly with your final answer.

        This is a PREVENTIVE, STATIC review, run before the code ships. You are
        reading source: this repository at the commit being deployed, and the
        enhancer's configuration. There is no runtime evidence in front of you —
        no traffic, no lake rows, no live responses — because a new entity has
        none yet, and the pipeline's own monitors already watch what happens
        after the deploy. So: conclude from code, and where code cannot decide,
        say the side is unverified rather than guessing. Never describe runtime
        behaviour as if you had observed it.

        How entity names are derived (framework-specific — identify which one
        this repo uses before judging):
        - Fastify + @nullplatform/server-audit: OPT-IN per route via
          `config.audit` ({ enabled: true, entity, id resolver }). A write
          route without config.audit produces NO audit event. Field
          validation is blocking and silent: a missing mandatory field means
          the event is never published.
        - Express + np-api-js inspector: OPT-OUT. Every write is audited and
          the entity name is inferred from the FIRST path segment of the URL.
          GETs are not audited. A route can disable with `audit.enabled:
          false`.
        - Hand-rolled (main-service-api): entity derived with an
          even/odd URL-segment rule.
        - Hand-rolled (workflow-api): explicit regex map (ENTITY_MAP) with a
          `workflow_<segment>` fallback for unmatched paths.

        An entity is correctly configured when three sides agree:
        A. the producer emits the event with its mandatory fields — decidable
           from this repository,
        B. the enhancer handles the entity name, and the way it handles it
           matches what the write actually provides — decidable from the
           entityConfig section below,
        C. the enhancer's service account can read the entity — NOT decidable
           before the deploy. Do not claim it either way.

        The entityConfig section tells you how the enhancer will treat each
        configured entity, and each mode demands something different of the
        write route:
        - STANDARD: the enhancer will fetch `GET /<entity>/<id>` with its own
          identity. The entity therefore needs a read endpoint, and the audited
          `entity_id` has to be the id that endpoint accepts (a write on a
          sub-resource audits the sub-resource id, which the parent's GET cannot
          resolve — that is what an `idRemapper` is for).
        - SELF_CONTAINED: the enhancer will NOT fetch anything. The event itself
          has to carry the entity, so the write route must echo the entity in
          its response body or attach an `entity_snapshot`. VERIFY THIS IN THE
          CODE for every SELF_CONTAINED entity this application writes: find the
          handler, and check what it returns. A 204, an empty body, a bare
          `{ id }`, or a response that omits the audited fields means the lake
          row will be empty forever, silently. That is a
          `self_contained_no_echo` finding, and it is the most valuable thing
          you can catch here.
        - NRN: only the nrn is resolved; the entity itself is never read.
        - IGNORED: the entry opts out of enrichment on purpose. Not a finding.
        - UNKNOWN: the entry does not state its mode (it usually delegates to
          something declared elsewhere), so this check could not classify it. Do
          the work of both branches for these: cross-check the name as usual AND
          look at the write route for an echo or an entity_snapshot. Report what
          you find, and if the code does not settle it, say the mode could not be
          determined instead of assuming one.
        - An entity with NO entry of its own is not automatically
          misconfigured: when the map has a `default` entry it gets the default
          STANDARD treatment, so judge it as STANDARD. Report a finding only
          when that path cannot work — no read endpoint, or the entity is served
          on a non-default host with no `clients` entry to route it there.

        The snapshot header states the ANALYSIS SCOPE:
        - FULL AUDIT: judge the whole repo.
        - DIFF-SCOPED AUDIT: the check passed at a previous commit; focus on
          whether the CHANGED files (new/modified routes) break audit coverage.
          Do not re-litigate unchanged code.
        - FIX VERIFICATION: the check previously FAILED with the findings
          listed; your PRIMARY job is deciding whether each was resolved,
          filling `resolved_findings`, then checking for new issues.

        Judgment guidelines:
        - Enumerate the repository's write routes, apply the framework's
          derivation rule, and predict the entity name each one will emit. Two
          checks follow from that list: routes that produce NO audit event at
          all (the evidence is an absence — nothing else can see this), and each
          predicted name against the entityConfig keys and the modes above.
        - Cross-check names against the entityConfig keys ONLY while the section
          does not report the key set as untrusted or unavailable. When it does,
          the list proves nothing and absence is not evidence.
        - Side C (the read grant) and what the first real write will do are not
          verifiable before the deploy. State that plainly, once, without
          dramatising it: verdict `unverified` in the entities table for the
          entities whose enrichment depends on it, and one sentence in the
          summary. It is not a finding and it must not turn the item red.
        - A source that could not be read is not a finding either. Treat the
          side it covers as unverified and say which one.
        - Nothing about the ENHANCER's own configuration is a finding against this
          application: its team cannot change that file. Use it to judge what the
          application has to provide, and no more.
        - If this application serves no HTTP writes at all (worker, frontend),
          answer not_applicable and say why in one sentence.
        - Every finding names a concrete file or entity, one-sentence issue,
          one-sentence concrete fix.
        - fix_instructions_md must be a short markdown recipe actionable by a
          coding agent WITHOUT further context. Empty string when passed.
        - The snapshot is partial: never invent file contents you were not
          shown. If the selected files are insufficient to prove a problem,
          lean towards passed and say what you could not verify.
        - The snapshot header states its SNAPSHOT COVERAGE, and it is measured,
          not estimated. When it reports omitted or truncated files, those files
          are unread: an entity whose write routes live in one of them gets
          verdict `unverified` with the coverage gap named in its `reason`, and
          neither the summary nor any finding may claim the review covered the
          whole repository. Absence of an audit event is not evidence in a file
          you were not shown.
      userPrompt: |
        Application audit-coverage check.

        Previous findings (relevant in FIX VERIFICATION scope):
        ${{ steps.gather.outputs.prev_findings_view }}

        Audit-enhancer entity configuration (side B, read from its repository):

        ${{ steps.enhancer_config.outputs.config_view }}

        Repository snapshot:

        ${{ steps.gather.outputs.llm_view }}
      outputSchema:
        type: object
        required: [status, summary]
        properties:
          status: { type: string, enum: [passed, failed, not_applicable] }
          summary: { type: string, description: "≤60 words: the verdict and its single most important reason" }
          findings:
            type: array
            items:
              type: object
              required: [issue, fix]
              properties:
                # Only areas a static reading of the code can establish. The
                # ones that used to come from the live probe (missing_grant,
                # wrong_host, dlq_risk) and from the lake (degraded_entity) are
                # gone with it — runtime is the monitors' job.
                area: { type: string, enum: [unaudited_route, name_mismatch, missing_entity_config, needs_id_remapper, needs_self_contained, self_contained_no_echo, missing_mandatory_field, other] }
                entity: { type: string }
                file: { type: string }
                issue: { type: string }
                fix: { type: string }
          resolved_findings:
            type: array
            items:
              type: object
              required: [issue, resolution]
              properties:
                entity: { type: string }
                file: { type: string }
                issue: { type: string }
                resolution: { type: string }
          entities:
            type: array
            description: "Write entities this application emits (observed or predicted from routes)"
            items:
              type: object
              required: [entity, verdict]
              properties:
                entity: { type: string }
                source: { type: string, description: "route or mechanism that produces it" }
                verdict: { type: string, description: "`unverified` is the honest answer whenever the entity's enrichment depends on something only the deploy can settle", enum: [ok, unaudited, misconfigured, unverified] }
                reason: { type: string, description: "Why the verdict is what it is. Mandatory for `unverified`: name what could not be settled — the read grant, or the snapshot coverage gap that hid the entity's write routes." }
          fix_instructions_md: { type: string }
    error_handling:
      fallback_step: resolve_failure_agent

  - id: resolve
    type: module
    plugin_type: code-exec
    name: "Log findings + resolve item"
    inputs:
      callbackUrl:      "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken:    "${{ steps.trigger.outputs.callbackToken }}"
      check_id:         "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:          "${{ steps.trigger.outputs.itemId }}"
      verdict:          "${{ steps.audit_agent.outputs }}"
      repo:             "${{ steps.gather.outputs.repo }}"
      scope:            "${{ steps.gather.outputs.scope }}"
      analyzed_sha:     "${{ steps.gather.outputs.analyzed_sha }}"
      changed_count:    "${{ steps.gather.outputs.changed_count }}"
      coverage:         "${{ steps.gather.outputs.coverage }}"
      unverified:       "${{ steps.enhancer_config.outputs.unverified }}"
      config_fingerprint: "${{ steps.enhancer_config.outputs.config_fingerprint }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com"]
      code: |
        const { callbackUrl, callbackToken, check_id, item_id, verdict, repo,
                scope, analyzed_sha, changed_count, coverage, unverified, config_fingerprint } = $item;
        const itemId = check_id || item_id || "audit_entity_check";
        const H = { authorization: `Bearer ${callbackToken}`, "content-type": "application/json" };
        const post = (url, body) => fetch(url, { method: "POST", headers: H, body: JSON.stringify(body) });
        const patch = (url, body) => fetch(url, { method: "PATCH", headers: H, body: JSON.stringify(body) });

        const v = verdict || {};
        const na = v.status === "not_applicable";
        const status = v.status === "failed" ? "failed" : "passed";
        const findings = v.findings || [];
        const resolved = v.resolved_findings || [];
        const entities = v.entities || [];
        const unread = Array.isArray(unverified) ? unverified : [];
        const analysisScope = scope || "full";
        const sha7 = (analyzed_sha || "").slice(0, 7);
        // Measured by the gather step while it packed the snapshot, not taken
        // from the verdict: how much of the code the agent read is not something
        // the agent itself can attest to.
        const cov = coverage && typeof coverage === "object" ? coverage : null;
        const covIncomplete = !!cov && cov.complete === false;

        for (const f of resolved) {
          await post(`${callbackUrl}/log`, { level: "info", message: `Resolved: ${f.entity || f.file || ""} — ${f.issue} → ${f.resolution}` }).catch(() => null);
        }
        for (const f of findings) {
          await post(`${callbackUrl}/log`, {
            level: status === "failed" ? "warning" : "info",
            message: `[${f.area || "other"}] ${f.entity || f.file || ""}: ${f.issue} — Fix: ${f.fix}`,
          }).catch(() => null);
        }
        for (const d of unread) {
          await post(`${callbackUrl}/log`, { level: "warning", message: `Could not be read: ${d}` }).catch(() => null);
        }
        if (covIncomplete) {
          await post(`${callbackUrl}/log`, {
            level: "warning",
            message: `Snapshot coverage incomplete: ${cov.omitted_count || 0} audit-relevant file(s) omitted, ${cov.truncated_count || 0} truncated (${cov.included || 0}/${cov.hot_total || 0} read).`,
          }).catch(() => null);
        }
        await post(`${callbackUrl}/log`, {
          level: "info",
          message: na ? `Check not applicable — treated as passed.` : `Verdict (${analysisScope} @ ${sha7}): ${v.status}. ${v.summary || ""}`,
        }).catch(() => null);

        const ICON = { ok: "✅", unaudited: "🔇", misconfigured: "⚠️", unverified: "❔" };
        const mdEntities = entities.length
          ? "\n**Entidades de escritura de esta aplicación:**\n" + entities.map(e =>
              `- ${ICON[e.verdict] || "•"} \`${e.entity}\` (${e.verdict})${e.source ? ` — ${e.source}` : ""}${e.reason ? `\n  - ${e.reason}` : ""}`).join("\n")
          : "";
        const mdResolved = resolved.length
          ? "\n**Findings resueltos desde el último deploy:**\n" + resolved.map(f => `- ✅ \`${f.entity || f.file || ""}\` — ${f.issue}\n  - ${f.resolution}`).join("\n")
          : "";
        const mdFindings = findings.length
          ? "\n**Findings:**\n" + findings.map(f => `- \`${f.entity || f.file || ""}\` [${f.area || "other"}] — ${f.issue}\n  - **Fix:** ${f.fix}`).join("\n")
          : "";
        // The report always says what it could not settle: the grant side is
        // not decidable before the deploy, plus whatever source failed to read.
        const mdUnverified = [
          "\n**Sin verificar** (chequeo estático previo al deploy):",
          "- El grant de lectura del enhancer y el comportamiento del primer write real se verifican recién en el próximo deploy; el runtime lo cubren los monitores del pipeline.",
          ...unread.map(f => `- ${f}`),
        ].join("\n");
        // A partial reading that reports itself is best-effort; a partial reading
        // that stays quiet is a false negative, so the shortfall is named on the
        // item even though it never changes the verdict.
        const MD_COVERAGE_LIST = 10;
        const covList = (paths, total) => {
          const shown = (paths || []).slice(0, MD_COVERAGE_LIST);
          const rest = (total || 0) - shown.length;
          return shown.map(p => `  - \`${p}\``)
            .concat(rest > 0 ? [`  - …y ${rest} más`] : []).join("\n");
        };
        const mdCoverage = covIncomplete
          ? [
              `\n**Cobertura del snapshot: INCOMPLETA** — el agente leyó ${cov.included || 0} de ${cov.hot_total || 0} archivo(s) relevantes para audit.`,
              cov.omitted_count
                ? `- ${cov.omitted_count} archivo(s) que no entraron:\n${covList(cov.omitted, cov.omitted_count)}`
                : "",
              cov.truncated_count
                ? `- ${cov.truncated_count} archivo(s) truncado(s):\n${covList(cov.truncated, cov.truncated_count)}`
                : "",
              "- Las entidades cuyas rutas de escritura viven en esos archivos quedan sin verificar; el veredicto no cambia por esto.",
            ].filter(Boolean).join("\n")
          : "";
        const mdFix = (status === "failed" && v.fix_instructions_md)
          ? `\n\n#### How to fix\n${v.fix_instructions_md}`
          : "";
        const scopeLabel = analysisScope === "full" ? "análisis completo"
          : analysisScope === "verify_fix" ? "verificación de fixes"
          : `incremental (${changed_count ?? "?"} archivos cambiados)`;
        const markdown = [
          `### Audit coverage — ${na ? "N/A" : status.toUpperCase()}`,
          ``,
          `Repo: \`${repo}\` · 🔎 ${scopeLabel} @ \`${sha7}\``,
          ``,
          v.summary || "",
          mdEntities, mdResolved, mdFindings, mdCoverage, mdFix, mdUnverified,
        ].join("\n");

        const message = na
          ? `N/A: ${v.summary || "application serves no audited writes"}`
          : `${status === "passed" ? "OK" : `${findings.length} issue(s)`} [${scopeLabel}]: ${(v.summary || "").slice(0, 160)}`;

        const details = {
          markdown, check_id: itemId, findings,
          analyzed_sha, scope: analysisScope,
          // Stamped next to the sha: together they are the pair of inputs the
          // next run compares before reusing this verdict.
          config_fingerprint: config_fingerprint || "",
          entities: entities.map(e => ({ ...e })),
          // How much of the code this verdict is based on, next to the verdict
          // itself: a reader of the item can tell a clean pass from a pass over
          // a partial snapshot without re-running anything.
          coverage: cov,
        };

        const r = await patch(callbackUrl, { status, message, details });
        if (!r.ok) throw new Error(`resolve ${itemId} -> ${r.status}: ${await r.text()}`);
        return { resolved: true, status, findings: findings.length, scope: analysisScope };

  - id: resolve_carryover
    type: module
    plugin_type: code-exec
    name: "Carry over previous verdict (no audit-relevant changes)"
    inputs:
      callbackUrl:      "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken:    "${{ steps.trigger.outputs.callbackToken }}"
      check_id:         "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:          "${{ steps.trigger.outputs.itemId }}"
      repo:             "${{ steps.gather.outputs.repo }}"
      analyzed_sha:     "${{ steps.gather.outputs.analyzed_sha }}"
      changed_count:    "${{ steps.gather.outputs.changed_count }}"
      prev:             "${{ steps.gather.outputs.prev }}"
      unverified:       "${{ steps.enhancer_config.outputs.unverified }}"
      config_fingerprint: "${{ steps.enhancer_config.outputs.config_fingerprint }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com"]
      code: |
        const { callbackUrl, callbackToken, check_id, item_id, repo,
                analyzed_sha, changed_count, prev, unverified, config_fingerprint } = $item;
        const isSet = (v) => typeof v === "string" && v.trim().length > 0;
        const itemId = check_id || item_id || "audit_entity_check";
        const H = { authorization: `Bearer ${callbackToken}`, "content-type": "application/json" };
        const p = prev || {};
        // Only a passed/failed checkpoint reaches this step, but the item must
        // resolve even if the stamp ever arrives incomplete.
        const prevStatus = p.status === "failed" ? "failed" : "passed";
        const sha7 = (analyzed_sha || "").slice(0, 7);
        const prev7 = (p.sha || "").slice(0, 7);
        const n = changed_count || 0;
        const unread = Array.isArray(unverified) ? unverified : [];

        const message = `≡ Sin cambios relevantes desde ${prev7} (${n} archivo(s) tocados) — se mantiene ${prevStatus.toUpperCase()}`;
        const mdUnread = unread.length
          ? "\n**No se pudo leer** (no afecta el carry-over):\n" + unread.map(f => `- ${f}`).join("\n") + "\n"
          : "";
        const markdown = [
          `### Audit coverage — ${prevStatus.toUpperCase()} (carry-over)`,
          ``,
          `Repo: \`${repo}\` · ≡ sin re-análisis: los ${n} archivo(s) cambiados desde \`${prev7}\` no tocan el wiring de audit. El chequeo es estático, así que el mismo código da el mismo veredicto.`,
          mdUnread,
          ``,
          `_Último análisis real (@ \`${prev7}\`):_`,
          ``,
          p.markdown || "(sin detalle previo)",
        ].join("\n");

        await fetch(`${callbackUrl}/log`, { method: "POST", headers: H, body: JSON.stringify({
          level: "info", message: `Carry-over from approval ${p.approval_id} @ ${prev7}: ${n} changed file(s), none audit-relevant.`,
        }) }).catch(() => null);

        const r = await fetch(callbackUrl, { method: "PATCH", headers: H, body: JSON.stringify({
          status: prevStatus, message,
          details: {
            markdown, check_id: itemId, findings: p.findings || [],
            entities: p.entities || [],
            // Keep the previous fingerprint when this run could not compute one,
            // so an unreadable config does not erase a usable stamp.
            config_fingerprint: isSet(config_fingerprint) ? config_fingerprint : (p.config_fingerprint || ""),
            analyzed_sha, scope: "carry_over", carried_from: p.sha,
          },
        }) });
        if (!r.ok) throw new Error(`carry-over resolve ${itemId} -> ${r.status}: ${await r.text()}`);
        return { resolved: true, status: prevStatus, scope: "carry_over" };

  # Fallbacks — the item resolves with the raw error so the run never hangs.
  - id: resolve_failure_config
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve skipped (enhancer config unreadable)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      # `skipped`, not `failed`: what broke is this workflow's own reading of a
      # third repository, and an application must not fail an audit-coverage gate
      # because of that.
      status:        skipped
      message:       "Audit-coverage check skipped: the enhancer configuration could not be read: ${{ steps.enhancer_config.error.message }}"
      details:
        markdown: "Reading the audit-enhancer entity configuration crashed before the audit ran, so the check could not be evaluated. Error: ${{ steps.enhancer_config.error.message }}"

  - id: resolve_failure_gather
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve failed (checkpoint/repo fetch crashed)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        failed
      message:       "Audit-coverage check could not prepare the analysis: ${{ steps.gather.error.message }}"
      details:
        markdown: "The analysis failed before auditing. Error: ${{ steps.gather.error.message }}"

  - id: resolve_failure_agent
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve failed (audit agent crashed)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        failed
      message:       "Audit-coverage agent crashed: ${{ steps.audit_agent.error.message }}"
      details:
        markdown: "The AI audit step failed. Error: ${{ steps.audit_agent.error.message }}"

connections:
  - { id: c1, from: trigger,            to: progress }
  - { id: c2, from: progress,           to: enhancer_config }
  - { id: c3, from: enhancer_config,    to: gather }
  - { id: c4, from: gather,             to: route }
  - { id: c5, from: route,              to: progress_analyzing, source_port: "true" }
  - { id: c6, from: route,              to: resolve_carryover,  source_port: "false" }
  - { id: c7, from: progress_analyzing, to: audit_agent }
  - { id: c8, from: audit_agent,        to: resolve }
  # Dormant edges: a fallback only routes over a DECLARED connection, and
  # `condition: "false"` keeps the edge from firing on the happy path (it also
  # keeps the fallback tails out of the entry-point set).
  - { id: c9,  from: enhancer_config, to: resolve_failure_config, condition: "false" }
  - { id: c10, from: gather,          to: resolve_failure_gather, condition: "false" }
  - { id: c11, from: audit_agent,     to: resolve_failure_agent,  condition: "false" }
