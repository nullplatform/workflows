# Audit Coverage — entity configuration checklist item resolver.
#
# Pairs with checklist external items of `kind: audit-entity-check`. ONE item
# per deploy: it validates that the entities this application writes are
# correctly wired into the HTTP audit pipeline (producer → audit-enhancer →
# customers_lake), so misconfigured entities are caught at deploy time instead
# of showing up later as DLQ messages or `degraded` enrichment in Datadog.
#
# An entity is "correctly configured" when three sides agree:
#   A. the producer emits the audit event (framework-dependent: server-audit
#      on Fastify is opt-in per route; np-api-js on Express is opt-out; the
#      service-api and workflow-api derive names with hand-rolled rules),
#   B. the enhancer knows the entity name (entityConfig in its app.js:
#      STANDARD / SELF_CONTAINED / NRN, plus clients map for non-default hosts),
#   C. the enhancer's service account can read the entity (platform grant).
#
# Deterministic signals gathered before any LLM call:
#   - lake (two `np-lake-query` steps): entities first seen in the last 7 days
#     and the per-entity empty-row rate (the real-world proxy of `degraded`),
#     each carrying a sample entity_id for the probe,
#   - enhancer entityConfig + clients keys, read out of `audit-ennhancer/app.js`
#     in the enhancer repo. Both maps are properties of a constructor call and
#     most entityConfig keys are computed (`[ENTITIES.USER]:`) or arrive through
#     `...selfContained(…)`, so the ENTITIES map in `audit_enhancer.js` is read
#     too and the key set is only used when every key position resolved,
#   - fetch probe: replay the enhancer's own GET (same identity, same
#     X-Enhanced header) against a real entity_id — the response code predicts
#     exactly what production will do (200 ok / 404 host-or-id / 401-403 grant
#     / 5xx DLQ).
# The LLM covers what data cannot: write routes in the repo that produce NO
# audit at all (the evidence is an absence), and predicting the entity name a
# new route will emit under each framework's derivation rule.
#
# Signals report through two separate channels, and the difference matters:
#   - `data_flags`: anomalies in the pipeline. They are findings material and
#     they force a fresh analysis.
#   - `degraded_sources`: a source that could not be read (query failed,
#     config entry missing, host unreachable). They are published on the item
#     but never drive the incremental decision — otherwise one broken
#     credential would disable the carry-over path forever and in silence.
#
# Incremental strategy (same as arch-rule-check): past checklist runs are the
# checkpoint store. Carry over the previous verdict only when the code diff
# has no audit-relevant changes AND the deterministic signals raised no data
# flags for an entity this application emits. Fail open towards FULL analysis,
# never towards skipping.
id: audit-entity-check
key: audit-entity-check
name: "Audit Coverage — Entity Config Check"
description: >
  Validates that the entities written by this application are correctly
  configured for the HTTP audit pipeline: producer emits the event, the
  audit-enhancer has config for the entity name, and the enhancer's service
  account can fetch it. Combines deterministic signals (lake queries, enhancer
  config, fetch probe) with an LLM pass over the repository for write routes
  that do not audit. One execution per checklist item
  (kind: audit-entity-check).
semantic_version: 1.0.0
path: "/checklist/audit"

inputs:
  triggerPayload:
    type: object
    default: {}

variables:
  # Set only when the corresponding lake query fails, so the execution state
  # records which source degraded even though the run carried on.
  lake_new_entities_error: { initialValue: "" }
  lake_empty_rows_error: { initialValue: "" }

steps:
  - id: trigger
    type: trigger
    plugin_type: np-checklist-trigger
    name: "On checklist dispatch (audit-entity-check)"
    config:
      pathPrefix: /np/checklist/audit-entity-check
      mode: start
      kind: audit-entity-check
      # Literal NRN: the hosted engine does NOT resolve ${{ vars.* }} in
      # trigger config at activation time — an expression here reaches the
      # notifications API verbatim and fails channel creation with an
      # unexplained 403. Change this value when publishing to another org, and
      # keep it in sync with the NP_ORGANIZATION_ID config entry the rest of
      # the governance suite registers under.
      nrn: "organization=1255165411"

  - id: progress
    type: module
    plugin_type: np-checklist-item-progress
    name: "Heartbeat: collecting audit signals"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      message:       "Collecting audit pipeline signals (lake, enhancer config, fetch probe)…"

  # Neither lake query may fail the run, and neither may take the other down
  # with it: a missing signal forces analysis, it never blocks the checklist.
  # Each query falls back to its own re-entry node, which continues to the SAME
  # successor the query has on the happy path — so a failed query 1 still lets
  # query 2 run, and `signals` sees the absent `rows` input either way and
  # records a degraded source. Every join point downstream therefore has exactly
  # two predecessors of which exactly one ever completes, which is what makes
  # `join_strategy: any` unambiguous there (see governance/README.md).
  - id: lake_new_entities
    type: module
    plugin_type: np-lake-query
    name: "Lake: entities first seen in the last 7 days"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      sql: |
        -- audit_events is partitioned by day and must always be date-bounded,
        -- so `first_seen` means "first seen inside the 90-day window", not
        -- "first seen ever" — an entity dormant for more than 90 days reads as
        -- new here, which errs towards analysing it again.
        SELECT entity,
               toString(min(date)) AS first_seen,
               count() AS writes,
               groupUniqArray(10)(method) AS methods,
               argMaxIf(entity_id, date, entity_id != '') AS sample_entity_id
        FROM audit_events
        WHERE date > now() - INTERVAL 90 DAY
          AND method != 'GET'
        GROUP BY entity
        HAVING min(date) > now() - INTERVAL 7 DAY
        ORDER BY writes DESC
        LIMIT 20
    error_handling:
      fallback_step: lake_new_degraded

  - id: lake_empty_rows
    type: module
    plugin_type: np-lake-query
    name: "Lake: entities with empty enrichment rows (degraded proxy)"
    # Runs whether query 1 succeeded or degraded — exactly one of those two
    # predecessors ever completes.
    join_strategy: any
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      sql: |
        -- Empty-row detector: buildResp always injects `version`, so an
        -- enriched row has at least one other key in entity_data.
        SELECT entity,
               count() AS total,
               countIf(JSONAllPaths(entity_data) = ['version']
                       AND toString(entity_context) = '{}') AS empty_rows,
               round(100 * empty_rows / total, 1) AS pct_empty,
               argMaxIf(entity_id, date, entity_id != '') AS sample_entity_id
        FROM audit_events
        WHERE date > now() - INTERVAL 7 DAY
          AND method != 'GET'
        GROUP BY entity
        HAVING total > 20 AND pct_empty > 5
        ORDER BY pct_empty DESC
        LIMIT 20
    error_handling:
      fallback_step: lake_empty_degraded

  # Re-entry nodes for a failed lake query, one per query: a failing step can
  # only hand control to a node whose predecessors are ALL settled, so a shared
  # node would hang on the query that never ran (same reason the failure-resolve
  # tails are separate). Each one records the error in the execution state and
  # continues where its query would have; `signals` reads the error message
  # straight off the failed step.
  - id: lake_new_degraded
    type: module
    plugin_type: set-variable
    name: "Record the degraded new-entities query"
    config:
      path: lake_new_entities_error
      value: "${{ steps.lake_new_entities.error.message }}"

  - id: lake_empty_degraded
    type: module
    plugin_type: set-variable
    name: "Record the degraded empty-rows query"
    config:
      path: lake_empty_rows_error
      value: "${{ steps.lake_empty_rows.error.message }}"

  - id: signals
    type: module
    plugin_type: code-exec
    name: "Deterministic signals: enhancer config + probe over the lake rows"
    # Runs whether query 2 succeeded or degraded — exactly one of those two
    # predecessors ever completes.
    join_strategy: any
    inputs:
      github_token:       "${{ secrets.GITHUB_TOKEN }}"
      enhancer_api_key:   "${{ secrets.ENHANCER_API_KEY }}"
      enhancer_repo:      "nullplatform/data-audit-stream-enhancer"
      new_entity_rows:    "${{ steps.lake_new_entities.outputs.rows }}"
      empty_row_rows:     "${{ steps.lake_empty_rows.outputs.rows }}"
      new_entities_error: "${{ steps.lake_new_entities.error.message }}"
      empty_rows_error:   "${{ steps.lake_empty_rows.error.message }}"
    config:
      network:
        allowedHosts:
          - "api.github.com"
          - "authz.nullplatform.io"
          - "api.nullplatform.io"
          - "users.nullplatform.io"
          - "params.nullplatform.io"
          - "providers.nullplatform.io"
          - "approvals.nullplatform.io"
          - "notifications.nullplatform.io"
          - "governance-action-items-api-production-ufjmx.prod.nullapps.io"
      code: |
        const { github_token, enhancer_api_key, enhancer_repo,
                new_entity_rows, empty_row_rows,
                new_entities_error, empty_rows_error } = $item;

        // Anomalies of the audited pipeline: they force a fresh analysis. Each
        // one records the entity it is about (null when it is not about one) so
        // the incremental decision can tell this application's entities from
        // the rest of the organization's.
        const data_flags = [];
        // Sources that could not be read. Published, never decisive.
        const degraded_sources = [];
        const flag = (entity, text) => data_flags.push({ entity: entity || null, text });
        // A config entry that does not exist is absent from $item altogether,
        // so an unset secret would otherwise reach fetch() as "undefined".
        const isSet = (v) => typeof v === "string" && v.trim().length > 0;

        // Extracts the top-level keys of an object literal, plus the raw source
        // text of each value and of the literal itself. The name is matched
        // either as an assignment (`const X = { … }`) or as a property
        // (`new Thing({ X: { … } })`) — the enhancer builds its maps the second
        // way. Comments and strings are skipped, so a `word:` inside a comment
        // is not a key and a brace inside a comment or a string neither opens
        // nor closes the object.
        //
        // Two shapes need `resolveRef` to be named at all: computed keys
        // (`[ENTITIES.USER]:`) and spreads of a helper call
        // (`...selfContained(ENTITIES.LINK, …)`). `unresolved` counts the key
        // positions that could not be named — a non-zero count means the key
        // list is INCOMPLETE, which is the difference between "this entity is
        // not configured" and "we did not read the whole map".
        // Marks every offset of `src` that is real code. Everything inside a
        // comment or inside a string literal is not — the delimiters themselves
        // still are, so a quoted property key can anchor while a string that
        // merely mentions the map cannot.
        const codeOffsets = (src) => {
          const isCode = new Array(src.length).fill(true);
          for (let i = 0; i < src.length; i++) {
            const c = src[i], next = src[i + 1];
            if (c === "/" && next === "/") {
              while (i < src.length && src[i] !== "\n") { isCode[i] = false; i++; }
              continue;
            }
            if (c === "/" && next === "*") {
              const close = src.indexOf("*/", i + 2);
              const stop = close < 0 ? src.length : close + 2;
              while (i < stop) { isCode[i] = false; i++; }
              i--; continue;
            }
            if (c === '"' || c === "'" || c === "`") {
              // Only a template literal may span lines, so a quote with no
              // partner on its own line is not opening a string — it is a
              // character inside something else, typically a regex like
              // /['"]/. Treating it as a string would blank out the rest of
              // the file and lose the anchor. A regex is still not modelled:
              // one holding a quote that DOES have a partner on the same line
              // masks the span between them, which can only cost the anchor
              // (an unfound anchor degrades the source, it never invents one).
              let j = i + 1;
              while (j < src.length && src[j] !== c) {
                if (c !== "`" && src[j] === "\n") { j = -1; break; }
                if (src[j] === "\\" && j + 1 < src.length) j++;
                j++;
              }
              if (j < 0 || j >= src.length) continue;
              for (let k = i + 1; k < j; k++) isCode[k] = false;
              i = j; continue;
            }
          }
          return isCode;
        };

        const extractObjectLiteral = (src, name, resolveRef) => {
          const resolve = resolveRef || (() => undefined);
          // The name may be quoted when it is a property key. A quoted key
          // closes its quote right after the name, which is what tells it apart
          // from a string literal that happens to contain `name: {`.
          const anchor = new RegExp(
            "(?:(?:const|let|var)\\s+" + name + "\\s*=|\"" + name + "\"\\s*:|'" + name + "'\\s*:"
            + "|\\b" + name + "\\s*:)\\s*\\{", "g");
          // An anchor found in a comment or inside a string is a decoy: it would
          // hand the caller (and the LLM excerpt) a completely unrelated object.
          const isCode = codeOffsets(src);
          let decl = null, candidate = null;
          while ((candidate = anchor.exec(src)) !== null) {
            if (isCode[candidate.index]) { decl = candidate; break; }
          }
          if (!decl) return null;
          const open = decl.index + decl[0].length - 1;
          const keys = [];
          const entries = {};
          let depth = 0, end = -1, expectKey = false, unresolved = 0;
          let pendingKey = null, valueStart = -1;
          const closeEntry = (at) => {
            if (pendingKey !== null && valueStart >= 0) {
              entries[pendingKey] = src.slice(valueStart, at).trim();
            }
            pendingKey = null; valueStart = -1;
          };
          for (let i = open; i < src.length; i++) {
            const c = src[i], next = src[i + 1];
            if (c === "/" && next === "/") {
              const nl = src.indexOf("\n", i);
              if (nl < 0) break;
              i = nl; continue;
            }
            if (c === "/" && next === "*") {
              const close = src.indexOf("*/", i + 2);
              if (close < 0) break;
              i = close + 1; continue;
            }
            if (/\s/.test(c)) continue;
            // Key position is tested before the string skipper, otherwise a
            // quoted key would be consumed as a plain string literal.
            if (expectKey && depth === 1) {
              expectKey = false;
              const ahead = src.slice(i, i + 4000);
              if (c === ".") {
                // `...helper(A, B)` contributes one key per argument; a bare
                // `...other` contributes an unknown number of them. The helper
                // name is the only description those keys have, so it stands in
                // as their value text.
                const call = /^\.\.\.\s*([A-Za-z_$][\w$]*)\s*\(([\s\S]*?)\)/.exec(ahead);
                if (call) {
                  for (const raw of call[2].split(",")) {
                    const arg = raw.replace(/\/\/[^\n]*/g, "").trim();
                    if (!arg) continue;
                    const k = resolve(arg);
                    if (k === undefined) unresolved++;
                    else { keys.push(k); entries[k] = `...${call[1]}(…)`; }
                  }
                  i += call[0].length - 1;
                  continue;
                }
                if (ahead.startsWith("...")) { unresolved++; i += 2; continue; }
              }
              if (c === "[") {
                const computed = /^\[\s*([^\]]+?)\s*\]\s*:/.exec(ahead);
                if (computed) {
                  const k = resolve(computed[1]);
                  if (k === undefined) unresolved++;
                  else { keys.push(k); pendingKey = k; valueStart = i + computed[0].length; }
                  i += computed[0].length - 1;
                  continue;
                }
                unresolved++;
              }
              const m = /^(?:(["'])((?:\\.|[^\\\n])*?)\1|([A-Za-z_$][\w$]*))\s*:/.exec(ahead);
              if (m) {
                const k = m[2] !== undefined ? m[2] : m[3];
                keys.push(k);
                pendingKey = k;
                valueStart = i + m[0].length;
                i += m[0].length - 1;
                continue;
              }
            }
            if (c === '"' || c === "'" || c === "`") {
              let j = i + 1;
              while (j < src.length && src[j] !== c) { if (src[j] === "\\") j++; j++; }
              i = j; continue;
            }
            // Brackets and parens count towards depth too, so a comma inside a
            // value (an array, an arrow's parameter list) is not read as the
            // start of the next key.
            if (c === "{" || c === "[" || c === "(") {
              depth++;
              if (depth === 1) expectKey = true;
              continue;
            }
            if (c === "}" || c === "]" || c === ")") {
              depth--;
              if (depth === 0) { closeEntry(i); end = i; break; }
              continue;
            }
            if (c === "," && depth === 1) { closeEntry(i); expectKey = true; continue; }
          }
          if (end < 0) return null;
          return { keys, entries, unresolved, block: src.slice(open, end + 1) };
        };

        // --- Source 1: enhancer entityConfig + clients map (side B) ---
        // Both maps live in `audit-ennhancer/app.js` — that directory name is
        // spelled with a double n in the enhancer repo.
        const ENHANCER_DIR = "audit-ennhancer";
        let entityConfigKeys = [];
        let entityConfigTrusted = false;
        let clientsKeys = null;
        let appJsExcerpt = "";
        // Entities the enhancer deliberately never fetches: a SELF_CONTAINED
        // entry enriches from the event body and an `ignore: true` entry is
        // skipped outright. The GET the probe replays does not happen in
        // production for them, so their 404 is the designed behaviour and saying
        // otherwise both invents a finding and (being a data flag) disables the
        // carry-over for every application writing those entities.
        const NOT_FETCHED = /self[_-]?contained|\bignore\s*:\s*true/i;
        const notFetched = new Set();
        if (!isSet(github_token)) {
          degraded_sources.push("config entry GITHUB_TOKEN missing — enhancer entityConfig not read");
        } else {
          try {
            const ghFile = async (path) => {
              const r = await fetch(`https://api.github.com/repos/${enhancer_repo}/contents/${path}`, {
                headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github.raw+json" },
              });
              if (!r.ok) throw new Error(`GET ${path} → ${r.status}`);
              return r.text();
            };
            // audit_enhancer.js only carries the ENTITIES map; without it the
            // computed keys stay unresolved and the key set is untrusted, but
            // the clients map and the excerpt are still worth having.
            const [appJs, enhancerJs] = await Promise.all([
              ghFile(`${ENHANCER_DIR}/app.js`),
              ghFile(`${ENHANCER_DIR}/audit_enhancer.js`).catch(() => ""),
            ]);
            // ENTITIES maps the constant names used as computed keys of
            // entityConfig to the entity names the audit events carry.
            const entityNames = {};
            const entities = enhancerJs ? extractObjectLiteral(enhancerJs, "ENTITIES") : null;
            if (entities) {
              for (const k of entities.keys) {
                const literal = /^["'](.*)["']$/.exec(entities.entries[k] || "");
                if (literal) entityNames[k] = literal[1];
              }
            }
            const resolveRef = (expr) => {
              const e = String(expr).trim();
              const literal = /^["'](.*)["']$/.exec(e);
              if (literal) return literal[1];
              const ref = /^ENTITIES\.([A-Za-z_$][\w$]*)$/.exec(e);
              if (ref) return entityNames[ref[1]];
              return undefined;
            };

            const cfg = extractObjectLiteral(appJs, "entityConfig", resolveRef);
            if (!cfg) throw new Error(`no entityConfig object literal in ${ENHANCER_DIR}/app.js`);
            entityConfigKeys = cfg.keys;
            // The clients map gets its own confidence gate, for the same reason
            // entityConfig has one: `clientsDeclares` returning false is what
            // escalates a probe to `wrong_host`, so a mis-parsed key list would
            // turn healthy entities into findings. The real map always routes
            // `default`, which makes it a usable anchor.
            const clients = extractObjectLiteral(appJs, "clients", resolveRef);
            const clientsDoubts = [];
            if (!clients) clientsDoubts.push("no clients object literal found");
            else {
              if (clients.unresolved > 0) clientsDoubts.push(`${clients.unresolved} key position(s) unresolved`);
              if (!clients.keys.includes("default")) clientsDoubts.push('no "default" client');
              if (clients.keys.length < 3) clientsDoubts.push(`only ${clients.keys.length} client(s) parsed`);
            }
            clientsKeys = clientsDoubts.length === 0 ? clients.keys : null;
            if (clientsDoubts.length) {
              degraded_sources.push(
                `enhancer clients map not parsed with confidence (${clientsDoubts.join("; ")})`
                + ` — alternate-host verdicts left to the agent`);
            }
            // Sanity gate before any comparison. An incomplete key set is the
            // dangerous one: comparing against it reports entities that ARE
            // configured as missing, so the gate demands every key position
            // resolved plus two entities the enhancer has always configured.
            const doubts = [];
            if (cfg.unresolved > 0) doubts.push(`${cfg.unresolved} key position(s) unresolved`);
            if (entityConfigKeys.length < 5) doubts.push(`only ${entityConfigKeys.length} key(s) parsed`);
            for (const known of ["user", "parameter"]) {
              if (!entityConfigKeys.includes(known)) doubts.push(`no "${known}" key`);
            }
            entityConfigTrusted = doubts.length === 0;
            if (!entityConfigTrusted) {
              degraded_sources.push(
                `enhancer entityConfig not parsed with confidence (${doubts.join("; ")})`
                + ` — per-entity comparison skipped`);
            } else {
              // An entry whose text does not say either way is left out, so the
              // entity gets probed: erring towards looking, not towards excusing.
              for (const k of entityConfigKeys) {
                if (NOT_FETCHED.test(cfg.entries[k] || "")) notFetched.add(k);
              }
            }
            appJsExcerpt = [
              "// --- entityConfig ---",
              cfg.block.slice(0, 8000),
              clients
                ? "\n// --- clients ---\n" + clients.block.slice(0, 4000)
                : `\n// --- clients: no clients object literal found in ${ENHANCER_DIR}/app.js ---`,
            ].join("\n");
          } catch (e) {
            degraded_sources.push(`enhancer entityConfig unavailable: ${e.message}`);
          }
        }

        // --- Source 2: the lake (sides A+B observed in the wild) ---
        // Both queries are organization-wide: audit_events has no application
        // column, so these rows describe every team. `gather` narrows the
        // flags down to this application before deciding anything.
        const newEntities = Array.isArray(new_entity_rows) ? new_entity_rows : [];
        const degradedEntities = Array.isArray(empty_row_rows) ? empty_row_rows : [];
        // No rows input means the query step did not deliver: it either failed
        // (its error travels here) or never ran at all. Those read very
        // differently on the item, so keep them apart.
        const lakeDegraded = (label, error) => degraded_sources.push(
          isSet(error)
            ? `lake unavailable (${label}): the query failed — ${error}`
            : `lake unavailable (${label}): the query did not run`);
        if (!Array.isArray(new_entity_rows)) lakeDegraded("new entities", new_entities_error);
        if (!Array.isArray(empty_row_rows)) lakeDegraded("empty rows", empty_rows_error);

        // entityConfig has a `default` entry, so an absent entity is not
        // misconfigured by itself: it gets the default STANDARD treatment, which
        // only works if the enhancer can GET it. Say that instead of claiming a
        // missing configuration the absence does not prove.
        const hasDefaultConfig = entityConfigKeys.includes("default");
        if (entityConfigTrusted) {
          for (const e of newEntities) {
            if (entityConfigKeys.includes(e.entity)) continue;
            flag(e.entity, hasDefaultConfig
              ? `new entity "${e.entity}" (first seen ${e.first_seen}) has no dedicated enhancer entityConfig entry, so it falls back to "default" (STANDARD): GET /${e.entity}/<id> has to answer for the enhancer's own identity`
              : `new entity "${e.entity}" (first seen ${e.first_seen}) is missing from the enhancer entityConfig`);
          }
        }
        for (const e of degradedEntities) {
          flag(e.entity, `entity "${e.entity}" has ${e.pct_empty}% empty rows in the lake (${e.empty_rows}/${e.total}, last 7d)`);
        }

        // --- Source 3: fetch probe (side C) ---
        // Replays the enhancer's own enrichment GET with ITS identity, so
        // every response code is conclusive about what production will do.
        const HOSTS = [
          "https://api.nullplatform.io",
          "https://users.nullplatform.io",
          "https://params.nullplatform.io",
          "https://providers.nullplatform.io",
          "https://approvals.nullplatform.io",
          "https://notifications.nullplatform.io",
          "https://governance-action-items-api-production-ufjmx.prod.nullapps.io",
        ];
        // A 404 on the default host with a 200 elsewhere is only a
        // misconfiguration when the entity has NO `clients` entry: that map is
        // what routes an entity off the default host, and plenty of entities
        // legitimately live elsewhere — which is why HOSTS has six alternates.
        // It is keyed by entity name.
        //   true  → declared, so answering elsewhere is expected
        //   false → no entry, so the enhancer only ever calls the default host
        //   null  → map unavailable; nothing can be concluded from the probe
        const clientsDeclares = (entity) => (clientsKeys ? clientsKeys.includes(entity) : null);
        const PROBE_VERDICT = (code, altHit, clientsEntry) => {
          // No HTTP response at all: sandbox egress or a network blip, not a
          // statement about the entity.
          if (code === 0) return "probe_unreachable";
          if (code === 200) return "ok";
          if (altHit) return clientsEntry === false ? "wrong_host" : "answers_on_alt_host";
          if (code === 404) return "id_or_endpoint_missing";
          if (code === 401 || code === 403) return "missing_grant";
          return "upstream_error_dlq_risk";
        };

        // Entity names derive from request URL segments, so they are
        // attacker-influenced and only allowlisted ones reach a probe URL. Two
        // segments are allowed because real names have them —
        // `notification/channel`, `runtime_configuration/dimension` — and the
        // enhancer fetches them as `GET /notification/channel/<id>`. No dot is
        // in the charset and no segment may be empty or start with a dash, so
        // `..` and `//` cannot appear.
        const SAFE_ENTITY = /^[A-Za-z0-9_][A-Za-z0-9_-]{0,63}(\/[A-Za-z0-9_][A-Za-z0-9_-]{0,63})?$/;
        const SAFE_ID = /^[A-Za-z0-9_.:-]{1,128}$/;
        const MAX_PROBES = 4;
        const samples = new Map();
        for (const row of [...newEntities, ...degradedEntities]) {
          if (!row || !row.entity || samples.has(row.entity)) continue;
          samples.set(row.entity, row.sample_entity_id || "");
        }
        const probes = [];
        const probeable = [];
        for (const entity of samples.keys()) {
          if (notFetched.has(entity)) {
            // Information for the agent, never a finding: production issues no
            // GET for these, so a probe result would say nothing about them.
            probes.push({ entity, verdict: "not_fetched_by_design" });
          } else if (!SAFE_ENTITY.test(entity)) {
            const shown = String(entity).slice(0, 40);
            if (entityConfigTrusted && entityConfigKeys.includes(entity)) {
              // The enhancer configures this name, so it is legitimate by
              // definition: not being able to probe it is a gap in this check,
              // not a finding about the application.
              probes.push({ entity: shown, verdict: "skipped_not_probeable" });
              degraded_sources.push(`probe: entity ${JSON.stringify(shown)} is configured in the enhancer but its name is outside what this probe builds URLs for — not probed`);
            } else {
              probes.push({ entity: shown, verdict: "skipped_unsafe_name" });
              flag(entity, `probe: entity name ${JSON.stringify(shown)} skipped (characters outside the audit naming convention — itself a finding)`);
            }
          } else {
            probeable.push(entity);
          }
        }
        const suspects = probeable.slice(0, MAX_PROBES);
        // The probe table must never read as exhaustive when it is not, and the
        // honest total is every suspect, not only the probeable ones.
        if (probeable.length > MAX_PROBES) {
          degraded_sources.push(`probe: ${samples.size} suspect entities but only ${MAX_PROBES} were probed (sandbox time budget) — the rest are unverified`);
        }

        if (suspects.length && !isSet(enhancer_api_key)) {
          degraded_sources.push("config entry ENHANCER_API_KEY missing — fetch probe skipped");
        } else if (suspects.length) {
          try {
            const tokRes = await fetch("https://authz.nullplatform.io/token", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ apikey: enhancer_api_key }),
            });
            if (!tokRes.ok) throw new Error(`enhancer token exchange → ${tokRes.status}`);
            const token = (await tokRes.json()).access_token;
            // Each segment is escaped on its own so a two-segment entity keeps
            // the slash the enhancer's own GET uses.
            const get = async (host, entity, id) => {
              const path = entity.split("/").map(encodeURIComponent).join("/");
              const r = await fetch(`${host}/${path}/${encodeURIComponent(id)}`, {
                headers: { authorization: `Bearer ${token}`, "X-Enhanced": "true" },
              }).catch(() => null);
              return r ? r.status : 0;
            };
            // The sandbox budget is 30s and not configurable, so the probes run
            // as one batch and each alternate-host sweep as another: a
            // sequential 4×7 sweep would not fit.
            const results = await Promise.all(suspects.map(async (entity) => {
              const id = samples.get(entity);
              if (!id) return { entity, verdict: "no_sample_id" };
              if (!SAFE_ID.test(id)) {
                return { entity, entity_id: String(id).slice(0, 40), verdict: "skipped_unsafe_id" };
              }
              const code = await get(HOSTS[0], entity, id);
              let altHit = null;
              if (code === 404) {
                const alts = await Promise.all(HOSTS.slice(1).map(async (h) => [h, await get(h, entity, id)]));
                const hit = alts.find(([, c]) => c === 200);
                altHit = hit ? hit[0] : null;
              }
              return {
                entity, entity_id: id, status: code, alt_host: altHit,
                verdict: PROBE_VERDICT(code, altHit, clientsDeclares(entity)),
              };
            }));
            probes.push(...results);
            for (const p of results) {
              if (p.verdict === "ok") continue;
              if (p.verdict === "probe_unreachable") {
                degraded_sources.push(`probe: entity "${p.entity}" got no HTTP response (sandbox egress or network)`);
              } else if (p.verdict === "no_sample_id") {
                degraded_sources.push(`probe: entity "${p.entity}" has no sample entity_id in the lake window`);
              } else if (p.verdict === "skipped_unsafe_id") {
                flag(p.entity, `probe: entity "${p.entity}" has a sample entity_id with unexpected characters (${JSON.stringify(p.entity_id)}) — itself a finding`);
              } else {
                flag(p.entity, `probe: entity "${p.entity}" → HTTP ${p.status}${p.alt_host ? `, 200 on ${p.alt_host}` : ""} (${p.verdict})`);
              }
            }
          } catch (e) {
            degraded_sources.push(`fetch probe unavailable: ${e.message}`);
          }
        }

        const signals_view = [
          `### Enhancer entityConfig keys (${entityConfigKeys.length}${entityConfigTrusted ? "" : ", NOT trusted — see degraded sources"})`,
          entityConfigKeys.length ? "```\n" + entityConfigKeys.join(", ") + "\n```" : "(unavailable)",
          ``,
          `### Enhancer app.js excerpt (entityConfig + clients)`,
          appJsExcerpt ? "```js\n" + appJsExcerpt + "\n```" : "(unavailable)",
          ``,
          `### Entities first seen in the lake in the last 7 days (organization-wide)`,
          newEntities.length
            ? newEntities.map(e => `- ${e.entity} — first seen ${e.first_seen}, ${e.writes} writes, methods: ${(e.methods || []).join("/")}`).join("\n")
            : "(none)",
          ``,
          `### Entities with empty enrichment rows (degraded proxy, last 7 days, organization-wide)`,
          degradedEntities.length
            ? degradedEntities.map(e => `- ${e.entity} — ${e.pct_empty}% empty (${e.empty_rows}/${e.total})`).join("\n")
            : "(none)",
          ``,
          `### Fetch probe (enhancer identity, probed ${suspects.length} of ${samples.size} suspect entities)`,
          probes.length
            ? probes.map(p => `- ${p.entity} (id ${p.entity_id || "?"}) → HTTP ${p.status ?? "-"}${p.alt_host ? `, 200 on ${p.alt_host}` : ""} → ${p.verdict}`).join("\n")
            : "(no suspect entities probed)",
          ``,
          `### Data flags (${data_flags.length})`,
          data_flags.length ? data_flags.map(f => `- ${f.text}`).join("\n") : "(none)",
          ``,
          `### Degraded sources (${degraded_sources.length}) — could not be read, not findings`,
          degraded_sources.length ? degraded_sources.map(f => `- ${f}`).join("\n") : "(none)",
        ].join("\n");

        return {
          data_flags,
          degraded_sources,
          entity_config_keys: entityConfigKeys,
          entity_config_trusted: entityConfigTrusted,
          new_entities: newEntities,
          degraded_entities: degradedEntities,
          probes,
          signals_view,
        };
    error_handling:
      fallback_step: resolve_failure_signals

  - id: gather
    type: module
    plugin_type: code-exec
    name: "Checkpoint + diff + repo content"
    inputs:
      application_id: "${{ steps.trigger.outputs.inputs.application_id }}"
      release_id:     "${{ steps.trigger.outputs.inputs.release_id }}"
      trigger_build:  "${{ steps.trigger.outputs.build }}"
      check_id:       "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:        "${{ steps.trigger.outputs.itemId }}"
      force_full:     "${{ steps.trigger.outputs.inputs.force_full }}"
      callbackUrl:    "${{ steps.trigger.outputs.callbackUrl }}"
      data_flags:     "${{ steps.signals.outputs.data_flags }}"
      np_api_key:     "${{ secrets.NP_API_KEY }}"
      github_token:   "${{ secrets.GITHUB_TOKEN }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com", "api.github.com"]
      code: |
        const { application_id, release_id, trigger_build, check_id, item_id,
                force_full, callbackUrl, data_flags, np_api_key, github_token } = $item;
        // The dispatch carries the item id first-class; `check_id` in the item
        // inputs stays supported as an override.
        const itemId = check_id || item_id || "audit_entity_check";

        // --- NP client (api-key → token) ---
        const tokRes = await fetch("https://api.nullplatform.com/token", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ api_key: np_api_key }),
        });
        if (!tokRes.ok) throw new Error(`NP token exchange failed: ${tokRes.status}`);
        const npToken = (await tokRes.json()).access_token;
        const np = async (path) => {
          const r = await fetch(`https://api.nullplatform.com${path}`, {
            headers: { authorization: `Bearer ${npToken}` },
          });
          if (!r.ok) throw new Error(`NP GET ${path} → ${r.status}`);
          return r.json();
        };
        const npTry = async (path) => { try { return await np(path); } catch (e) { return null; } };
        const ghJson = async (path) => {
          const r = await fetch(`https://api.github.com${path}`, {
            headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github+json" },
          });
          if (!r.ok) throw new Error(`GitHub ${path} → ${r.status}`);
          return r.json();
        };
        const ghRaw = async (path) => {
          const r = await fetch(`https://api.github.com${path}`, {
            headers: { authorization: `Bearer ${github_token}`, accept: "application/vnd.github.raw+json" },
          });
          if (!r.ok) return null;
          return r.text();
        };

        // --- App, repo, current commit ---
        const app = await np(`/application/${application_id}`);
        const repo = (app.repository_url || "").replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "");
        if (!repo) throw new Error(`application ${application_id} has no repository_url`);
        // The dispatch already expands the build behind this release, so the
        // /release + /build round trips only happen when it does not.
        let currentSha = (trigger_build && trigger_build.commit && trigger_build.commit.id) || null;
        let branch = (trigger_build && trigger_build.branch) || null;
        if (!currentSha && release_id) {
          const rel = await npTry(`/release/${release_id}`);
          const build = rel && rel.build_id ? await npTry(`/build/${rel.build_id}`) : null;
          currentSha = build && build.commit && build.commit.id || null;
          branch = branch || (build && build.branch) || null;
        }
        const repoInfo = await ghJson(`/repos/${repo}`);
        branch = branch || repoInfo.default_branch || "main";
        if (!currentSha) {
          const head = await ghJson(`/repos/${repo}/commits/${branch}`);
          currentSha = head.sha;
        }

        // --- Checkpoint: previous checklist run with our item stamped ---
        const myApproval = (callbackUrl.match(/\/approval\/(\d+)\//) || [])[1];
        const flatten = (items) => (items || []).reduce((acc, it) => {
          acc.push(it);
          if (it.children) acc.push(...flatten(it.children));
          return acc;
        }, []);
        let checkpoint = null;
        const appNrn = encodeURIComponent(app.nrn);
        const prior = await npTry(`/approval?nrn=${appNrn}&limit=10`);
        // Cancelled approvals are VALID checkpoints — the natural loop is
        // cancel → fix → redeploy. What matters is the stamped analyzed_sha.
        for (const row of (prior && prior.results || [])) {
          if (String(row.id) === String(myApproval)) continue;
          if (row.mode !== "checklist") continue;
          const run = await npTry(`/approval/${row.id}/checklist`);
          if (!run) continue;
          const item = flatten(run.items).find(i => i.id === itemId);
          const det = item && (item.details || (item.state && item.state.details));
          if (item && det && det.analyzed_sha && (item.status === "passed" || item.status === "failed")) {
            checkpoint = {
              approval_id: row.id,
              sha: det.analyzed_sha,
              status: item.status,
              findings: det.findings || [],
              entities: det.entities || [],
              markdown: det.markdown || "",
            };
            break;
          }
        }

        // --- Decision: carry_over vs analyze (full | diff | verify_fix) ---
        // Audit wiring lives in source code (routes, audit config), so any
        // changed source file is relevant; docs/tests/lockfiles are not.
        const forceFull = String(force_full || "") === "true";
        const allFlags = Array.isArray(data_flags) ? data_flags : [];
        // The lake queries are organization-wide, so another team's entity
        // must not force a re-analysis here. The entities the previous run
        // recorded for this application are the filter; with no such list
        // every flag counts, which errs towards analysing.
        const knownEntities = (checkpoint && checkpoint.entities || [])
          .map(e => e && e.entity).filter(Boolean);
        const ownFlags = knownEntities.length
          ? allFlags.filter(f => !f || !f.entity || knownEntities.includes(f.entity))
          : allFlags;
        const RELEVANT = /\.([cm]?[jt]sx?|py|go|rb|java|kt|rs|php|cs)$|(^|\/)(null(app)?\.ya?ml|\.nullplatform\/[^/]+)$/i;
        const IRRELEVANT = /(^|\/)(__tests__|__mocks__|tests?|docs?)\/|\.(md|txt|snap)$|package-lock\.json|pnpm-lock\.yaml|yarn\.lock/i;
        let mode = "analyze", scope = "full", changed = null;

        if (!forceFull && checkpoint && checkpoint.sha) {
          if (checkpoint.sha === currentSha) {
            changed = [];
            if (checkpoint.status === "failed") { mode = "analyze"; scope = "verify_fix"; }
            else if (ownFlags.length === 0) { mode = "carry_over"; }
            else { mode = "analyze"; scope = "diff"; }
          } else {
            try {
              const cmp = await ghJson(`/repos/${repo}/compare/${checkpoint.sha}...${currentSha}`);
              changed = (cmp.files || []).map(f => f.filename);
              const tooBig = changed.length > 80 || (cmp.files || []).length === 0 && (cmp.commits || []).length > 0;
              const relevant = changed.filter(p => RELEVANT.test(p) && !IRRELEVANT.test(p));
              if (tooBig) { mode = "analyze"; scope = "full"; }
              else if (checkpoint.status === "failed") { mode = "analyze"; scope = "verify_fix"; }
              else if (relevant.length === 0 && ownFlags.length === 0) { mode = "carry_over"; }
              else { mode = "analyze"; scope = "diff"; }
            } catch (e) {
              // compare failed (force-push, divergent history) → full, never skip
              mode = "analyze"; scope = "full"; changed = null;
            }
          }
        }

        if (mode === "carry_over") {
          return {
            mode, repo, branch, analyzed_sha: currentSha,
            prev: checkpoint,
            changed_count: changed ? changed.length : 0,
          };
        }

        // --- Build llm_view for the analysis path ---
        const tree = await ghJson(`/repos/${repo}/git/trees/${branch}?recursive=1`);
        const blobs = (tree.tree || []).filter(t => t.type === "blob");
        const paths = blobs.map(t => t.path);
        // Audit wiring concentrates in routes/controllers/middleware and the
        // app entry point, so those rank first in the snapshot.
        const AUDIT_HOT = /(route|controller|handler|endpoint|middleware|audit|server|api|entit)/i;
        const ALWAYS = /(^|\/)(package\.json|requirements\.txt|go\.mod|Dockerfile|null(app)?\.ya?ml|\.nullplatform\/[^/]+)$/i;
        const ENTRY = /(^|\/)(src\/)?(index|main|app|server)\.[cm]?[jt]sx?$|(^|\/)(app|main)\.py$|(^|\/)main\.go$/i;
        const SKIP = /(^|\/)(node_modules|dist|build|\.git|vendor|coverage|\.next|out)\/|(\.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map|lock|min\.js|min\.css))$|package-lock\.json|pnpm-lock\.yaml|yarn\.lock/i;

        const changedSet = new Set(changed || []);
        const findingFiles = new Set((checkpoint && checkpoint.findings || []).map(f => f.file).filter(Boolean));
        const score = (p) => {
          if (SKIP.test(p)) return -1;
          if (scope !== "full" && (changedSet.has(p) || findingFiles.has(p))) return 5;
          if (ENTRY.test(p)) return 4;
          if (AUDIT_HOT.test(p)) return 3;
          if (ALWAYS.test(p)) return 3;
          return 0;
        };
        const ranked = blobs
          .map(b => ({ path: b.path, size: b.size || 0, s: score(b.path) }))
          .filter(b => b.s > 0 && b.size < 200000)
          .sort((a, b) => b.s - a.s || a.size - b.size)
          .slice(0, 30);

        const PER_FILE = 12000, TOTAL = 90000;
        let used = 0;
        const files = [];
        for (const f of ranked) {
          if (used >= TOTAL) break;
          const content = await ghRaw(`/repos/${repo}/contents/${encodeURIComponent(f.path).replace(/%2F/g, "/")}?ref=${branch}`);
          if (content === null) continue;
          const clipped = content.slice(0, Math.min(PER_FILE, TOTAL - used));
          used += clipped.length;
          files.push({ path: f.path, truncated: content.length > clipped.length, content: clipped });
        }

        const treeView = paths.filter(p => !SKIP.test(p)).slice(0, 400).join("\n");
        const scopeNote = scope === "full"
          ? "FULL AUDIT: no previous checkpoint (or forced)."
          : scope === "verify_fix"
            ? `FIX VERIFICATION: this check FAILED at commit ${checkpoint.sha.slice(0,7)}. Changed files since then: ${(changed||[]).join(", ") || "(none)"}.`
            : `DIFF-SCOPED AUDIT: check passed at ${checkpoint.sha.slice(0,7)}; re-checking because of ${(changed||[]).length} changed file(s) and/or ${ownFlags.length} data flag(s).`;
        const llm_view = [
          `## Repository: ${repo} (branch: ${branch}, commit: ${currentSha.slice(0,7)}) — application "${app.name}"`,
          ``, `### Analysis scope`, scopeNote, ``,
          `### Full file tree (${paths.length} files)`,
          "```", treeView, "```",
          ``,
          `### Selected file contents (${files.length} files)`,
          ...files.map(f => `\n--- ${f.path}${f.truncated ? " (truncated)" : ""} ---\n${f.content}`),
        ].join("\n");

        return {
          mode: "analyze", scope, repo, branch, analyzed_sha: currentSha,
          prev: checkpoint, changed_count: changed ? changed.length : null,
          total_files: paths.length,
          prev_findings_view: (checkpoint && checkpoint.findings || []).map(f => `- ${f.file || f.entity}: ${f.issue}`).join("\n") || "(none)",
          llm_view,
        };
    error_handling:
      fallback_step: resolve_failure_gather

  - id: route
    type: decider
    plugin_type: conditional
    name: "Carry-over or analyze?"
    config:
      expression: "steps.gather.outputs.mode == 'analyze'"

  - id: progress_analyzing
    type: module
    plugin_type: np-checklist-item-progress
    name: "Heartbeat: auditing entity configuration"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      message:       "Auditing entity audit configuration (${{ steps.gather.outputs.scope }}) with AI…"

  - id: audit_agent
    type: module
    plugin_type: claude-code-agent
    name: "Audit entity configuration coverage"
    config:
      model: claude-opus-4-8
      maxIterations: 5
      systemPrompt: |
        You are the audit-coverage auditor for nullplatform's engineering
        platform. Every HTTP write (POST/PUT/PATCH/DELETE) served by an
        internal API must produce an audit event that flows producer →
        audit-enhancer → customers_lake. Your job: given ONE application's
        repository snapshot plus deterministic pipeline signals, decide
        whether the entities this application writes are correctly configured
        for auditing. Do not use tools; respond directly with your final
        answer.

        How entity names are derived (framework-specific — identify which one
        this repo uses before judging):
        - Fastify + @nullplatform/server-audit: OPT-IN per route via
          `config.audit` ({ enabled: true, entity, id resolver }). A write
          route without config.audit produces NO audit event. Field
          validation is blocking and silent: a missing mandatory field means
          the event is never published.
        - Express + np-api-js inspector: OPT-OUT. Every write is audited and
          the entity name is inferred from the FIRST path segment of the URL.
          GETs are not audited. A route can disable with `audit.enabled:
          false`.
        - Hand-rolled (main-service-api): entity derived with an
          even/odd URL-segment rule.
        - Hand-rolled (workflow-api): explicit regex map (ENTITY_MAP) with a
          `workflow_<segment>` fallback for unmatched paths.

        An entity is correctly configured when three sides agree:
        A. producer emits the event with mandatory fields,
        B. the enhancer's entityConfig handles the name (STANDARD needs a
           readable GET /<entity>/<id>; SELF_CONTAINED enriches from the
           body/snapshot; NRN from the nrn), plus a `clients` entry when the
           entity lives on a non-default host. Note the map has a `default`
           entry: an entity with no entry of its own is NOT automatically
           misconfigured, it gets the default STANDARD treatment — the finding
           is only real when that GET cannot work (no read endpoint, no grant,
           wrong host),
        C. the enhancer's service account holds a read grant (the probe
           results are the ground truth for this side — trust them over any
           inference).

        The snapshot header states the ANALYSIS SCOPE:
        - FULL AUDIT: judge the whole repo.
        - DIFF-SCOPED AUDIT: the check passed at a previous commit; focus on
          whether the CHANGED files (new/modified routes) break audit
          coverage, and on the data flags. Do not re-litigate unchanged code.
        - FIX VERIFICATION: the check previously FAILED with the findings
          listed; your PRIMARY job is deciding whether each was resolved,
          filling `resolved_findings`, then checking for new issues.

        Judgment guidelines:
        - The single most important thing data cannot see: write routes that
          produce NO audit event. Enumerate the repo's write routes, apply the
          framework's derivation rule, and predict the entity name each will
          emit. Cross-check predicted names against the enhancer
          entityConfig keys — but only when the signals do NOT report the
          entityConfig as untrusted or unavailable; when they do, the key list
          proves nothing and absence is not evidence.
        - How to read the probe table. Every verdict it can carry:
          - `ok`: 200 on the default host, side C proven.
          - `answers_on_alt_host`: 404 on the default host, 200 on another one.
            Legitimate when the enhancer has a `clients` entry routing the
            entity there — confirm on the app.js excerpt, and report a finding
            only when the excerpt IS present and shows no such entry. If the
            excerpt is unavailable this stays unverified and is not a finding.
          - `wrong_host`: the clients map was read and has no entry for this
            entity, so the enhancer will only ever call the default host, which
            404s. This one is a finding.
          - `id_or_endpoint_missing`: 404 everywhere — wrong entity_id or no
            read endpoint (needs an idRemapper, or a SELF_CONTAINED entry).
          - `missing_grant`: 401/403, the service account cannot read it.
          - `upstream_error_dlq_risk`: 5xx, the most urgent finding.
          - `not_fetched_by_design`: the entityConfig entry is SELF_CONTAINED or
            `ignore: true`, so the enhancer never issues this GET. NOT probed
            and NOT a finding — enrichment comes from the event body. Do not
            claim a missing read endpoint for these; a 404 would be expected.
          - `probe_unreachable`, `no_sample_id`, `skipped_unsafe_id`,
            `skipped_not_probeable`: the probe could not run (no HTTP response,
            no sample id in the lake window, an id or a name this check cannot
            put in a URL). Side C is UNVERIFIED for that entity — say so, do
            not read it as either healthy or broken.
          - `skipped_unsafe_name`: the entity name carries characters outside
            the audit naming convention AND the enhancer does not configure it.
            That name itself is the finding.
        - Degraded sources are NOT findings. They say a source could not be
          read; treat those sides as unverified and say so. The probe table is
          only exhaustive if no degraded source says otherwise.
        - The lake signals are organization-wide: an entity in them that this
          application does not write is context, not a finding against it.
        - Tolerated-401 configs (ignoreStatusCodes) avoid the DLQ but leave
          the entity degraded forever — flag them as findings, not as ok.
        - If this application serves no HTTP writes at all (worker, frontend),
          answer not_applicable and say why in one sentence.
        - Every finding names a concrete file or entity, one-sentence issue,
          one-sentence concrete fix.
        - fix_instructions_md must be a short markdown recipe actionable by a
          coding agent WITHOUT further context. Empty string when passed.
        - The snapshot is partial: never invent file contents you were not
          shown. If the selected files are insufficient to prove a problem,
          lean towards passed and say what you could not verify.
      userPrompt: |
        Application audit-coverage check.

        Previous findings (relevant in FIX VERIFICATION scope):
        ${{ steps.gather.outputs.prev_findings_view }}

        Deterministic pipeline signals (enhancer config, lake, probe):

        ${{ steps.signals.outputs.signals_view }}

        Repository snapshot:

        ${{ steps.gather.outputs.llm_view }}
      outputSchema:
        type: object
        required: [status, summary]
        properties:
          status: { type: string, enum: [passed, failed, not_applicable] }
          summary: { type: string, description: "≤60 words: the verdict and its single most important reason" }
          findings:
            type: array
            items:
              type: object
              required: [issue, fix]
              properties:
                area: { type: string, enum: [unaudited_route, name_mismatch, missing_entity_config, missing_grant, wrong_host, needs_id_remapper, needs_self_contained, degraded_entity, dlq_risk, missing_mandatory_field, other] }
                entity: { type: string }
                file: { type: string }
                issue: { type: string }
                fix: { type: string }
          resolved_findings:
            type: array
            items:
              type: object
              required: [issue, resolution]
              properties:
                entity: { type: string }
                file: { type: string }
                issue: { type: string }
                resolution: { type: string }
          entities:
            type: array
            description: "Write entities this application emits (observed or predicted from routes)"
            items:
              type: object
              required: [entity, verdict]
              properties:
                entity: { type: string }
                source: { type: string, description: "route or mechanism that produces it" }
                verdict: { type: string, enum: [ok, unaudited, misconfigured, unverified] }
          fix_instructions_md: { type: string }
    error_handling:
      fallback_step: resolve_failure_agent

  - id: resolve
    type: module
    plugin_type: code-exec
    name: "Log findings + resolve item"
    inputs:
      callbackUrl:      "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken:    "${{ steps.trigger.outputs.callbackToken }}"
      check_id:         "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:          "${{ steps.trigger.outputs.itemId }}"
      verdict:          "${{ steps.audit_agent.outputs }}"
      repo:             "${{ steps.gather.outputs.repo }}"
      scope:            "${{ steps.gather.outputs.scope }}"
      analyzed_sha:     "${{ steps.gather.outputs.analyzed_sha }}"
      changed_count:    "${{ steps.gather.outputs.changed_count }}"
      data_flags:       "${{ steps.signals.outputs.data_flags }}"
      degraded_sources: "${{ steps.signals.outputs.degraded_sources }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com"]
      code: |
        const { callbackUrl, callbackToken, check_id, item_id, verdict, repo,
                scope, analyzed_sha, changed_count, data_flags, degraded_sources } = $item;
        const itemId = check_id || item_id || "audit_entity_check";
        const H = { authorization: `Bearer ${callbackToken}`, "content-type": "application/json" };
        const post = (url, body) => fetch(url, { method: "POST", headers: H, body: JSON.stringify(body) });
        const patch = (url, body) => fetch(url, { method: "PATCH", headers: H, body: JSON.stringify(body) });

        const v = verdict || {};
        const na = v.status === "not_applicable";
        const status = v.status === "failed" ? "failed" : "passed";
        const findings = v.findings || [];
        const resolved = v.resolved_findings || [];
        const entities = v.entities || [];
        const dataFlags = Array.isArray(data_flags) ? data_flags : [];
        const degraded = Array.isArray(degraded_sources) ? degraded_sources : [];
        const analysisScope = scope || "full";
        const sha7 = (analyzed_sha || "").slice(0, 7);

        for (const f of resolved) {
          await post(`${callbackUrl}/log`, { level: "info", message: `Resolved: ${f.entity || f.file || ""} — ${f.issue} → ${f.resolution}` }).catch(() => null);
        }
        for (const f of findings) {
          await post(`${callbackUrl}/log`, {
            level: status === "failed" ? "warning" : "info",
            message: `[${f.area || "other"}] ${f.entity || f.file || ""}: ${f.issue} — Fix: ${f.fix}`,
          }).catch(() => null);
        }
        for (const d of degraded) {
          await post(`${callbackUrl}/log`, { level: "warning", message: `Degraded signal source: ${d}` }).catch(() => null);
        }
        await post(`${callbackUrl}/log`, {
          level: "info",
          message: na ? `Check not applicable — treated as passed.` : `Verdict (${analysisScope} @ ${sha7}): ${v.status}. ${v.summary || ""}`,
        }).catch(() => null);

        const ICON = { ok: "✅", unaudited: "🔇", misconfigured: "⚠️", unverified: "❔" };
        const mdEntities = entities.length
          ? "\n**Entidades de escritura de esta aplicación:**\n" + entities.map(e =>
              `- ${ICON[e.verdict] || "•"} \`${e.entity}\` (${e.verdict})${e.source ? ` — ${e.source}` : ""}`).join("\n")
          : "";
        const mdResolved = resolved.length
          ? "\n**Findings resueltos desde el último deploy:**\n" + resolved.map(f => `- ✅ \`${f.entity || f.file || ""}\` — ${f.issue}\n  - ${f.resolution}`).join("\n")
          : "";
        const mdFindings = findings.length
          ? "\n**Findings:**\n" + findings.map(f => `- \`${f.entity || f.file || ""}\` [${f.area || "other"}] — ${f.issue}\n  - **Fix:** ${f.fix}`).join("\n")
          : "";
        const mdFlags = dataFlags.length
          ? "\n**Señales determinísticas:**\n" + dataFlags.map(f => `- ${f.text}`).join("\n")
          : "";
        const mdDegraded = degraded.length
          ? "\n**Fuentes degradadas** (no se pudieron leer; los lados que cubren quedan sin verificar):\n" + degraded.map(f => `- ${f}`).join("\n")
          : "";
        const mdFix = (status === "failed" && v.fix_instructions_md)
          ? `\n\n#### How to fix\n${v.fix_instructions_md}`
          : "";
        const scopeLabel = analysisScope === "full" ? "análisis completo"
          : analysisScope === "verify_fix" ? "verificación de fixes"
          : `incremental (${changed_count ?? "?"} archivos cambiados)`;
        const markdown = [
          `### Audit coverage — ${na ? "N/A" : status.toUpperCase()}`,
          ``,
          `Repo: \`${repo}\` · 🔎 ${scopeLabel} @ \`${sha7}\``,
          ``,
          v.summary || "",
          mdEntities, mdFlags, mdDegraded, mdResolved, mdFindings, mdFix,
        ].join("\n");

        const message = na
          ? `N/A: ${v.summary || "application serves no audited writes"}`
          : `${status === "passed" ? "OK" : `${findings.length} issue(s)`} [${scopeLabel}]: ${(v.summary || "").slice(0, 160)}`;

        const details = {
          markdown, check_id: itemId, findings,
          analyzed_sha, scope: analysisScope,
          entities: entities.map(e => ({ ...e })),
        };

        const r = await patch(callbackUrl, { status, message, details });
        if (!r.ok) throw new Error(`resolve ${itemId} -> ${r.status}: ${await r.text()}`);
        return { resolved: true, status, findings: findings.length, scope: analysisScope };

  - id: resolve_carryover
    type: module
    plugin_type: code-exec
    name: "Carry over previous verdict (no relevant changes, no data flags)"
    inputs:
      callbackUrl:      "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken:    "${{ steps.trigger.outputs.callbackToken }}"
      check_id:         "${{ steps.trigger.outputs.inputs.check_id }}"
      item_id:          "${{ steps.trigger.outputs.itemId }}"
      repo:             "${{ steps.gather.outputs.repo }}"
      analyzed_sha:     "${{ steps.gather.outputs.analyzed_sha }}"
      changed_count:    "${{ steps.gather.outputs.changed_count }}"
      prev:             "${{ steps.gather.outputs.prev }}"
      degraded_sources: "${{ steps.signals.outputs.degraded_sources }}"
    config:
      network:
        allowedHosts: ["api.nullplatform.com"]
      code: |
        const { callbackUrl, callbackToken, check_id, item_id, repo,
                analyzed_sha, changed_count, prev, degraded_sources } = $item;
        const itemId = check_id || item_id || "audit_entity_check";
        const H = { authorization: `Bearer ${callbackToken}`, "content-type": "application/json" };
        const p = prev || {};
        // Only a passed/failed checkpoint reaches this step, but the item must
        // resolve even if the stamp ever arrives incomplete.
        const prevStatus = p.status === "failed" ? "failed" : "passed";
        const sha7 = (analyzed_sha || "").slice(0, 7);
        const prev7 = (p.sha || "").slice(0, 7);
        const n = changed_count || 0;
        const degraded = Array.isArray(degraded_sources) ? degraded_sources : [];

        const message = `≡ Sin cambios relevantes ni señales nuevas desde ${prev7} (${n} archivo(s) tocados) — se mantiene ${prevStatus.toUpperCase()}`;
        const mdDegraded = degraded.length
          ? "\n**Fuentes degradadas** (no se pudieron leer; no afectan el carry-over):\n" + degraded.map(f => `- ${f}`).join("\n") + "\n"
          : "";
        const markdown = [
          `### Audit coverage — ${prevStatus.toUpperCase()} (carry-over)`,
          ``,
          `Repo: \`${repo}\` · ≡ sin re-análisis: los ${n} archivo(s) cambiados desde \`${prev7}\` no tocan el wiring de audit y no hay señales nuevas del pipeline.`,
          mdDegraded,
          ``,
          `_Último análisis real (@ \`${prev7}\`):_`,
          ``,
          p.markdown || "(sin detalle previo)",
        ].join("\n");

        await fetch(`${callbackUrl}/log`, { method: "POST", headers: H, body: JSON.stringify({
          level: "info", message: `Carry-over from approval ${p.approval_id} @ ${prev7}: ${n} changed file(s), none audit-relevant, no data flags.`,
        }) }).catch(() => null);

        const r = await fetch(callbackUrl, { method: "PATCH", headers: H, body: JSON.stringify({
          status: prevStatus, message,
          details: {
            markdown, check_id: itemId, findings: p.findings || [],
            entities: p.entities || [],
            analyzed_sha, scope: "carry_over", carried_from: p.sha,
          },
        }) });
        if (!r.ok) throw new Error(`carry-over resolve ${itemId} -> ${r.status}: ${await r.text()}`);
        return { resolved: true, status: prevStatus, scope: "carry_over" };

  # Fallbacks — the item resolves with the raw error so the run never hangs.
  - id: resolve_failure_signals
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve skipped (signal collection crashed)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      # `skipped`, not `failed`: what broke is this workflow's auxiliary
      # collector, and an application must not fail an audit-coverage gate
      # because a signal source was unavailable.
      status:        skipped
      message:       "Audit-coverage check skipped: pipeline signals could not be collected: ${{ steps.signals.error.message }}"
      details:
        markdown: "Signal collection (enhancer config / lake / probe) crashed before the audit ran, so the check could not be evaluated. Error: ${{ steps.signals.error.message }}"

  - id: resolve_failure_gather
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve failed (checkpoint/repo fetch crashed)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        failed
      message:       "Audit-coverage check could not prepare the analysis: ${{ steps.gather.error.message }}"
      details:
        markdown: "The analysis failed before auditing. Error: ${{ steps.gather.error.message }}"

  - id: resolve_failure_agent
    type: module
    plugin_type: np-checklist-item-resolve
    name: "Resolve failed (audit agent crashed)"
    inputs:
      callbackUrl:   "${{ steps.trigger.outputs.callbackUrl }}"
      callbackToken: "${{ steps.trigger.outputs.callbackToken }}"
      status:        failed
      message:       "Audit-coverage agent crashed: ${{ steps.audit_agent.error.message }}"
      details:
        markdown: "The AI audit step failed. Error: ${{ steps.audit_agent.error.message }}"

connections:
  - { id: c1, from: trigger,            to: progress }
  - { id: c2, from: progress,           to: lake_new_entities }
  - { id: c3, from: lake_new_entities,  to: lake_empty_rows }
  - { id: c4, from: lake_empty_rows,    to: signals }
  # Each degraded re-entry continues to its query's own successor, so one dead
  # lake query never takes the other one (or the run) with it.
  - { id: c5, from: lake_new_degraded,  to: lake_empty_rows }
  - { id: c6, from: lake_empty_degraded, to: signals }
  - { id: c7, from: signals,            to: gather }
  - { id: c8, from: gather,             to: route }
  - { id: c9, from: route,              to: progress_analyzing, source_port: "true" }
  - { id: c10, from: route,             to: resolve_carryover,  source_port: "false" }
  - { id: c11, from: progress_analyzing, to: audit_agent }
  - { id: c12, from: audit_agent,       to: resolve }
  # Dormant edges: a fallback only routes over a DECLARED connection, and
  # `condition: "false"` keeps the edge from firing on the happy path (it also
  # keeps the fallback tails out of the entry-point set).
  - { id: c13, from: lake_new_entities, to: lake_new_degraded,   condition: "false" }
  - { id: c14, from: lake_empty_rows,   to: lake_empty_degraded, condition: "false" }
  - { id: c15, from: signals,     to: resolve_failure_signals, condition: "false" }
  - { id: c16, from: gather,      to: resolve_failure_gather,  condition: "false" }
  - { id: c17, from: audit_agent, to: resolve_failure_agent,   condition: "false" }
