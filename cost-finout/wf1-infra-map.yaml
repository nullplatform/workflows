key: cost-finout-infra-map
id: cost-finout-infra-map
name: "Cost Finout — wf1 Censo de Sujetos"
description: "Diario: censo de scopes prod en k8s NP → upsert de la parte de SUJETO de infrastructure_cost (entity/nrn/dims/denormalizados). SIN cluster: el mapping scope→cluster es OBSERVADO y lo escribe wf3 desde Datadog (source: observed). Sin children ni VMs: lake emite items y np-api-call fan-outea el PATCH."

steps:
  - id: manual
    type: trigger
    pluginType: manual
    config: {}
  # RETIRADO 2026-08-26: el censo ahora lo hace wf3 directo del lake y los
  # nombres van denormalizados en los hechos (infrastructure_cost_daily).
  # Sin cron; queda solo el trigger manual por si hiciera falta re-censar.

  # 1. Scopes prod activos en GKE/AKS con dimensiones y jerarquia — una fila
  #    por scope, emitida como item (ids casteados a string en SQL: el schema
  #    los declara string y el catalogo no coerciona).
  - id: list_scopes
    type: module
    pluginType: np-lake-query
    joinStrategy: any
    config:
      apiKey: "${{ secrets.COST_NP_API_KEY }}"
      maxRows: 10000
      sql: "SELECT toString(s.id) id, s.name name, s.provider provider, toString(s.application_id) app_id, n.namespace_name ns_name, app.app_name app_name, toString(app.namespace_id) ns_id, toString(n.account_id) acc_id, a.account_name acc_name, maxIf(sd.value_slug, sd.dimension_slug='cloud') cloud, maxIf(sd.value_slug, sd.dimension_slug='country') country, maxIf(sd.value_slug, sd.dimension_slug='environment') environment FROM core_entities_scope AS s FINAL JOIN core_entities_application AS app FINAL ON s.application_id = app.app_id JOIN core_entities_namespace AS n FINAL ON app.namespace_id = n.namespace_id JOIN core_entities_account AS a FINAL ON n.account_id = a.account_id JOIN core_entities_scope_dimension AS sd FINAL ON sd.scope_id = s.id WHERE s._deleted=0 AND s.status='active' AND sd._deleted=0 AND s.provider IN ('GOOGLE:WEB_POOL:GKE','AZURE:WEB_POOL:AKS') GROUP BY id, name, provider, app_id, ns_name, app_name, ns_id, acc_id, acc_name HAVING environment='prod'"

  # 2. Upsert por scope: fan-out por item, PATCH parcial (solo campos de
  #    sujeto — merge top-level preserva lo de wf3).
  #    TERMINAL A PROPOSITO: los ~2800 response bodies no deben viajar como
  #    items a un paso siguiente (cap de payload de activity — poison pill).
  #    El resumen vive en metadata.fanOut del step (done/total/failed).
  - id: upsert
    type: module
    pluginType: np-api-call
    dependsOn: [list_scopes]
    metadata:
      fanOutPerItem: true
    inputs:
      path: "/catalog/instances/infrastructure_cost/scope-${{ $item.id }}"
      body:
        id: "scope-${{ $item.id }}"
        entity_type: scope
        entity_id: "${{ $item.id }}"
        nrn: "organization=987889794:account=${{ $item.acc_id }}:namespace=${{ $item.ns_id }}:application=${{ $item.app_id }}"
        entity_name: "${{ $item.name }}"
        application_name: "${{ $item.app_name }}"
        namespace_name: "${{ $item.ns_name }}"
        account_name: "${{ $item.acc_name }}"
        application_id: "${{ $item.app_id }}"
        account_id: "${{ $item.acc_id }}"
        namespace_id: "${{ $item.ns_id }}"
        dimensions:
          cloud: "${{ $item.cloud }}"
          country: "${{ $item.country }}"
          environment: "${{ $item.environment }}"
    config:
      method: PATCH
      path: "/catalog/instances/infrastructure_cost/placeholder"
      query:
        upsert: "true"
      apiKey: "${{ secrets.COST_NP_API_KEY }}"
      failOnHttpError: false
      timeoutMs: 20000

connections:
  - { id: t1, from: manual, to: list_scopes }
