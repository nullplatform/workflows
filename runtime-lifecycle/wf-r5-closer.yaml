# Lambda Runtime Lifecycle — Closer. Lake-first DAILY job (08:00 Buenos
# Aires, also manual), FLAT writes.
#
# REDESIGN v4 (owner-decided, 2026-07-21): the closeability VERDICT is now
# computed ENTIRELY IN THE LAKE QUERY. `lake_candidates` joins the live
# lambda-runtime action items ⋈ core_entities_scope FINAL ⋈ the
# lambda_runtimes catalog ⋈ the scope's newest ACTIVE deployment and returns
# a per-item `verdict` (close_compliant / close_scope_gone / still_open).
# There is NO live `/scope/:id` or `/deployment` re-verification pass anymore
# (the v3 fetch_scope / fetch_deployments / verdicts steps are GONE), and no
# separate catalog read (the compliance status comes from the catalog JOIN).
# `prep` reads the verdict, double-guards the human-owned + stray cases, and
# builds the close requests; then the same flat close_item → zip_closed →
# close_comment → summary chain runs as before.
#
# ACCEPTED TRADEOFF (owner decision, 2026-07-21 — documented explicitly per
# the owner's instruction): closing purely on lake data trades a small,
# self-healing risk of a FALSE close for a much simpler workflow. The lake has
# sync lag and its timestamp columns are stringly-typed in mismatched formats
# ('YYYY-MM-DD HH:MM:SS.ffffff' vs the ISO 'Z' stamp) — the verdict parses
# them with ClickHouse's parseDateTimeBestEffort, which is lenient but not
# infallible. A false close is NOT permanent: `close_item` only closes an item
# that is LIVE, and the lake query's anti-join only sees LIVE items — so once
# an item is closed it drops out of this query. If a close turns out wrong
# (the scope was not really compliant), the DAILY scanner (wf-r2, 07:00) sees
# a scope still on a deprecated runtime with no live item and OPENS A NEW ONE
# within 24h. That <24h self-heal window is WHY query-only closing is
# acceptable here — the closer never has to be perfect, only mostly right.
#
# The closer only CLOSES — it never reopens a resolved item (that's wf-r3's
# onResolved gate, at resolve time). Human-owned states (deferred/pending_*)
# are excluded IN THE QUERY (status = 'open') AND double-guarded in `prep`.
# Stray items with no metadata.scope_id are surfaced (bucketed `stray`) and
# NEVER auto-closed — a close must rest on a scope, and there is none.
#
# close_item / close_comment are hardened (`failOnHttpError: true` → a >=400
# is a per-iteration FAILURE), NON-retryable POSTs, and ORDERED close→comment
# for a reason: the lake query only returns LIVE items, so once an item is
# CLOSED it never re-appears as a candidate. Closing FIRST means a failed
# comment leaves a closed item with a missing (cosmetic) comment — no
# duplicate. Commenting first would risk a DUPLICATE comment on every run
# where the close then fails. `zip_closed` pairs comments to only the items
# that ACTUALLY closed (2xx). Neither POST retries (a lost-ack close/comment
# retry re-hits the same item; a missed close/comment self-heals next DAILY
# run — idempotency + the daily cadence win over availability).
#
# Fan-out mechanism + engine gaps (same as wf-r2-scanner.yaml — see that
# file's header for the full explanation):
#  - `forEach.spreadItem` merges each request object's `{path, method, body}`
#    into the per-iteration `np-api-call` inputs (inputs override config), so
#    one generic np-api-call step parameterizes itself per item. The static
#    shields (apiKey, failOnHttpError) stay in config.
#  - forEach has NO `error_handling.fallback_step` — a settled child failure
#    is ABSORBED as a `{}` slot in the results array, in the SAME position as
#    its input (forEach preserves order). Every pass is FOLLOWED by a pure
#    `code-exec` that detects failures INDEX-ALIGNED, treating BOTH shapes as
#    a failure: the absorbed `{}` slot AND a `{status>=400}` response slot.
#  - deciders evaluate `items[0]` only, so a decider must never split a batch
#    — `prep`/`zip_closed` partition into arrays and each action gets its OWN
#    forEach pass.
#
# Per-org configuration (config entries on folder /action-items/runtime-lifecycle):
#   NP_API_KEY (secret)         — NP API key
#   NP_ORGANIZATION_ID (var)    — organization id
#   RUNTIME_WARN_DAYS (var)     — days-to-deprecation "expiring" threshold
#                                 (default 31). The query's compliance verdict
#                                 treats a runtime deprecating within this
#                                 window as NOT ok/closeable, so the closer and
#                                 the scanner agree on exactly one threshold.
id: runtime_lifecycle_closer
name: "Runtime Lifecycle — Closer"
description: >
  Daily job (08:00, also manual) that detects closeable lambda-runtime action
  items via ONE lake query which computes the close verdict in-query (scope
  gone, or runtime now catalog-supported with a fresh active deployment), then
  closes the compliant/gone ones and comments — all via flat per-item API
  passes, no sub-workflow fan-out and no live re-verification.
path: "/action-items/runtime-lifecycle"

steps:
  - id: start_manual
    type: trigger
    plugin_type: manual
    name: "Run Closer Now"
    config:
      description: "Detects closeable lambda-runtime action items via one lake query (verdict computed in-query) and closes them."

  - id: start_cron
    type: trigger
    plugin_type: cron
    name: "Daily 08:00"
    config:
      schedule: "0 8 * * *"
      timezone: "America/Argentina/Buenos_Aires"

  # ── ONE lake query: every LIVE (open) lambda-runtime action item, joined ──
  # against its scope, the lambda_runtimes catalog (by the scope's CURRENT
  # runtime), and the scope's newest ACTIVE deployment — and a per-item
  # `verdict` computed IN QUERY:
  #   close_scope_gone : the scope row is PRESENT in the lake with status
  #                      deleted/stopped (a tombstone). Pure ABSENCE from the
  #                      lake (join missed) is still_open — a transient
  #                      replication gap must never read as a deletion.
  #   close_compliant  : the CURRENT runtime is catalog-supported AND not
  #                      expiring within RUNTIME_WARN_DAYS, AND the newest
  #                      active deployment's created_at is at/after the item's
  #                      runtime_patched_at stamp (or scope.updated_at when the
  #                      item was never patched by wf-r4).
  #   still_open       : anything else (leave open, zero side effects).
  # NB: timestamps are compared with parseDateTimeBestEffort (the lake stores
  # them stringly in mismatched formats) — see the ACCEPTED TRADEOFF header.
  # Verified live against a demo organization, 2026-07-21, via
  # ~/workspace/null/np-claude-skills/src/skills/np-lake/scripts/ch_query.sh
  # (read-only).
  #
  # Same gotchas as wf-r2-scanner.yaml's lake query (kept as comments so the
  # next author doesn't rediscover them the hard way):
  #  - `core_entities_metadata` carries TWO rows per org for
  #    (entity='organization', metadata_type='lambda_runtimes'): the actual
  #    instance (id = the org id) and the metadata SPECIFICATION (id = a uuid,
  #    `data` NULL). Filtering `id = '<org id>'` is required — otherwise the
  #    catalog join silently returns empty columns (no error).
  #  - Never alias an extracted column `id` inside a subquery that also filters
  #    `WHERE id = ...` on the same source table — ClickHouse resolves the
  #    WHERE against the alias and the join silently returns zero rows.
  #  - The `ARRAY JOIN ... AS rt` alias must differ from the subquery's own
  #    alias (`cat`) or the join silently breaks (empty `cat.*` columns).
  - id: lake_candidates
    type: module
    plugin_type: np-lake-query
    name: "Live Lambda-Runtime Items + In-Query Verdict (lake)"
    # Reached from either trigger.
    join_strategy: any
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      sql: |
        SELECT
          item.item_id AS item_id,
          item.item_status AS item_status,
          item.scope_id AS scope_id,
          s.runtime AS live_runtime,
          multiIf(
            s.scope_present = 1 AND s.scope_status IN ('deleted', 'stopped'), 'close_scope_gone',
            ifNull(
              (cat.status != '' AND cat.status != 'deprecated'
                AND (cat.deprecation_date = ''
                     OR toDateOrNull(cat.deprecation_date) > today() + ${{ vars.RUNTIME_WARN_DAYS || 31 }}))
              AND (dep.active_created_at IS NOT NULL
                AND dep.active_created_at >= parseDateTimeBestEffortOrNull(
                  if(item.runtime_patched_at != '', item.runtime_patched_at, s.scope_updated_at))),
              0),
            'close_compliant',
            'still_open'
          ) AS verdict
        FROM (
          SELECT
            action_item_id AS item_id, status AS item_status,
            JSONExtractString(metadata, 'scope_id') AS scope_id,
            JSONExtractString(metadata, 'runtime_patched_at') AS runtime_patched_at
          FROM governance_action_items_action_items FINAL
          WHERE _deleted = 0 AND JSONExtractString(labels, 'workflow_type') = 'lambda-runtime'
            AND status = 'open'
        ) AS item
        LEFT JOIN (
          SELECT toString(id) AS scope_id, 1 AS scope_present, status AS scope_status,
                 toString(updated_at) AS scope_updated_at,
                 JSONExtractString(capabilities, 'serverless_runtime', 'id') AS runtime
          FROM core_entities_scope FINAL
          WHERE _deleted = 0
        ) AS s ON s.scope_id = item.scope_id
        LEFT JOIN (
          SELECT
            JSONExtractString(rt, 'id') AS runtime_id,
            JSONExtractString(rt, 'status') AS status,
            JSONExtractString(rt, 'deprecation_date') AS deprecation_date
          FROM core_entities_metadata FINAL
          ARRAY JOIN JSONExtractArrayRaw(coalesce(data, ''), 'runtimes') AS rt
          WHERE entity = 'organization' AND metadata_type = 'lambda_runtimes'
            AND id = '${{ vars.NP_ORGANIZATION_ID }}' AND _deleted = 0
        ) AS cat ON cat.runtime_id = s.runtime
        LEFT JOIN (
          SELECT toString(scope_id) AS scope_id, max(created_at) AS active_created_at
          FROM core_entities_deployment FINAL
          -- status='finalized' is REQUIRED alongside status_in_scope='active':
          -- the lake carries failed/deleted/deleting rows still flagged active
          -- in scope (observed live: 8 failed+active). Only a deployment that
          -- actually FINISHED counts as compliance evidence.
          WHERE _deleted = 0 AND status_in_scope = 'active' AND status = 'finalized'
          GROUP BY scope_id
        ) AS dep ON dep.scope_id = item.scope_id

  # ── Prep: read the in-query verdict, build the close requests ──────────
  # Double-guards two safety cases the verdict cannot own alone:
  #   - item_status != 'open' → skipped (human-owned; already excluded by the
  #     query WHERE, guarded here too).
  #   - no scope_id → `stray`: surfaced for a human, NEVER auto-closed (a close
  #     must rest on a scope, and the verdict would read scope_gone for it).
  # Everything else follows the verdict. Emits index-aligned close requests +
  # `closeable_meta` (item_id, verdict, comment_content). A SMALL payload per
  # item — the catalog/scope/deploy state was already resolved in the query.
  - id: prep
    type: module
    plugin_type: code-exec
    name: "Prep: Read Verdict + Build Close Requests"
    metadata: { fanOutPerItem: false }
    inputs:
      rows: "${{ steps.lake_candidates.outputs.rows }}"
    config:
      code: |
        var MAX_FANOUT = 200;
        var rows = inputs.rows || [];
        function closeReq(id) {
          // POST /governance/action_item/:id/close — the API records the
          // actor; the human-readable reason rides on the comment.
          return { path: '/governance/action_item/' + id + '/close', method: 'POST', body: { actor: 'agent:runtime-lifecycle' } };
        }
        var closeItemRequests = [];
        var closeableMeta = [];
        var still_open = 0;
        var stray = 0;
        var not_open = 0;
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          // Human-owned double-guard (query already filters status='open').
          if (r.item_status !== 'open') { not_open++; continue; }
          var scopeId = r.scope_id || '';
          // Stray item with no scope reference — never closeable on lake
          // evidence alone (the verdict would say scope_gone, but there is no
          // scope to have gone). Surface it; never close.
          if (!scopeId) { stray++; continue; }
          var verdict = r.verdict;
          if (verdict === 'close_scope_gone') {
            closeItemRequests.push(closeReq(r.item_id));
            closeableMeta.push({ item_id: r.item_id, verdict: 'closed_scope_gone', comment_content: 'scope no longer active' });
          } else if (verdict === 'close_compliant') {
            closeItemRequests.push(closeReq(r.item_id));
            closeableMeta.push({ item_id: r.item_id, verdict: 'closed_compliant', comment_content: 'resolved: active deployment on ' + (r.live_runtime || '') });
          } else {
            still_open++;
          }
        }
        // total_closeable: FULL count before the safety-cap slice — kept
        // distinct from the dispatched (possibly-truncated) subset so the
        // summary reports both honestly (mirrors wf-r2-scanner).
        var total_closeable = closeItemRequests.length;
        var truncated = closeItemRequests.length > MAX_FANOUT;
        if (truncated) {
          log.warn('prep: closeable set exceeds the fan-out safety cap — truncating', {
            closeable: closeItemRequests.length, cap: MAX_FANOUT, dropped: closeItemRequests.length - MAX_FANOUT
          });
          closeItemRequests = closeItemRequests.slice(0, MAX_FANOUT);
          closeableMeta = closeableMeta.slice(0, MAX_FANOUT);
        }
        return {
          close_item_requests: closeItemRequests,
          closeable_meta: closeableMeta,
          total_live_items: rows.length,
          total_closeable: total_closeable,
          still_open: still_open,
          stray: stray,
          not_open: not_open,
          truncated: truncated
        };

  # ── Close the confirmed items ─────────────────────────────────────────
  # forEach over prep.close_item_requests. failOnHttpError:true → a >=400 is a
  # per-iteration failure, absorbed as `{}` (parallel mode); zip_closed detects
  # it by the missing 2xx status → close_failed. NO retry_policy: a lost-ack
  # close retry re-hits the same item, and a missed close self-heals next DAILY
  # run — idempotency + daily cadence over availability.
  - id: close_item
    type: module
    plugin_type: np-api-call
    name: "Close Action Item (per closeable)"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      failOnHttpError: true
      path: "/governance/action_item"
    forEach:
      expression: "${{ steps.prep.outputs.close_item_requests }}"
      itemVariable: item
      spreadItem: true
      parallel: true
      maxConcurrency: 5

  # ── Pair a comment to each item that ACTUALLY closed ──────────────────
  # Zip prep.closeable_meta × close_item results by index (forEach preserves
  # order). A close absorbed as `{}` (or a non-2xx slot) is a close_failed and
  # drops its comment — we never comment "scope deleted" on an item that is
  # still open. Emits the comment POST requests + the counts of what closed
  # (by verdict). Mirrors wf-r2-scanner's zip_ids.
  - id: zip_closed
    type: module
    plugin_type: code-exec
    name: "Zip Closed Items → Comment Requests"
    metadata: { fanOutPerItem: false }
    inputs:
      meta: "${{ steps.prep.outputs.closeable_meta }}"
      close_results: "${{ steps.close_item.outputs.items }}"
    config:
      code: |
        var meta = inputs.meta || [];
        var closes = inputs.close_results || [];
        var commentRequests = [];
        var commentAttrib = [];
        var closed_scope_gone = 0;
        var closed_compliant = 0;
        var close_failed = 0;
        var closeFailedIds = [];
        for (var i = 0; i < meta.length; i++) {
          var cr = closes[i];
          // Success is `{status, body, headers}` with a 2xx status. A failure
          // — absorbed `{}` (>=400, POST not retried) or a `{status>=400}`
          // slot were failOnHttpError false — has no 2xx status.
          var st = cr && cr.status;
          if (!(st && Number(st) < 400)) {
            close_failed++;
            closeFailedIds.push(meta[i] && meta[i].item_id);
            continue;
          }
          if (meta[i].verdict === 'closed_scope_gone') closed_scope_gone++;
          else closed_compliant++;
          commentRequests.push({
            path: '/governance/action_item/' + meta[i].item_id + '/comments',
            method: 'POST',
            body: { author: 'agent:runtime-lifecycle', content: meta[i].comment_content }
          });
          commentAttrib.push(meta[i].item_id);
        }
        return {
          comment_requests: commentRequests,
          comment_attrib: commentAttrib,
          closed_scope_gone: closed_scope_gone,
          closed_compliant: closed_compliant,
          close_failed: close_failed,
          close_failed_item_ids: closeFailedIds
        };

  # ── Comment on the items that closed ──────────────────────────────────
  # forEach over zip_closed.comment_requests. failOnHttpError:true; NO retry
  # (a lost-ack comment retry duplicates it; a missed comment is cosmetic).
  # summary buckets a failure by the missing 2xx status, index-aligned.
  - id: close_comment
    type: module
    plugin_type: np-api-call
    name: "Comment on Closed Item (per closed)"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      failOnHttpError: true
      path: "/governance/action_item"
    forEach:
      expression: "${{ steps.zip_closed.outputs.comment_requests }}"
      itemVariable: item
      spreadItem: true
      parallel: true
      maxConcurrency: 5

  # ── Summary: counts + index-aligned failure buckets ───────────────────
  # No silent caps: every failure is attributed by index alignment against the
  # request array that drove it (forEach preserves order).
  - id: summary
    type: module
    plugin_type: code-exec
    name: "Build Summary"
    metadata: { fanOutPerItem: false }
    inputs:
      total_live_items: "${{ steps.prep.outputs.total_live_items }}"
      total_closeable: "${{ steps.prep.outputs.total_closeable }}"
      still_open: "${{ steps.prep.outputs.still_open }}"
      stray: "${{ steps.prep.outputs.stray }}"
      not_open: "${{ steps.prep.outputs.not_open }}"
      truncated: "${{ steps.prep.outputs.truncated }}"
      closed_scope_gone: "${{ steps.zip_closed.outputs.closed_scope_gone }}"
      closed_compliant: "${{ steps.zip_closed.outputs.closed_compliant }}"
      close_failed: "${{ steps.zip_closed.outputs.close_failed }}"
      close_failed_item_ids: "${{ steps.zip_closed.outputs.close_failed_item_ids }}"
      comment_requests: "${{ steps.zip_closed.outputs.comment_requests }}"
      comment_attrib: "${{ steps.zip_closed.outputs.comment_attrib }}"
      comment_results: "${{ steps.close_comment.outputs.items }}"
    config:
      code: |
        // Comments: index-align close_comment results against the requests
        // that drove them. Success is `{status, body}` with a 2xx status; a
        // failure — absorbed `{}` (>=400, POST not retried) or a
        // `{status>=400}` slot — has no 2xx status.
        var creq = inputs.comment_requests || [];
        var cres = inputs.comment_results || [];
        var cattrib = inputs.comment_attrib || [];
        var comment_failed = 0;
        var commentFailedIds = [];
        for (var i = 0; i < creq.length; i++) {
          var r = cres[i];
          var st = r && r.status;
          if (!(st && Number(st) < 400)) {
            comment_failed++;
            commentFailedIds.push(cattrib[i]);
          }
        }

        return {
          live_items: Number(inputs.total_live_items) || 0,
          // closeable: FULL detected count (before any truncation slice); the
          // closed counts may be smaller when truncated is true.
          closeable: Number(inputs.total_closeable) || 0,
          closed_scope_gone: Number(inputs.closed_scope_gone) || 0,
          closed_compliant: Number(inputs.closed_compliant) || 0,
          still_open: Number(inputs.still_open) || 0,
          // stray: open items with no metadata.scope_id — surfaced for a
          // human, never auto-closed (safety invariant).
          stray: Number(inputs.stray) || 0,
          // skipped_not_open: human-owned states the query already excluded
          // (defensive double-guard count).
          skipped_not_open: Number(inputs.not_open) || 0,
          truncated: inputs.truncated === true,
          close_failed: Number(inputs.close_failed) || 0,
          close_failed_item_ids: inputs.close_failed_item_ids || [],
          comment_failed: comment_failed,
          comment_failed_item_ids: commentFailedIds
        };

  - id: log_done
    type: module
    plugin_type: log
    name: "Closer Complete"
    config:
      level: info
      message: "Runtime lifecycle closer: ${{ steps.summary.outputs.live_items }} live items, ${{ steps.summary.outputs.closeable }} closeable (${{ steps.summary.outputs.still_open }} still open, ${{ steps.summary.outputs.stray }} stray no-scope, ${{ steps.summary.outputs.skipped_not_open }} human-owned) — closed (scope gone) ${{ steps.summary.outputs.closed_scope_gone }}, closed (compliant) ${{ steps.summary.outputs.closed_compliant }}. Failures: close ${{ steps.summary.outputs.close_failed }}, comment ${{ steps.summary.outputs.comment_failed }}. (truncated=${{ steps.summary.outputs.truncated }})"

connections:
  - { id: c1, from: start_manual,    to: lake_candidates }
  - { id: c2, from: start_cron,      to: lake_candidates }
  - { id: c3, from: lake_candidates, to: prep }
  - { id: c4, from: prep,            to: close_item }
  - { id: c5, from: close_item,      to: zip_closed }
  - { id: c6, from: zip_closed,      to: close_comment }
  - { id: c7, from: close_comment,   to: summary }
  - { id: c8, from: summary,         to: log_done }

outputs:
  live_items:                "${{ steps.summary.outputs.live_items }}"
  closeable:                 "${{ steps.summary.outputs.closeable }}"
  closed_scope_gone:         "${{ steps.summary.outputs.closed_scope_gone }}"
  closed_compliant:          "${{ steps.summary.outputs.closed_compliant }}"
  still_open:                "${{ steps.summary.outputs.still_open }}"
  stray:                     "${{ steps.summary.outputs.stray }}"
  skipped_not_open:          "${{ steps.summary.outputs.skipped_not_open }}"
  truncated:                 "${{ steps.summary.outputs.truncated }}"
  close_failed:              "${{ steps.summary.outputs.close_failed }}"
  close_failed_item_ids:     "${{ steps.summary.outputs.close_failed_item_ids }}"
  comment_failed:            "${{ steps.summary.outputs.comment_failed }}"
  comment_failed_item_ids:   "${{ steps.summary.outputs.comment_failed_item_ids }}"
