# Lambda Runtime Lifecycle — Closer. Weekly job (Thursdays 08:00 Buenos
# Aires, also manual) that streams every live lambda-runtime action item and
# dispatches the per-item verification sub-workflow (wf-r5b) for each,
# passing the SAME catalog object to every call. This workflow only
# aggregates: it never talks to the scope/deployment/comment/close APIs
# itself — wf-r5b owns every side effect.
#
# The closer only CLOSES — it never reopens a resolved item (that's wf-r3's
# onResolved gate, at resolve time).
#
# Streaming-pagination pattern (CLAUDE.md § Workflow Authoring): four
# explicit nodes — `fetch_items` (np-entity-paginated-fetch, mode: stream) →
# `verify_item` (sub-workflow, one call per item) → `acc_results`
# (set-variable accumulator into `variables.results`) → `summary` (code-exec
# reading `variables.results`, never `$items`, since the `:done` envelope is
# empty). Mirrors wf-r2-scanner's own wiring (this suite's canonical
# reference), NOT the cost suite's non-streaming wf7 lake-query design.
#
# Item listing: GET /governance/action_item filtered by nrn +
# labels.workflow_type=lambda-runtime (both honored server-side). `status`
# is deliberately NOT sent as a filter — the list endpoint ignores it (same
# engine fact wf-r2b's `decide` step relies on) — so wf-r5b does its own
# status-based skip (double-guard: only `open` items are acted on).
#
# Guard: if the catalog is missing or has zero runtimes, the run stops
# before fetching a single item (catalog-sync must run first) — same guard
# as wf-r2, since wf-r5b needs the catalog to compute compliance.
#
# Per-org configuration (config entries on folder /runtime-lifecycle):
#   NP_API_KEY (secret)         — NP API key
#   NP_ORGANIZATION_ID (var)    — organization id
id: runtime_lifecycle_closer
name: "Runtime Lifecycle — Closer"
description: >
  Weekly job (Thursdays 08:00, also manual) that streams live lambda-runtime
  action items and verifies each via the per-item closer sub-workflow:
  closes items whose scope is gone or whose runtime/deployment are
  compliant, leaves the rest open.
path: "/runtime-lifecycle"
semantic_version: 1.0.0

variables:
  results:
    initialValue: []

steps:
  - id: start_manual
    type: trigger
    plugin_type: manual
    name: "Run Closer Now"
    config:
      description: "Streams live lambda-runtime action items and verifies each one's outcome."

  - id: start_cron
    type: trigger
    plugin_type: cron
    name: "Weekly Thursday 08:00"
    config:
      schedule: "0 8 * * 4"
      timezone: "America/Argentina/Buenos_Aires"

  # ── Read the catalog ONCE, before touching a single item ────────────────
  - id: read_catalog
    type: module
    plugin_type: np-api-call
    name: "Read Runtime Catalog"
    # Reached from either trigger.
    join_strategy: any
    # DECLARED inputs: np-api-call's execute() does `cfg = {...config,
    # ...ctx.inputs}` (inputs override config) — a step with no `inputs:`
    # map falls back to the predecessor's raw output object as
    # `ctx.inputs`, which clobbers request fields (e.g. `headers`) when
    # chained after another np-api-call step (live E2E finding on wf-r4's
    # fetch_scope). Shielded here too for consistency even though this
    # step's only predecessors are triggers.
    inputs:
      org_id: "${{ vars.NP_ORGANIZATION_ID }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/metadata/organization/${{ inputs.org_id }}/lambda_runtimes"
      # 404 (instance never seeded) is a valid "empty catalog" case, not a
      # hard error — the guard below handles it uniformly.
      failOnHttpError: false

  - id: catalog_guard
    type: module
    plugin_type: code-exec
    name: "Guard: Catalog Has Runtimes?"
    # Aggregate step: NEVER dispatch per upstream item (single response).
    metadata: { fanOutPerItem: false }
    inputs:
      status: "${{ steps.read_catalog.outputs.status }}"
      body: "${{ steps.read_catalog.outputs.body }}"
    config:
      code: |
        var body = inputs.body || {};
        var runtimes = Array.isArray(body.runtimes) ? body.runtimes : [];
        if (inputs.status !== 200 || runtimes.length === 0) {
          return { ok: false, catalog: null, reason: 'empty catalog — run catalog-sync first' };
        }
        return { ok: true, catalog: body, reason: null };

  # Deciders run in-sandbox (ports always known) — safe to wire.
  - id: catalog_ok
    type: decider
    plugin_type: conditional
    name: "Catalog Has Runtimes?"
    config:
      expression: "steps.catalog_guard.outputs.ok == true"

  # ── One page per invocation; downstream fans out per item in that page ──
  - id: fetch_items
    type: module
    plugin_type: np-entity-paginated-fetch
    name: "List Lambda-Runtime Action Items"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      entity: governance/action_item
      filters:
        nrn: "organization=${{ vars.NP_ORGANIZATION_ID }}"
        "labels.workflow_type": "lambda-runtime"
      limit: 100
      mode: stream

  # Per-item verification: SAME catalog object on every call (read once above).
  #
  # Failure isolation (review finding): a persistent child failure (5xx
  # after retries, a code-exec throw inside wf-r5b) must NOT kill the whole
  # sweep — without `fallback_step` it propagates as a terminal
  # WorkflowStepFailedError and every remaining item AND every later page
  # never process until next Thursday. `verify_item_failed` catches it,
  # stashes a `verification_failed` verdict, and re-enters the pagination
  # loop so the sweep continues past the failed item/page.
  - id: verify_item
    type: module
    plugin_type: sub-workflow
    name: "Verify Item"
    error_handling:
      fallback_step: verify_item_failed
    config:
      # PER-ORG id of "Runtime Lifecycle — Verify Item (closer)"; patched by
      # setup/04-upload-workflows.mjs on upload.
      workflowId: runtime_lifecycle_verify_item
      waitForCompletion: true
    inputs:
      item: "${{ $item }}"
      catalog: "${{ steps.catalog_guard.outputs.catalog }}"

  # Accumulator: appends this page's per-item outputs into a workflow
  # variable. Runs once per page (set-variable defaults to executeMode='all').
  - id: acc_results
    type: module
    plugin_type: set-variable
    name: "Accumulate Item Results"
    metadata: { flipPorts: true }
    config:
      path: results
      value: "${{ concat(variables.results, $items) }}"

  # ── failure lane (fallback_step target) ──────────────────────────────────
  # NOT connected via a normal edge — the engine routes here only via
  # `error_handling.fallback_step` on `verify_item` above (terminal failure
  # after retries). `steps.fetch_items.outputs.items` is still THIS page's
  # item list at the moment the fallback fires (fetch_items has not been
  # asked for the next page yet), so it's the best-effort source for which
  # items were in flight — exact per-item attribution isn't available (the
  # engine discards the whole batch's aggregated results on any single
  # item's failure, see workflow-runner.ts fan-out dispatch).
  - id: verify_item_failed
    type: module
    plugin_type: code-exec
    name: "Stash Result: verification_failed (child failure)"
    metadata: { fanOutPerItem: false }
    inputs:
      error_message: "${{ steps.verify_item.error.message }}"
      error_code: "${{ steps.verify_item.error.code }}"
      page_items: "${{ steps.fetch_items.outputs.items }}"
    config:
      code: |
        var items = inputs.page_items || [];
        var ids = [];
        for (var i = 0; i < items.length; i++) {
          var it = items[i] || {};
          if (it.id) ids.push(it.id);
        }
        return {
          verdict: 'verification_failed',
          item_id: null,
          closed: false,
          error_code: inputs.error_code || 'UNKNOWN',
          error_message: String(inputs.error_message || 'verify_item failed'),
          affected_item_ids: ids
        };

  # DEDICATED single-predecessor accumulator for the failure lane (CLAUDE.md
  # § Join strategy: mixing a completed edge and a never-settled edge into
  # ONE downstream node deadlocks under the default `all` strategy — and
  # `acc_results` already has its own single edge from `verify_item`, whose
  # stale `items` from a PRIOR successful page would otherwise get pulled
  # into every subsequent page's accumulation if this shared the same node).
  # Same accumulator VARIABLE (`variables.results`), separate NODE.
  - id: acc_results_failed
    type: module
    plugin_type: set-variable
    name: "Accumulate Item Results (failure lane)"
    metadata: { flipPorts: true }
    config:
      path: results
      value: "${{ concat(variables.results, $items) }}"

  - id: summary
    type: module
    plugin_type: code-exec
    name: "Build Summary"
    # Aggregate step: NEVER dispatch per upstream item.
    metadata: { fanOutPerItem: false }
    # Reached either from fetch_items:done (catalog ok) or directly from
    # catalog_ok:false (empty catalog) — exactly one path fires per run.
    join_strategy: any
    inputs:
      results: "${{ variables.results }}"
      catalog_ok: "${{ steps.catalog_guard.outputs.ok }}"
      reason: "${{ steps.catalog_guard.outputs.reason }}"
    config:
      code: |
        var results = inputs.results || [];
        var counts = { skipped_human: 0, closed_deleted_scope: 0, closed_resolved: 0, still_open: 0, verification_failed: 0, other: 0 };
        for (var i = 0; i < results.length; i++) {
          // Live engine wraps each fan-out item as {outputs, _childExecutionId};
          // the E2E harness stubs return the outputs flat. Accept both.
          var r = (results[i] || {}).outputs || results[i] || {};
          var v = String(r.verdict || 'other');
          if (counts[v] === undefined) v = 'other';
          counts[v]++;
        }
        var catalogOk = inputs.catalog_ok === true;
        return {
          catalog_ok: catalogOk,
          reason: catalogOk ? null : inputs.reason,
          items_verified: results.length,
          skipped_human: counts.skipped_human,
          closed_deleted_scope: counts.closed_deleted_scope,
          closed_resolved: counts.closed_resolved,
          still_open: counts.still_open,
          verification_failed: counts.verification_failed,
          other: counts.other
        };

  - id: log_done
    type: module
    plugin_type: log
    name: "Closer Complete"
    config:
      level: info
      message: "Runtime lifecycle closer: ${{ steps.summary.outputs.items_verified }} items verified — closed (scope gone) ${{ steps.summary.outputs.closed_deleted_scope }}, closed (resolved) ${{ steps.summary.outputs.closed_resolved }}, still open ${{ steps.summary.outputs.still_open }}, skipped (human-owned) ${{ steps.summary.outputs.skipped_human }}, verification failed ${{ steps.summary.outputs.verification_failed }}. (catalog_ok=${{ steps.summary.outputs.catalog_ok }}, reason=${{ steps.summary.outputs.reason }})"

connections:
  - { id: c1,  from: start_manual,  to: read_catalog }
  - { id: c2,  from: start_cron,    to: read_catalog }
  - { id: c3,  from: read_catalog,  to: catalog_guard }
  - { id: c4,  from: catalog_guard, to: catalog_ok }
  - { id: c5,  from: catalog_ok,    to: fetch_items,    source_port: "true" }
  - { id: c6,  from: catalog_ok,    to: summary,        source_port: "false" }
  # fetch_items streams: `loop` port → verify_item (per-page items fan out).
  - { id: c7,  from: fetch_items,   to: verify_item,    source_port: loop }
  - { id: c8,  from: verify_item,   to: acc_results }
  # Declared so the graph knows verify_item_failed exists / is not an entry
  # point; permanently false — only ever reached via error_handling.fallback_step
  # on verify_item above (CLAUDE.md § Deciders/ports convention).
  - { id: c8f, from: verify_item,   to: verify_item_failed, condition: "false" }
  - { id: c8g, from: verify_item_failed, to: acc_results_failed }
  # Failure lane also re-enters fetch_items:callback so a page-level failure
  # doesn't stop later pages from being fetched.
  - { id: c8h, from: acc_results_failed, to: fetch_items, target_port: callback }
  # acc_results loops back into fetch_items:callback (reentry port) to pull
  # the next page. The engine soft-resets fetch_items' join state on each
  # reentry-edge settle so it can re-fire.
  - { id: c9,  from: acc_results,   to: fetch_items,    target_port: callback }
  # When fetch_items detects the last page, it activates `done`.
  - { id: c10, from: fetch_items,   to: summary,        source_port: done }
  - { id: c11, from: summary,       to: log_done }

outputs:
  catalog_ok:            "${{ steps.summary.outputs.catalog_ok }}"
  reason:                "${{ steps.summary.outputs.reason }}"
  items_verified:        "${{ steps.summary.outputs.items_verified }}"
  skipped_human:         "${{ steps.summary.outputs.skipped_human }}"
  closed_deleted_scope:  "${{ steps.summary.outputs.closed_deleted_scope }}"
  closed_resolved:       "${{ steps.summary.outputs.closed_resolved }}"
  still_open:            "${{ steps.summary.outputs.still_open }}"
  verification_failed:   "${{ steps.summary.outputs.verification_failed }}"
