# Sub-workflow: Lambda runtime lifecycle analysis for ONE serverless scope.
#
# Called by wf-r2 (streaming scanner) once per scope. Classifies the scope's
# current runtime against the `lambda_runtimes` catalog and ensures a single
# Engineering action item (idempotent by `metadata.scope_id` + label
# `workflow_type: lambda-runtime`) with an AI-free migration suggestion (the
# target runtime is picked deterministically from the catalog — no AI call).
#
# Verdicts (workflow output): ok | unknown_runtime | skipped_existing |
# priority_bumped | created | not_applicable. `not_applicable` is reserved
# for a future non-classification exclusion (e.g. feature-flagged scope) and
# is not produced by this revision — every path below resolves to one of the
# other five.
#
# Idempotency note (engine fact, hard-learned on the cost suite): the action
# item list endpoint's `status` filter is NOT honored server-side, so
# find_existing queries by `metadata.scope_id` + `labels.workflow_type` only
# (both ARE honored server-side) and `decide` re-filters the returned rows by
# status client-side to the "live" set (open, deferred, pending_deferral,
# pending_verification, pending_rejection — i.e. every ActionItemStatus that
# is not resolved/rejected/closed).
id: runtime_lifecycle_analyze_scope
name: "Runtime Lifecycle — Analyze Scope"
description: >
  Classifies one serverless scope's Lambda runtime against the lambda_runtimes
  catalog and ensures an Engineering action item (idempotent) with a
  deterministic migration suggestion when a target runtime exists.
path: "/runtime-lifecycle"
semantic_version: 1.0.0

inputs:
  scope:
    type: object
    required: true
    description: >
      Full NP Scope entity for the lambda under analysis: id, application_id,
      application_name, name, nrn, capabilities.serverless_runtime.id,
      dimensions.environment.
  catalog:
    type: object
    required: true
    description: "lambda_runtimes org metadata instance ({runtimes: [...], source_urls, scraped_at, ...})."
  force:
    type: boolean
    required: false
    description: >
      When a live item already exists and its priority already matches the
      freshly computed priority, force still PATCHes it (verdict
      priority_bumped) instead of skipping — useful to refresh an item on a
      manual re-run. Does not bypass idempotency on the create path (a live
      item is never duplicated).

variables:
  result: { initialValue: { scope_id: null, verdict: null, priority: null, item_id: null, target_runtime: null } }

steps:
  - id: start
    type: trigger
    plugin_type: manual
    name: "Start"
    config:
      description: "Analyzes one scope's Lambda runtime (normally invoked by wf-r2)."
      inputs:
        scope:
          type: object
          required: true
          description: "Scope row (see workflow description)"
        catalog:
          type: object
          required: true
          description: "lambda_runtimes catalog instance"
        force:
          type: boolean
          required: false

  # ── Classify against the catalog (pure function of scope + catalog) ────
  - id: classify
    type: module
    plugin_type: code-exec
    name: "Classify Runtime Against Catalog"
    metadata: { fanOutPerItem: false }
    inputs:
      scope: "${{ workflow.inputs.scope }}"
      catalog: "${{ workflow.inputs.catalog }}"
    config:
      code: |
        function parseRuntime(id) {
          id = String(id || '');
          if (id.indexOf('provided') === 0) {
            return { language: 'provided', version: id.split('.').slice(1).join('.') };
          }
          var m = id.match(/^([a-z]+)([0-9]+(?:\.[0-9]+)?)/);
          return m ? { language: m[1], version: m[2] } : { language: id, version: '' };
        }
        function verNum(v) {
          var p = String(v).split('.');
          var a = Number(String(p[0] || '').replace(/[^0-9]/g, '')) || 0;
          var b = Number(String(p[1] || '').replace(/[^0-9]/g, '')) || 0;
          return a * 1000 + b;
        }
        // entry = catalog row for the scope's runtime (or null/undefined if unknown)
        function classify(entry, todayMs) {
          if (!entry) return { verdict: 'unknown_runtime' };
          var dep = entry.deprecation_date ? Date.parse(entry.deprecation_date) : null;
          if (entry.status === 'deprecated' || (dep !== null && dep <= todayMs)) {
            return { verdict: 'deprecated', priority: 'critical', deprecation_ms: dep };
          }
          if (dep !== null && dep - todayMs <= 31 * 86400000) {
            return { verdict: 'expiring', priority: 'high', deprecation_ms: dep };
          }
          return { verdict: 'ok' };
        }
        // Minimum supported same-language runtime that exits deprecation and is not
        // itself deprecating within 180 days; falls back to the highest supported.
        function pickTarget(currentId, runtimes, todayMs) {
          var cur = parseRuntime(currentId);
          var HORIZON = 180 * 86400000;
          var cands = [];
          for (var i = 0; i < (runtimes || []).length; i++) {
            var r = runtimes[i];
            if (r.status !== 'supported') continue;
            var p = parseRuntime(r.id);
            if (p.language !== cur.language) continue;
            if (verNum(p.version) <= verNum(cur.version)) continue;
            cands.push({ id: r.id, v: verNum(p.version), dep: r.deprecation_date ? Date.parse(r.deprecation_date) : null });
          }
          cands.sort(function (a, b) { return a.v - b.v; });
          for (var j = 0; j < cands.length; j++) {
            if (cands[j].dep === null || cands[j].dep - todayMs > HORIZON) return cands[j].id;
          }
          return cands.length ? cands[cands.length - 1].id : null;
        }

        var scope = inputs.scope || {};
        var cat = (inputs.catalog || {}).runtimes || [];
        var rt = ((scope.capabilities || {}).serverless_runtime || {}).id || '';
        var env = String((scope.dimensions || {}).environment || 'development').toLowerCase();
        var today = Date.now();
        var entry = null;
        for (var i = 0; i < cat.length; i++) if (cat[i].id === rt) { entry = cat[i]; break; }
        var c = classify(entry, today);
        var target = (c.verdict === 'deprecated' || c.verdict === 'expiring') ? pickTarget(rt, cat, today) : null;
        return {
          scope_id: String(scope.id), application_id: String(scope.application_id || ''),
          application_name: scope.application_name || '', scope_name: scope.name || '',
          runtime: rt, environment: env, is_prod: env === 'production',
          verdict: c.verdict, priority: c.priority || null,
          deprecation_date: entry ? entry.deprecation_date : null,
          block_function_update: entry ? entry.block_function_update : null,
          target_runtime: target,
          // no target (e.g. whole language family dead, like go1.x) → still open the
          // item, but the suggestion is skipped; the description says "manual migration".
          has_target: !!target
        };

  - id: needs_item
    type: decider
    plugin_type: conditional
    name: "Deprecated or Expiring?"
    config:
      expression: "steps.classify.outputs.verdict == 'deprecated' || steps.classify.outputs.verdict == 'expiring'"

  - id: stash_no_action
    type: module
    plugin_type: set-variable
    name: "Stash Result: ok / unknown_runtime"
    inputs:
      sid: "${{ steps.classify.outputs.scope_id }}"
      v: "${{ steps.classify.outputs.verdict }}"
    config:
      path: result
      value:
        scope_id: "${{ inputs.sid }}"
        # classify's verdict values 'ok' and 'unknown_runtime' ARE the
        # workflow-level verdict values here — no mapping needed.
        verdict: "${{ inputs.v }}"
        priority: null
        item_id: null
        target_runtime: null

  # ── Idempotency search ──────────────────────────────────────────────────
  # Filters by metadata.scope_id + labels.workflow_type (both honored
  # server-side). status is deliberately NOT sent — the list endpoint
  # ignores it — `decide` below re-filters the returned rows client-side.
  - id: find_existing
    type: module
    plugin_type: np-api-call
    name: "Find Existing Item"
    inputs:
      scope_id: "${{ steps.classify.outputs.scope_id }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/governance/action_item"
      query:
        nrn: "organization=${{ vars.NP_ORGANIZATION_ID }}"
        "metadata.scope_id": "${{ inputs.scope_id }}"
        "labels.workflow_type": "lambda-runtime"
        limit: 50

  - id: decide
    type: module
    plugin_type: code-exec
    name: "Decide: Skip / Bump / Create"
    metadata: { fanOutPerItem: false }
    inputs:
      verdict: "${{ steps.classify.outputs.verdict }}"
      body: "${{ steps.find_existing.outputs.body }}"
      force: "${{ workflow.inputs.force }}"
    config:
      code: |
        // "Live" = every ActionItemStatus that is not resolved/rejected/closed
        // (matches np-action-item-find's own default pending set) — the list
        // endpoint's status filter is ignored server-side, so this is the
        // ONLY status filtering that actually applies.
        var LIVE = { open: 1, deferred: 1, pending_deferral: 1, pending_verification: 1, pending_rejection: 1 };
        var body = inputs.body;
        var results = (body && Array.isArray(body.results)) ? body.results : [];
        var live = [];
        for (var i = 0; i < results.length; i++) {
          var it = results[i] || {};
          if (LIVE[it.status] === 1) live.push(it);
        }
        var force = inputs.force === true || String(inputs.force) === 'true';
        var verdict = inputs.verdict;
        if (live.length > 0) {
          var existing = live[0];
          // Only bump direction is high→critical (the runtime crossed into
          // deprecated); expiring never downgrades an existing item.
          var mustBump = verdict === 'deprecated' && existing.priority !== 'critical';
          if (mustBump || force) {
            var toPriority = verdict === 'deprecated' ? 'critical' : (verdict === 'expiring' ? 'high' : existing.priority);
            return { route: 'bump', item_id: existing.id, from_priority: existing.priority, to_priority: toPriority };
          }
          return { route: 'skip', item_id: existing.id };
        }
        return { route: 'create', item_id: null };

  # Deciders run in-sandbox (ports always known) — safe to wire all three.
  - id: route
    type: decider
    plugin_type: case
    name: "Route Decision"
    config:
      expression: "steps.decide.outputs.route"
      cases:
        - { match: "skip", port: "skip" }
        - { match: "bump", port: "bump" }
        - { match: "create", port: "create" }

  - id: stash_skipped
    type: module
    plugin_type: set-variable
    name: "Stash Result: skipped_existing"
    inputs:
      sid: "${{ steps.classify.outputs.scope_id }}"
      iid: "${{ steps.decide.outputs.item_id }}"
      pr: "${{ steps.classify.outputs.priority }}"
      tr: "${{ steps.classify.outputs.target_runtime }}"
    config:
      path: result
      value:
        scope_id: "${{ inputs.sid }}"
        verdict: "skipped_existing"
        priority: "${{ inputs.pr }}"
        item_id: "${{ inputs.iid }}"
        target_runtime: "${{ inputs.tr }}"

  # ── bump path ────────────────────────────────────────────────────────────
  - id: bump_priority
    type: module
    plugin_type: np-api-call
    name: "Bump Priority"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    inputs:
      item_id: "${{ steps.decide.outputs.item_id }}"
      to_priority: "${{ steps.decide.outputs.to_priority }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: PATCH
      path: "/governance/action_item/${{ inputs.item_id }}"
      body:
        priority: "${{ inputs.to_priority }}"

  - id: stash_bumped
    type: module
    plugin_type: set-variable
    name: "Stash Result: priority_bumped"
    inputs:
      sid: "${{ steps.classify.outputs.scope_id }}"
      iid: "${{ steps.decide.outputs.item_id }}"
      pr: "${{ steps.decide.outputs.to_priority }}"
      tr: "${{ steps.classify.outputs.target_runtime }}"
    config:
      path: result
      value:
        scope_id: "${{ inputs.sid }}"
        verdict: "priority_bumped"
        priority: "${{ inputs.pr }}"
        item_id: "${{ inputs.iid }}"
        target_runtime: "${{ inputs.tr }}"

  # ── create path ──────────────────────────────────────────────────────────
  # Builds BOTH the item payload and (when has_target) the suggestion payload
  # in one place — mirrors the cost suite's wf2b-right-sizing-analyze-scope
  # build_item builder (docs/ai-suggestions-ux.md pattern: schema sent
  # directly as user_metadata_config, defaults seeded into user_metadata).
  - id: build_item
    type: module
    plugin_type: code-exec
    name: "Build Item + Suggestion Payload"
    metadata: { fanOutPerItem: false }
    inputs:
      c: "${{ steps.classify.outputs }}"
      catalog: "${{ workflow.inputs.catalog }}"
      nrn: "${{ workflow.inputs.scope.nrn }}"
    config:
      code: |
        var c = inputs.c || {};
        var rt = c.runtime;
        var scopeId = c.scope_id;
        var appId = c.application_id;
        var appName = c.application_name;
        var scopeName = c.scope_name;
        var env = c.environment;
        var isProd = c.is_prod === true;
        var verdict = c.verdict;
        var priority = c.priority;
        var depDate = c.deprecation_date;
        var blockUpdate = c.block_function_update;
        var target = c.target_runtime;
        var hasTarget = c.has_target === true;

        // block_function_create isn't part of classify's output (shared-logic
        // contract is fixed) — re-derived here from the catalog for the date
        // table, which per the item-content spec shows all three dates.
        var cat = (inputs.catalog || {}).runtimes || [];
        var entry = null;
        for (var i = 0; i < cat.length; i++) if (cat[i].id === rt) { entry = cat[i]; break; }
        var blockCreate = entry ? entry.block_function_create : null;

        function fmt(d) { return d ? String(d) : '—'; }

        var title = 'Lambda runtime ' + rt + ' ' +
          (verdict === 'deprecated' ? 'is deprecated' : 'deprecates on ' + fmt(depDate)) +
          ' — ' + appName + '/' + scopeName;

        var dateTable = [
          '| date | value |',
          '|---|---|',
          '| Deprecation | ' + fmt(depDate) + ' |',
          '| Block function create | ' + fmt(blockCreate) + ' |',
          '| Block function update | ' + fmt(blockUpdate) + ' |'
        ].join('\n');

        var consequenceLine = 'After **block function update**, you will not be able to update this ' +
          'function\'s configuration or code at all — **not even to ship a fix** — until the runtime ' +
          'is upgraded.';

        var descLines = [
          '## Lambda runtime lifecycle',
          '',
          'Scope **' + scopeName + '** (application **' + appName + '**, environment **' + env + '**) ' +
            'is running AWS Lambda runtime **' + rt + '**, which is ' +
            (verdict === 'deprecated' ? '**already deprecated**' : '**deprecating soon**') + '.',
          '',
          dateTable,
          '',
          consequenceLine
        ];
        if (hasTarget) {
          descLines.push('');
          descLines.push('Recommended migration target: **' + target + '**.');
        } else {
          descLines.push('');
          descLines.push('No supported successor runtime was found in the catalog for this language — manual migration required.');
        }

        var result = {
          nrn: inputs.nrn,
          title: title,
          description: descLines.join('\n'),
          priority: priority,
          metadata: {
            runtime_item: true,
            scope_id: scopeId,
            application_id: appId,
            environment: env,
            current_runtime: rt,
            target_runtime: target,
            deprecation_date: depDate,
            block_function_update: blockUpdate
          },
          labels: { workflow_type: 'lambda-runtime' },
          has_target: hasTarget
        };

        if (hasTarget) {
          var choiceLine = isProd
            ? '**Production policy:** approving this suggestion only applies the runtime configuration ' +
              'change — it never triggers a deploy; the change ships with your next regular deployment.'
            : '**Your choice on approve:** deploy now, ship with the next deploy, or schedule it at a specific time.';
          result.suggestion_description = [
            '**Migrate ' + scopeName + '** — runtime **' + rt + ' → ' + target + '**',
            '',
            'Why: ' + (verdict === 'deprecated'
              ? 'the current runtime is already deprecated.'
              : 'the current runtime deprecates on ' + fmt(depDate) + '.'),
            '',
            dateTable,
            '',
            choiceLine
          ].join('\n');
          result.suggestion_metadata = {
            action_type: 'runtime_upgrade',
            scope_id: scopeId,
            from_runtime: rt,
            to_runtime: target
          };
          if (isProd) {
            result.user_metadata_config = {
              type: 'object',
              properties: {
                deploy_timing: {
                  type: 'string',
                  title: 'How to apply',
                  oneOf: [{ const: 'apply-only', title: 'Apply runtime config only (ships with the next regular deploy)' }],
                  default: 'apply-only'
                }
              }
            };
            result.user_metadata_defaults = { deploy_timing: 'apply-only' };
          } else {
            result.user_metadata_config = {
              type: 'object',
              properties: {
                deploy_timing: {
                  type: 'string',
                  title: 'How to apply',
                  oneOf: [
                    { const: 'deploy-now', title: 'Deploy now' },
                    { const: 'next-deploy', title: 'With the next deploy' },
                    { const: 'scheduled', title: 'Schedule (set time below)' }
                  ],
                  default: 'deploy-now'
                },
                deploy_at: {
                  type: 'string',
                  title: 'Scheduled time (optional)',
                  description: 'ISO-8601 timestamp, e.g. 2026-07-25T14:00:00Z. Leave blank to deploy immediately.',
                  default: ''
                }
              }
            };
            result.user_metadata_defaults = { deploy_timing: 'deploy-now', deploy_at: '' };
          }
        }
        return result;

  - id: create_item
    type: module
    plugin_type: np-api-call
    name: "Create Action Item"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    inputs:
      nrn: "${{ steps.build_item.outputs.nrn }}"
      title: "${{ steps.build_item.outputs.title }}"
      description: "${{ steps.build_item.outputs.description }}"
      priority: "${{ steps.build_item.outputs.priority }}"
      metadata: "${{ steps.build_item.outputs.metadata }}"
      labels: "${{ steps.build_item.outputs.labels }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: POST
      path: "/governance/action_item"
      body:
        nrn: "${{ inputs.nrn }}"
        title: "${{ inputs.title }}"
        created_by: "agent:runtime-lifecycle"
        category_slug: "${{ vars.RUNTIME_LIFECYCLE_CATEGORY_SLUG }}"
        description: "${{ inputs.description }}"
        priority: "${{ inputs.priority }}"
        metadata: "${{ inputs.metadata }}"
        labels: "${{ inputs.labels }}"

  # Suggestion only when a target runtime exists (e.g. NOT for go1.x — no
  # successor in the same language).
  - id: should_suggest
    type: decider
    plugin_type: conditional
    name: "Has Migration Target?"
    config:
      expression: "steps.build_item.outputs.has_target == true"

  - id: suggest_apply
    type: module
    plugin_type: np-api-call
    name: "Create Migration Suggestion"
    inputs:
      item_id: "${{ steps.create_item.outputs.body.id }}"
      description: "${{ steps.build_item.outputs.suggestion_description }}"
      metadata: "${{ steps.build_item.outputs.suggestion_metadata }}"
      user_metadata: "${{ steps.build_item.outputs.user_metadata_defaults }}"
      user_metadata_config: "${{ steps.build_item.outputs.user_metadata_config }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: POST
      path: "/governance/action_item/${{ inputs.item_id }}/suggestions"
      body:
        created_by: "agent:runtime-lifecycle"
        owner: "executor:runtime-lifecycle-applier"
        description: "${{ inputs.description }}"
        metadata: "${{ inputs.metadata }}"
        user_metadata: "${{ inputs.user_metadata }}"
        user_metadata_config: "${{ inputs.user_metadata_config }}"

  - id: stash_created
    type: module
    plugin_type: set-variable
    name: "Stash Result: created"
    # Reached with the suggestion (has_target true) or directly (go1.x-style
    # no-successor case) — exactly one path fires.
    join_strategy: any
    inputs:
      sid: "${{ steps.classify.outputs.scope_id }}"
      iid: "${{ steps.create_item.outputs.body.id }}"
      pr: "${{ steps.classify.outputs.priority }}"
      tr: "${{ steps.classify.outputs.target_runtime }}"
    config:
      path: result
      value:
        scope_id: "${{ inputs.sid }}"
        verdict: "created"
        priority: "${{ inputs.pr }}"
        item_id: "${{ inputs.iid }}"
        target_runtime: "${{ inputs.tr }}"

  - id: summary
    type: module
    plugin_type: code-exec
    name: "Build Summary"
    metadata: { fanOutPerItem: false }
    join_strategy: any
    inputs:
      data: "${{ variables.result }}"
    config:
      code: |
        return inputs.data;

connections:
  - { id: c1,  from: start,           to: classify }
  - { id: c2,  from: classify,        to: needs_item }
  - { id: c3,  from: needs_item,      to: find_existing,   source_port: "true" }
  - { id: c4,  from: needs_item,      to: stash_no_action, source_port: "false" }
  - { id: c5,  from: find_existing,   to: decide }
  - { id: c6,  from: decide,          to: route }
  - { id: c7,  from: route,           to: stash_skipped,   source_port: "skip" }
  - { id: c8,  from: route,           to: bump_priority,   source_port: "bump" }
  - { id: c9,  from: route,           to: build_item,      source_port: "create" }
  - { id: c10, from: bump_priority,   to: stash_bumped }
  - { id: c11, from: build_item,      to: create_item }
  - { id: c12, from: create_item,     to: should_suggest }
  - { id: c13, from: should_suggest,  to: suggest_apply,   source_port: "true" }
  - { id: c14, from: should_suggest,  to: stash_created,   source_port: "false" }
  - { id: c15, from: suggest_apply,   to: stash_created }
  - { id: c16, from: stash_no_action, to: summary }
  - { id: c17, from: stash_skipped,   to: summary }
  - { id: c18, from: stash_bumped,    to: summary }
  - { id: c19, from: stash_created,   to: summary }

outputs:
  scope_id: "${{ steps.summary.outputs.scope_id }}"
  verdict: "${{ steps.summary.outputs.verdict }}"
  priority: "${{ steps.summary.outputs.priority }}"
  item_id: "${{ steps.summary.outputs.item_id }}"
  target_runtime: "${{ steps.summary.outputs.target_runtime }}"
