# Sub-workflow: closer verification for ONE lambda-runtime action item.
#
# Called by wf-r5 (closer) once per item (streaming fan-out over the
# lambda-runtime item list). The closer only CLOSES — it never reopens a
# resolved item (that is wf-r3's onResolved gate, at resolve time).
#
# Status guard (double-guard, per the plan): only an `open` item is acted on.
# Every other status — deferred/pending_deferral/pending_verification/
# pending_rejection (still human-owned, reconciliation rule) AND
# resolved/rejected/closed (terminal; shouldn't even be in the fetched list,
# but a stray one must still be left untouched) — is `skipped_human` with NO
# side effects.
#
# For an `open` item:
#   - scope 404 / status deleted|stopped → close, comment "scope no longer
#     active".
#   - else run the SAME compliance check as wf-r3's gate (Task 0 verdict,
#     docs/superpowers/plans/... scratchpad deployment-shape.md): scope
#     config on a catalog-`supported` runtime AND the currently-active
#     deployment is at least as new as the item's runtime_patched_at stamp
#     (or scope.updated_at as a fallback for a manual fix). Compliant → close
#     with a comment naming the runtime; not compliant → leave the item open,
#     zero side effects (still_open — the item stays live for a future run).
id: runtime_lifecycle_verify_item
name: "Runtime Lifecycle — Verify Item (closer)"
description: >
  Verifies one lambda-runtime action item's outcome: closes it when the
  scope is gone or its runtime/deployment are compliant, leaves it open
  otherwise, and never touches items owned by a human (deferred/pending) or
  already terminal.
path: "/runtime-lifecycle"
semantic_version: 1.0.0

inputs:
  item:
    type: object
    required: true
    description: "Action item row (id, status, metadata.scope_id, metadata.runtime_patched_at)."
  catalog:
    type: object
    required: true
    description: "lambda_runtimes org metadata instance ({runtimes: [...], ...}), passed through from the closer."

variables:
  result: { initialValue: { verdict: null, item_id: null, closed: false } }

steps:
  - id: start
    type: trigger
    plugin_type: manual
    name: "Start"
    config:
      description: "Verifies one lambda-runtime action item's outcome (normally invoked by wf-r5)."
      inputs:
        item:
          type: object
          required: true
          description: "Action item row (see workflow description)"
        catalog:
          type: object
          required: true
          description: "lambda_runtimes catalog instance"

  # ── Status guard: only `open` items are acted on ────────────────────────
  - id: status_guard
    type: module
    plugin_type: code-exec
    name: "Status Guard: Open Only"
    metadata: { fanOutPerItem: false }
    inputs:
      item: "${{ workflow.inputs.item }}"
    config:
      code: |
        var item = inputs.item || {};
        var status = String(item.status || '').toLowerCase();
        var meta = item.metadata || {};
        return {
          open: status === 'open',
          status: status,
          item_id: item.id || null,
          scope_id: meta.scope_id || null
        };

  - id: is_open
    type: decider
    plugin_type: conditional
    name: "Item Open?"
    config:
      expression: "steps.status_guard.outputs.open == true"

  - id: stash_skipped
    type: module
    plugin_type: set-variable
    name: "Stash Result: skipped_human"
    inputs:
      iid: "${{ steps.status_guard.outputs.item_id }}"
    config:
      path: result
      value:
        verdict: "skipped_human"
        item_id: "${{ inputs.iid }}"
        closed: false

  # ── open: fetch the scope ────────────────────────────────────────────────
  - id: fetch_scope
    type: module
    plugin_type: np-api-call
    name: "Get Scope"
    inputs:
      scope_id: "${{ steps.status_guard.outputs.scope_id }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/scope/${{ inputs.scope_id }}"
      # 404 = scope gone — that IS a valid "close" case, not a hard error.
      failOnHttpError: false

  - id: scope_check
    type: module
    plugin_type: code-exec
    name: "Scope Still Active?"
    metadata: { fanOutPerItem: false }
    inputs:
      status: "${{ steps.fetch_scope.outputs.status }}"
      scope: "${{ steps.fetch_scope.outputs.body }}"
    config:
      code: |
        var scope = inputs.scope || {};
        var scopeStatus = String(scope.status || '').toLowerCase();
        var gone = inputs.status === 404 || scopeStatus === 'deleted' || scopeStatus === 'stopped';
        return { gone: gone, scope: scope };

  - id: scope_gone
    type: decider
    plugin_type: conditional
    name: "Scope Gone?"
    config:
      expression: "steps.scope_check.outputs.gone == true"

  # ── scope gone: close, comment "scope no longer active" ─────────────────
  - id: comment_deleted
    type: module
    plugin_type: np-action-item-add-comment
    name: "Comment: Scope Gone"
    inputs:
      item_id: "${{ steps.status_guard.outputs.item_id }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      actionItemId: "${{ inputs.item_id }}"
      author: "agent:runtime-lifecycle"
      content: "scope no longer active"

  - id: close_deleted
    type: module
    plugin_type: np-action-item-update
    name: "Close: Scope Gone"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    inputs:
      item_id: "${{ steps.status_guard.outputs.item_id }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      actionItemId: "${{ inputs.item_id }}"
      action: close
      actor: "agent:runtime-lifecycle"
      reason: "scope no longer active"

  - id: stash_deleted
    type: module
    plugin_type: set-variable
    name: "Stash Result: closed_deleted_scope"
    inputs:
      iid: "${{ steps.status_guard.outputs.item_id }}"
    config:
      path: result
      value:
        verdict: "closed_deleted_scope"
        item_id: "${{ inputs.iid }}"
        closed: true

  # ── scope alive: run the SAME compliance check as wf-r3's gate ──────────
  - id: fetch_deployments
    type: module
    plugin_type: np-api-call
    name: "Get Deployments"
    inputs:
      scope_id: "${{ steps.status_guard.outputs.scope_id }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      method: GET
      path: "/deployment"
      query:
        scope_id: "${{ inputs.scope_id }}"
        limit: 20
      failOnHttpError: false

  # Pure function of item + scope + deployments + catalog — parseRuntime /
  # verNum / classify pasted verbatim (plan's Shared logic section; workflow
  # steps can't import). deployedOk is the Task 0 verdict, mirrored EXACTLY
  # from wf-r3-events.yaml gate_check (same deployment-shape.md math).
  - id: compliance_check
    type: module
    plugin_type: code-exec
    name: "Compliance Check"
    metadata: { fanOutPerItem: false }
    inputs:
      item: "${{ workflow.inputs.item }}"
      scope: "${{ steps.scope_check.outputs.scope }}"
      deployments: "${{ steps.fetch_deployments.outputs.body.results }}"
      catalog: "${{ workflow.inputs.catalog }}"
    config:
      code: |
        function parseRuntime(id) {
          id = String(id || '');
          if (id.indexOf('provided') === 0) {
            return { language: 'provided', version: id.split('.').slice(1).join('.') };
          }
          var m = id.match(/^([a-z]+)([0-9]+(?:\.[0-9]+)?)/);
          return m ? { language: m[1], version: m[2] } : { language: id, version: '' };
        }
        function verNum(v) {
          var p = String(v).split('.');
          var a = Number(String(p[0] || '').replace(/[^0-9]/g, '')) || 0;
          var b = Number(String(p[1] || '').replace(/[^0-9]/g, '')) || 0;
          return a * 1000 + b;
        }
        // entry = catalog row for the scope's runtime (or null/undefined if unknown)
        function classify(entry, todayMs) {
          if (!entry) return { verdict: 'unknown_runtime' };
          var dep = entry.deprecation_date ? Date.parse(entry.deprecation_date) : null;
          if (entry.status === 'deprecated' || (dep !== null && dep <= todayMs)) {
            return { verdict: 'deprecated', priority: 'critical', deprecation_ms: dep };
          }
          if (dep !== null && dep - todayMs <= 31 * 86400000) {
            return { verdict: 'expiring', priority: 'high', deprecation_ms: dep };
          }
          return { verdict: 'ok' };
        }

        var scope = inputs.scope || {};
        var cat = (inputs.catalog || {}).runtimes || [];
        var rt = ((scope.capabilities || {}).serverless_runtime || {}).id || '';
        var entry = null;
        for (var i = 0; i < cat.length; i++) if (cat[i].id === rt) { entry = cat[i]; break; }
        var c = classify(entry, Date.now());
        var configOk = c.verdict === 'ok';

        // deployedOk (Task 0 verdict, deployment-shape.md): the deployment
        // API has no runtime snapshot, so compliance is inferred by TIME —
        // the currently-active deployment must be at least as new as the
        // runtime_patched_at stamp (or scope.updated_at as a fallback for a
        // manual fix).
        var act = null;
        for (var j = 0; j < (inputs.deployments || []).length; j++) {
          var d = inputs.deployments[j];
          if (d.status_in_scope === 'active') {
            if (!act || Date.parse(d.created_at) > Date.parse(act.created_at)) act = d;
          }
        }
        var patchedAt = (inputs.item && inputs.item.metadata && inputs.item.metadata.runtime_patched_at)
          ? Date.parse(inputs.item.metadata.runtime_patched_at)
          : Date.parse(scope.updated_at);
        var deployedOk = !!act && Date.parse(act.created_at) >= patchedAt;

        return {
          compliant: configOk && deployedOk,
          runtime: rt
        };

  - id: compliant
    type: decider
    plugin_type: conditional
    name: "Compliant?"
    config:
      expression: "steps.compliance_check.outputs.compliant == true"

  # ── compliant: close, comment naming the runtime ─────────────────────────
  - id: comment_resolved
    type: module
    plugin_type: np-action-item-add-comment
    name: "Comment: Resolved"
    inputs:
      item_id: "${{ steps.status_guard.outputs.item_id }}"
      runtime: "${{ steps.compliance_check.outputs.runtime }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      actionItemId: "${{ inputs.item_id }}"
      author: "agent:runtime-lifecycle"
      content: "resolved: active deployment on ${{ inputs.runtime }}"

  - id: close_resolved
    type: module
    plugin_type: np-action-item-update
    name: "Close: Resolved"
    error_handling:
      retry_policy:
        max_attempts: 3
        initial_interval: "2s"
        backoff_strategy: exponential
        jitter: 0.3
    inputs:
      item_id: "${{ steps.status_guard.outputs.item_id }}"
      runtime: "${{ steps.compliance_check.outputs.runtime }}"
    config:
      apiKey: "${{ secrets.NP_API_KEY }}"
      actionItemId: "${{ inputs.item_id }}"
      action: close
      actor: "agent:runtime-lifecycle"
      reason: "resolved: active deployment on ${{ inputs.runtime }}"

  - id: stash_resolved
    type: module
    plugin_type: set-variable
    name: "Stash Result: closed_resolved"
    inputs:
      iid: "${{ steps.status_guard.outputs.item_id }}"
    config:
      path: result
      value:
        verdict: "closed_resolved"
        item_id: "${{ inputs.iid }}"
        closed: true

  # ── not compliant: leave open, zero side effects ─────────────────────────
  - id: stash_still_open
    type: module
    plugin_type: set-variable
    name: "Stash Result: still_open"
    inputs:
      iid: "${{ steps.status_guard.outputs.item_id }}"
    config:
      path: result
      value:
        verdict: "still_open"
        item_id: "${{ inputs.iid }}"
        closed: false

  - id: summary
    type: module
    plugin_type: code-exec
    name: "Build Summary"
    metadata: { fanOutPerItem: false }
    # Converges every branch (skipped / closed_deleted_scope / closed_resolved
    # / still_open) — exactly one fires per run.
    join_strategy: any
    inputs:
      data: "${{ variables.result }}"
    config:
      code: |
        return inputs.data;

connections:
  - { id: c1,  from: start,             to: status_guard }
  - { id: c2,  from: status_guard,      to: is_open }
  - { id: c3,  from: is_open,           to: fetch_scope,      source_port: "true" }
  - { id: c4,  from: is_open,           to: stash_skipped,    source_port: "false" }
  - { id: c5,  from: fetch_scope,       to: scope_check }
  - { id: c6,  from: scope_check,       to: scope_gone }
  - { id: c7,  from: scope_gone,        to: comment_deleted,  source_port: "true" }
  - { id: c8,  from: comment_deleted,   to: close_deleted }
  - { id: c9,  from: close_deleted,     to: stash_deleted }
  - { id: c10, from: scope_gone,        to: fetch_deployments, source_port: "false" }
  - { id: c11, from: fetch_deployments, to: compliance_check }
  - { id: c12, from: compliance_check,  to: compliant }
  - { id: c13, from: compliant,         to: comment_resolved, source_port: "true" }
  - { id: c14, from: comment_resolved,  to: close_resolved }
  - { id: c15, from: close_resolved,    to: stash_resolved }
  - { id: c16, from: compliant,         to: stash_still_open, source_port: "false" }
  - { id: c17, from: stash_skipped,     to: summary }
  - { id: c18, from: stash_deleted,     to: summary }
  - { id: c19, from: stash_resolved,    to: summary }
  - { id: c20, from: stash_still_open,  to: summary }

outputs:
  verdict:  "${{ steps.summary.outputs.verdict }}"
  item_id:  "${{ steps.summary.outputs.item_id }}"
  closed:   "${{ steps.summary.outputs.closed }}"
